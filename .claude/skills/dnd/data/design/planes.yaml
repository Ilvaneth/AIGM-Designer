# planes.yaml — the cosmology's planes (item 5, planes). The baseline is the SRD 5.1 appendix
# "The Planes of Existence": the Material Plane, the two Transitive Planes (Ethereal, Astral), the
# four Elemental Planes inside the Elemental Chaos, the sixteen Outer Planes by alignment (the SRD
# text names only three, and of those only the Nine Hells is kept: Elysium and Hades are real-world
# mythology, banned by errata 24.2 #19, and the other thirteen names are Product Identity in the SRD's
# legal notice; every such plane is described under a label of this table's own, and the campaign
# names the ones it touches), a true-neutral hub if the world has one, and demiplanes. The designer decides per plane
# whether it exists unchanged, is renamed / altered / merged / removed by a trope break, and which
# planes are TOUCHED (scale.yaml `planes_touched`): a touched plane is a `plane_` entity with a
# way in, a cost, a site and a time rate (`calendar.py plane enter --rate`). Untouched planes still
# exist for spells (Banishment, Plane Shift, Etherealness, Astral Projection, Gate), and the primer
# carries one rule line: plane-referencing spells work according to THIS world's cosmology.
schema_version: 1
table: planes
consumed_by: [P2, P6, P8]
plan: "item 5 (planes), 17 #10, item 18.3; build item 22 (docs/p2-tags.md S3, the tag pass)"
layer: texture             # build item 22a (S0 #1): a touched plane's deviation, rate, way in and cost; the baseline is stage
roll: {labels: [P2.plane_deviation.<baseline id>, P2.plane_touched.<n>, P2.plane_rate.<n>, P2.plane_way.<n>, P2.plane_cost.<n>], avoid_used: false, note: "deviation is rolled per baseline row the tone or a break flags; touched planes are chosen, then rate / way / cost are rolled per touched plane"}
rules:
  touched_count: "scale.yaml planes_touched, plus the magic dial's planes_touched_modifier, never below 1; the planes P1 names are seated first and shared to fit the count (one plane at short); the moon takes a seat when it is a place; at epic the threat's home plane takes one free seat (secret)"
  moon_seat: "when moon_is_a_plane or break_moon_trades holds, the moon is a touched seat of its own: no baseline row, deviation dev_is_this_world, its way in, cost and rate rolled like any touched plane's, its name from the pool"
  home_of: "a baseline row's `home_of` lists the threat families (antagonists.yaml#villain_family) whose home it is: a family id, or {family, creatures} when the home is per creature, or {family, by: alignment} for a god; a family on no row has no home plane"
  sets:      # the tag pass's names for groups of baseline rows (22b resolves them)
    non_material: "every baseline row but baseline_material and baseline_demiplane"
    inner: [baseline_air, baseline_earth, baseline_fire, baseline_water]
    upper: "the outer rows of tier upper"
    lower: "the outer rows of tier lower"
  plane_fits:     # the tag pass's fits that hold for one touched plane only (22b applies them to that plane's rolls)
    - {table: time_rate, rows: [rate_slow, rate_fast, rate_stopped, rate_seasonal, rate_bargained], x: 2, when: [ruin_broken_time, scar_time_flow_changed], on: "the ruin's or the scar's plane"}
  named_planes:   # the tag pass (docs/reports/p2-tags-draft.md §6.1): a P1 row that names a plane draws it among these
    land_thin_place: {fits: [non_material]}
    target_thin_place: {fits: [non_material]}
    ruin_celestial_war: {fits: [upper, lower], one_of_each: true}
    ruin_elven_withdrawal: {fits: [baseline_fey_echo, baseline_cg], weight: {baseline_fey_echo: 3}}
    ruin_planar_rift: {fits: [non_material]}
    ruin_planar_invasion: {fits: [lower, inner]}
    ruin_devils_bargain: {fits: [baseline_nine_hells]}
    ruin_demon_gate: {fits: [baseline_ce]}
    ruin_sleeping_realm: {fits: [baseline_astral, baseline_fey_echo]}
    ruin_star_kingdom: {fits: [baseline_beyond]}
    act_merged_with_plane: {fits: [non_material]}
    scar_plane_thinned: {fits: [non_material]}
    break_dreams_are_a_place: {fits: [baseline_astral]}
    break_moon_trades: {fits: [moon]}
    spine_two_worlds: {fits: [non_material]}
  touched_plane_carries: [way_in, cost, site (a site_ entity with a fixed tier), time_rate, keeper (a power or a creature), what_it_wants_from_visitors]
  untouched: "exists for spells; a local name is optional; no site, no entity unless a break names it"
  primer_line: "one sentence per plane the folk have a word for; the rule that spells follow this cosmology"
  calendar: "time_rate rows give the `--rate` (material minutes per local minute) or `--rate-range` calendar.py takes"
hooks_common:
  - {phase: P2, must: "the cosmology's Planes section lists the baseline verdict per plane, the touched planes with all six fields, and the primer rule line"}
  - {phase: P2, must: "an outer plane the campaign touches has a local name and says which god or power holds it; if a break removes one, banishment to its alignment goes elsewhere"}
  - {phase: P8, must: "the primer names only the planes a native has a word for"}

tables:

  baseline:
    layer: stage            # build item 22a (S0 #1): the planes P1 names are where the story happens
    note: "the SRD appendix; `srd` says what the appendix itself provides; `alignment` on Outer Plane rows follows the appendix's sixteen-by-alignment rule; ids are table rows, not registry ids"
    rows:
      - id: baseline_material
        label: The Material Plane
        group: material
        srd: "the nexus where the planes' forces collide in mortal life; every campaign world is here"
        spells: []
        hooks:
          - {phase: P2, must: "always exists; the cosmology never deviates it"}
      - id: baseline_ethereal
        label: The Ethereal Plane
        group: transitive
        srd: "a misty, fog-bound dimension; its Border Ethereal overlaps the Material and Inner Planes"
        spells: [etherealness, see invisibility, true seeing, blink]
        hooks:
          - {phase: P2, must: "if touched, the fog has a local name and the ghosts of the campaign live in it"}
      - id: baseline_astral
        label: The Astral Plane
        group: transitive
        srd: "the realm of thought and dream, a silvery sea travelled as a disembodied soul"
        spells: [astral projection, plane shift]
        hooks:
          - {phase: P2, must: "if touched, dreams are the way in and the magic system's visibility says what dreams show"}
      - id: baseline_air
        label: The Elemental Plane of Air
        group: inner
        srd: "one of the four Elemental Planes ringing the Material Plane"
        spells: [conjure elemental, plane shift, gate]
        home_of: [{family: family_genie_elemental, creatures: [djinni, air-elemental]}]
        hooks:
          - {phase: P2, must: "if touched, a vortex portal on a height is its way in (the SRD's portal rule)"}
      - id: baseline_earth
        label: The Elemental Plane of Earth
        group: inner
        srd: "one of the four Elemental Planes; solid earth at its pure extent"
        spells: [conjure elemental, plane shift, gate]
        home_of: [{family: family_genie_elemental, creatures: [earth-elemental]}]
        weight_by: [{when: {dial: {era: [underground]}}, x: 2}]   # a free touched seat (the tag pass's fit)
        hooks:
          - {phase: P2, must: "if touched, a mine or a cave is its vortex"}
      - id: baseline_fire
        label: The Elemental Plane of Fire
        group: inner
        srd: "one of the four Elemental Planes; the efreeti's home city is the appendix's example bargain"
        spells: [conjure elemental, plane shift, gate]
        home_of: [{family: family_genie_elemental, creatures: [efreeti, fire-elemental]}]
        hooks:
          - {phase: P2, must: "if touched, the heart of a volcano or a great kiln is its vortex"}
      - id: baseline_water
        label: The Elemental Plane of Water
        group: inner
        srd: "one of the four Elemental Planes; the depths of the ocean lead to it"
        spells: [conjure elemental, plane shift, gate]
        home_of: [{family: family_genie_elemental, creatures: [water-elemental]}]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 2}]
        hooks:
          - {phase: P2, must: "if touched, the deep sea is its vortex; a coastal culture has a name for it"}
      - id: baseline_chaos
        label: The Elemental Chaos
        group: inner
        srd: "the churning tumult in which the four Elemental Planes are suspended"
        spells: [plane shift, gate]
        hooks:
          - {phase: P2, must: "if touched, wild magic's shape is planar bleed from it"}
      - id: baseline_lg
        label: "The Lawful Good Plane (the Ascending Mountain)"
        group: outer
        alignment: "LG"
        tier: upper
        shape: "a mountain of ascending terraces; the lawful good dead climb it"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [family_fallen_celestial, {family: family_god, by: alignment}]
      - id: baseline_lg_ng
        label: "Between Lawful Good and Neutral Good (the Twin Lands)"
        group: outer
        alignment: "LG/NG"
        tier: upper
        shape: "two lands facing each other across a sky; industry and peace"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [family_fallen_celestial, {family: family_god, by: alignment}]
      - id: baseline_elysium
        label: "The Neutral Good Plane (the Blessed Meadows)"
        group: outer
        alignment: "NG"
        tier: upper
        shape: "a neutral good Upper Plane; the appendix's example of alignment dissonance"
        srd: "the SRD appendix names this plane (Elysium, its example of alignment dissonance); the name is real-world mythology and is not used here (errata 24.2 #19)"
        spells: [plane shift, gate, banishment]
        home_of: [family_fallen_celestial, {family: family_god, by: alignment}]
      - id: baseline_ng_cg
        label: "Between Neutral Good and Chaotic Good (the Beast Wilds)"
        group: outer
        alignment: "NG/CG"
        tier: upper
        shape: "an endless wilderness where every animal is a lord"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [family_fallen_celestial, {family: family_god, by: alignment}]
      - id: baseline_cg
        label: "The Chaotic Good Plane (the Revels)"
        group: outer
        alignment: "CG"
        tier: upper
        shape: "forests and halls of unending feast and song"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [family_fallen_celestial, {family: family_god, by: alignment}]
      - id: baseline_cg_cn
        label: "Between Chaotic Good and Chaotic Neutral (the Fields of Contest)"
        group: outer
        alignment: "CG/CN"
        tier: upper
        shape: "floating lands of endless battle where the fallen rise at dusk"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [family_fallen_celestial, {family: family_god, by: alignment}]
      - id: baseline_cn
        label: "The Chaotic Neutral Plane (the Formless Sea)"
        group: outer
        alignment: "CN"
        tier: neutral
        shape: "raw possibility; matter obeys whoever wills hardest"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_god, by: alignment}]
      - id: baseline_cn_ce
        label: "Between Chaotic Neutral and Chaotic Evil (the Howling Caverns)"
        group: outer
        alignment: "CN/CE"
        tier: lower
        shape: "tunnels of wind that drives visitors mad"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_deceiver_fiend, creatures: [succubus-incubus]}, {family: family_god, by: alignment}]
      - id: baseline_ce
        label: "The Chaotic Evil Plane (the Bottomless Pits)"
        group: outer
        alignment: "CE"
        tier: lower
        shape: "layers without end, each a demon lord's country"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [family_demon, {family: family_deceiver_fiend, creatures: [succubus-incubus]}, {family: family_god, by: alignment}]
      - id: baseline_ce_ne
        label: "Between Chaotic Evil and Neutral Evil (the Prison Orbs)"
        group: outer
        alignment: "CE/NE"
        tier: lower
        shape: "nested spheres of prison; nothing that enters is meant to leave"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_deceiver_fiend, creatures: [succubus-incubus]}, {family: family_god, by: alignment}]
      - id: baseline_hades
        label: "The Neutral Evil Plane (the Grey Country)"
        group: outer
        alignment: "NE"
        tier: lower
        shape: "an Outer Plane named by the appendix; the grey country of the hopeless dead"
        srd: "the SRD appendix names this plane (Hades); the name is real-world mythology and is not used here (errata 24.2 #19)"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_deceiver_fiend, creatures: [night-hag, succubus-incubus]}, {family: family_god, by: alignment}]
      - id: baseline_ne_le
        label: "Between Neutral Evil and Lawful Evil (the Furnace Mountains)"
        group: outer
        alignment: "NE/LE"
        tier: lower
        shape: "volcanic slopes where everything is for sale"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_deceiver_fiend, creatures: [succubus-incubus]}, {family: family_god, by: alignment}]
      - id: baseline_nine_hells
        label: "The Nine Hells"
        group: outer
        alignment: "LE"
        tier: lower
        shape: "an Outer Plane of nine layers; the appendix's example of distance meaning nothing"
        srd: "named in the SRD appendix"
        spells: [plane shift, gate, banishment]
        home_of: [family_devil, {family: family_deceiver_fiend, creatures: [rakshasa, succubus-incubus]}, {family: family_god, by: alignment}]
      - id: baseline_le_ln
        label: "Between Lawful Evil and Lawful Neutral (the Colliding Iron)"
        group: outer
        alignment: "LE/LN"
        tier: lower
        shape: "iron cubes grinding against each other, armies on every face"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_deceiver_fiend, creatures: [succubus-incubus]}, {family: family_god, by: alignment}]
      - id: baseline_ln
        label: "The Lawful Neutral Plane (the Plane of Gears)"
        group: outer
        alignment: "LN"
        tier: neutral
        shape: "a machine the size of a world; law without mercy or malice"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_god, by: alignment}]
      - id: baseline_ln_lg
        label: "Between Lawful Neutral and Lawful Good (the Ordered Orchards)"
        group: outer
        alignment: "LN/LG"
        tier: upper
        shape: "fields in perfect rows; the harvest is a law"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [family_fallen_celestial, {family: family_god, by: alignment}]
      - id: baseline_hub
        label: "The True Neutral Plane (the Hub)"
        group: outer
        alignment: "N"
        tier: neutral
        shape: "a plane between the sixteen, if this world has one; the appendix's sixteen exclude neutrality"
        srd: "the SRD names sixteen Outer Planes by alignment and describes them only as a group; this one is described here, never named, so the campaign names it"
        spells: [plane shift, gate, banishment]
        home_of: [{family: family_god, by: alignment}]
      - id: baseline_fey_echo
        label: "The Fey Echo (the Bright Echo)"
        group: echo
        srd: "the SRD 5.1's spells name the plane the fey are sent to (dispel evil and good, forbiddance); this table describes it under its own label (S3): the bright echo of the world, of archfey, hags and fey courts, where the elves withdrew"
        spells: [dispel evil and good, forbiddance, plane shift]
        home_of: [family_hag_fey]
        hooks:
          - {phase: P2, must: "if touched, its courts and its bargains are its face; a promise made there binds"}
      - id: baseline_shadow_echo
        label: "The Shadow Echo (the Dark Echo)"
        group: echo
        srd: "the SRD 5.1's spells name the plane the undead are sent to (dispel evil and good, forbiddance, creation); this table describes it under its own label (S3): the dark echo of the world, of shadows and the undead's road"
        spells: [dispel evil and good, forbiddance, creation, plane shift]
        home_of: [family_undead]
        hooks:
          - {phase: P2, must: "if touched, its grey roads are the undead's way in and out of the world"}
      - id: baseline_beyond
        label: "The Realm Beyond"
        group: beyond
        srd: "no SRD 5.1 text names it; the realm outside the planes the gods keep, whence the threat family from beyond comes (S3)"
        spells: []
        home_of: [family_from_beyond]
        hooks:
          - {phase: P2, must: "if touched, no god holds it; what comes from it obeys no plane's law"}
      - id: baseline_demiplane
        label: Demiplanes
        group: demiplane
        srd: "small extradimensional spaces with their own rules, entered through a single point"
        spells: [demiplane, gate, plane shift]
        hooks:
          - {phase: P6, must: "a demiplane touched by the campaign is a site with one entrance and a stamped minimum depth"}

  deviation:
    notation: d7
    rows:
      - id: dev_unchanged
        label: Unchanged
        weight: 3
        rule: "exists as the SRD describes; the folk may have no word for it"
        hooks:
          - {phase: P8, must: "no primer line unless a spell a PC has references it"}
      - id: dev_renamed
        label: Renamed
        weight: 2
        rule: "the same plane under a local name from the naming language"
        hooks:
          - {phase: P2, must: "the local name is a registry alias; spells work as printed"}
      - id: dev_merged
        label: Merged
        rule: "two baseline planes are one here (the dead and the sea; fire and the hells)"
        hooks:
          - {phase: P2, must: "spells that reference either reach the merged plane; the primer says so"}
      - id: dev_removed
        label: Removed
        rule: "the plane does not exist; spells that reference it fail or are redirected, stated in the primer"
        hooks:
          - {phase: P8, must: "the primer lists the affected spells and what happens"}
      - id: dev_inverted
        label: Inverted
        rule: "the plane's nature is reversed (the Upper Planes are the prison; the Nine Hells are the court of law)"
        hooks:
          - {phase: P2, must: "the inversion is public or discoverable, never secret: a trope break or a signature carries it"}
      - id: dev_is_this_world
        label: Is a place in this world
        rule: "the plane is a region, a depth or a moon of the Material Plane"
        hooks:
          - {phase: P3, must: "the place is a map node or an off-graph inset"}
      - id: dev_reachable_by_death
        label: Reachable by dying
        rule: "the plane is where the dead go and the living can follow, at a cost"
        on_planes: {groups: [outer], rows: [baseline_shadow_echo]}     # the 22d audit (the owner): never an inner or a
                                                                       # transitive plane
        overrides: [{default: afterlife, to: afterlife_one_land}]     # docs/p2-tags.md "Where the dead go"
        hooks:
          - {phase: P2, must: "the cost row is cost_the_way_back or cost_years (the roller narrows this plane's cost); the afterlife's truth is discoverable"}

  time_rate:
    notation: d6
    note: "rate = material minutes per local minute, the value calendar.py plane enter --rate takes"
    rows:
      - id: rate_same
        label: Same as the Material
        weight: 3
        rate: 1
        hooks:
          - {phase: P2, must: "the entity's time_rate is 1; the calendar needs no plane state beyond the name"}
      - id: rate_slow
        label: Slow (an hour there is minutes here)
        rate: 0.1
        hooks:
          - {phase: P7, must: "a front step can be raced by entering the plane"}
      - id: rate_fast
        label: Fast (an hour there is a day here)
        rate: 24
        hooks:
          - {phase: P8, must: "the fast rate is the price of entering: days pass outside; the primer's folklore knows people who came back old"}
      - id: rate_stopped
        label: Stopped
        rate: 0
        hooks:
          - {phase: P2, must: "nothing ages there; the keeper is someone from the history"}
      - id: rate_seasonal
        label: Varies with the season or the moon
        rate_range: "0.5:30"
        hooks:
          - {phase: P2, must: "the calendar's moon or season decides the rate; calendar.py takes --rate-range"}
      - id: rate_bargained
        label: Set by the keeper
        rate_range: "0.25:4"
        hooks:
          - {phase: P6, must: "the site's boss or keeper sets the rate as part of the cost"}

  way_in:
    notation: d8
    rows:
      - id: way_gate_site
        label: A portal site
        weight: 2
        rule: "a standing stone circle, a tower, a ship or a whole town that exists in both planes (the SRD's portal kinds)"
        hooks:
          - {phase: P6, must: "the portal is a site or a site's payoff room"}
      - id: way_ritual_date
        label: A rite on a date
        rule: "the way opens for a rite performed on a calendar date"
        hooks:
          - {phase: P2, must: "the date is a festival"}
      - id: way_death
        label: Death or near death
        rule: "the dying cross; the nearly dead glimpse"
        hooks:
          - {phase: P5, must: "one NPC has been and returned wrong"}
      - id: way_dream
        label: Dream
        rule: "sleepers cross; the Astral is the road"
        weight_by: [{when: {any_of: [break_dreams_are_a_place]}, x: 2}]   # the tag pass's fit
        hooks:
          - {phase: P2, must: "the magic system's dream rule and the Astral deviation agree"}
      - id: way_tide
        label: The tide or the season
        rule: "at the lowest tide or the shortest day the way is open for an hour"
        hooks:
          - {phase: P2, must: "the calendar marks the hour"}
      - id: way_mirror
        label: A mirror or a reflection
        rule: "still water, a polished shield, a mirror kept shrouded"
        weight_by: [{when: {any_of: [rule_mirror_doors]}, x: 3}]   # the tag pass: in place of its P1 hook
      - id: way_phenomenon
        label: Through the signature phenomenon
        rule: "the phenomenon at full strength is the door"
        requires: {any_of: [rule_mirror_doors, rule_shifting_doors]}   # the tag pass R6
      - id: way_guide
        label: A guide creature
        rule: "a creature (a power, a beast, a psychopomp) takes those it chooses"
        hooks:
          - {phase: P6, must: "the guide is a creature_ entity with a fixed CR and a price"}

  cost:
    notation: d8
    rows:
      - id: cost_years
        label: Years of life
        hooks:
          - {phase: P5, must: "someone who paid is an NPC, visibly older"}
      - id: cost_memory
        label: A memory
        hooks:
          - {phase: P5, must: "a Known Fact is what the crossing takes"}
      - id: cost_name
        label: A name
        rule: "the traveller's true name is taken; they answer to no other"
      - id: cost_sense
        label: A sense or a part of the body
        hooks:
          - {phase: P5, must: "one NPC bears the mark and trades on it"}
      - id: cost_tithe
        label: A tithe in coin or goods
        hooks:
          - {phase: P4, must: "whoever collects the tithe is a faction; the tithe is an asset"}
      - id: cost_oath
        label: An oath that binds
        hooks:
          - {phase: P9, must: "a socket is a PC bound by such an oath"}
      - id: cost_companion
        label: Someone left behind
        hooks:
          - {phase: P6, must: "the site's keeper holds the left-behind; they are a rescue payoff"}
      - id: cost_the_way_back
        label: The way back
        hooks:
          - {phase: P7, must: "an ending is the party not returning, or returning changed"}
