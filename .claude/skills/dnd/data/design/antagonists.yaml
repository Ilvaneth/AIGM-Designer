  bbeg_faction_archetype:
    note: "which archetype the BBEG's faction may have; none is barred (build item 16a)"
    rows:
      - {id: bfa_state, value: state, label: State, hooks: [{phase: P4, must: "the BBEG holds a seat or is the ruler's rival"}]}
      - {id: bfa_guild, value: guild, label: Guild, hooks: [{phase: P4, must: "the BBEG is a master or the regulator's head"}]}
      - {id: bfa_criminal, value: criminal, label: Criminal, hooks: [{phase: P4, must: "the front runs through the criminal faction's assets"}]}
      - {id: bfa_martial, value: martial, label: Martial, hooks: [{phase: P4, must: "the doom is a war"}]}
      - {id: bfa_scholarly, value: scholarly, label: Scholarly, hooks: [{phase: P4, must: "the doom is a discovery or a rite"}]}
      - {id: bfa_resistance, value: resistance, label: Resistance, hooks: [{phase: P4, must: "the villain's answer is the resistance's endgame"}]}
      - {id: bfa_cult, value: cult, label: Cult, hooks: [{phase: P4, must: "the cult doctrine is the villain's answer"}]}
      - {id: bfa_trade, value: trade, label: Trade, hooks: [{phase: P4, must: "the doom is a monopoly or a debt"}]}
