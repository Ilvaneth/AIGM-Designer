# antagonists.yaml — the antagonist hierarchy (item 7.5): BBEG visibility patterns (a secret roll
# so it is never the same twice), the closed lists the validator checks (villain shape, origin,
# faction archetype: risk 24.1 #10), front templates (4-6 portents on calendar days
# as operation steps), lieutenant roles, doom shapes, the five threat-escalation stages the fronts
# drive, and the buy-time levers every front must carry (risk 24.1 #16).
#
# Counts by scale: scale.yaml antagonists. The BBEG embodies the villain's answer to the tension.
# BBEG and lieutenants are major tier with a goals.py record (threatened / blocked / permanent_loss
# pre-written); regional villains are supporting tier, site bosses at a fixed CR, their front on the
# faction's operation (errata 24.2 #3). The doom day is fixed at birth on a hard calendar and moves
# only through a party-caused structured block (24.6 #3).
#
# Build item 9 (plan item 25 step 2 #7): the villain's home is the break and the question. Visibility, shape, origin
# and the tie to the break are the villain's own pieces; from build item 10 on they are rolled secretly in P1 and P4
# reads them. The owner is also the player: no row of these four sub-tables is shown in a summary, a card, a commit
# message or a test's output. Their conflict lists say which two rows cannot describe one villain.
schema_version: 1
table: antagonists
consumed_by: [P1, P4, P5, P6, P7, validator, play]
plan: "item 25 step 2 #7, errata 24.2 #22, item 7.5, 10.5, 17 #17, errata 24.2 #3, risk 24.1 #10 #16, 24.6 #3"
layer: story                    # build item 18a: the threat is the story
roll: {labels: [P1.bbeg_visibility, P1.bbeg_shape, P1.bbeg_origin, P1.bbeg_tie, P1.bbeg_pole, P4.bbeg_faction_archetype, P4.front_template, P4.doom_shape, P4.lieutenant_role.<n>], secret: true, avoid_used: true, note: "all antagonist rolls are secret; the card shows only the archetype class and the clue count per act (24.6 #6)"}
rules:
  doom_day: "mid(target_sessions) × doom.days_per_session_default × (1 + doom.slack_min), rounded to a calendar date; the front's portents spread over it; lieutenants' clocks end at 30-60% of it"
  goals: "BBEG and lieutenants: goals.py add --kind npc with a metric and the three responses; regional villains: none"
  stage_from_steps: "the threat escalation stage is an overlay value advanced when a BBEG front step completes, never on DM feel; stage 5 is the doom"
  never_offscreen: "BBEG and lieutenants never die off-screen (load_bearing); regional villains fall only to a tier-matched faction, as a parked scene"
  reference_party: "a boss is sized against a reference party at the tier's intended level, never the actual party (item 9.9)"
hooks_common:
  - {phase: P4, must: "each antagonist is an npc_ with a faction, a front (or a place on the faction's operation) and a dossier at the effort the plan sets (BBEG, lieutenants: high, two critics)"}
  - {phase: P7, must: "each beat's world_pressure is one of the front's steps; the doom is the loss ending's world_after"}
  - {phase: validator, must: "villain_shape, origin and bbeg_faction_archetype are values from these lists"}

tables:

  visibility:
    roll: {avoid_used: false}
    notation: d5
    note: "may repeat across campaigns: five rows cannot be a table that runs out (the shape and origin pair is what never repeats, build item 10)"
    rows:
      - id: vis_known_untouchable
        label: Known and untouchable
        rule: "everyone knows who; nobody can touch them (a seat, a law, a wall of allies)"
        hooks:
          - {phase: P4, must: "the access chain to the BBEG is the campaign; every link is a faction"}
      - id: vis_known_wrong_person
        label: Known, but the wrong person
        rule: "the world names a villain; the world is wrong; the real one hides behind the named one"
        hooks:
          - {phase: P5, must: "the wrongly named is a supporting NPC with a life that will be ruined"}
      - id: vis_behind_visible_front
        label: Behind a visible front
        rule: "a face is public (a lieutenant, an institution); the BBEG is the hand nobody sees"
        hooks:
          - {phase: P5, must: "the face is a lieutenant with `controls` / `commands` relationship lines to the BBEG in dm-only"}
      - id: vis_mystery_among_candidates
        label: A mystery among candidates
        rule: "three or four plausible candidates, all with motive; the truth is one of them"
        conflicts_with: [break_no_direct_lies]
        hooks:
          - {phase: P5, must: "each candidate is an NPC with a secret that is not the one; the clue trail eliminates them in act order"}
      - id: vis_process_or_institution
        label: A body or a working, not a face
        rule: "the antagonist acts as an institution or as a working someone set going (a rite, a market, a migration, a sickness); the one who set it going still steers it, and its officers are the faces"
        conflicts_with: [shape_heir, shape_rival, shape_parent, shape_convert, shape_survivor, shape_beloved, shape_stranger, shape_champion, shape_oathkeeper, shape_dark_lord, shape_whispering_advisor, shape_secretly_evil_ruler, shape_outlaw_lord, shape_bargainer]
        hooks:
          - {phase: P4, must: "the BBEG entity is a faction or a signature_ with the steering person in dm-only; the lieutenants are its officers; the doom is the working completed"}

  villain_shape:
    roll: {avoid_used: false}
    note: "the rows may repeat across campaigns; the shape and origin PAIR is written at approve (hashed) and never drawn again (design_identity.py). Closed list for the registry field `villain_shape` (risk 24.1 #10); no shape is barred (build item 16a: the dark lord, the whispering advisor and the ruler with a hidden purpose are ordinary rows). `same_figure_with` (build item 16c): beside the public row it names, the shape is that row's public figure exactly when the visibility is the one it gives; design_identity.py forces or bars the shape by it and sets the pole to that role. Every shape has a reason a decent person could defend and nothing in it spares the party."
    rows:
      - {id: shape_reformer, value: reformer, label: The reformer, rule: "wants to fix the world and has chosen the cost", hooks: [{phase: P1, must: "fits secret_break_was_the_cure; the win ending must answer the reform"}]}
      - {id: shape_collector, value: collector, label: The collector, rule: "gathers what was scattered (relics, lands, oaths, people) because the whole, once together again, would mend a harm everyone has learned to live with; will not stop one short", hooks: [{phase: P7, must: "the metric is the collection; portents are acquisitions"}]}
      - {id: shape_heir, value: heir, label: The heir, rule: "owed something by the history and taking it", hooks: [{phase: P2, must: "the inheritance is an event's divergence"}]}
      - {id: shape_peacemaker, value: peacemaker, label: The peacemaker, rule: "keeps a peace that buries a crime and will bury anyone who digs", hooks: [{phase: P2, must: "the treaty event's as-happened layer"}]}
      - {id: shape_institution, value: institution, label: The institution, rule: "a body with officers, steered by the one who founded or captured it; it outlives any officer the party removes", conflicts_with: [vis_mystery_among_candidates, origin_taken_by_phenomenon], hooks: [{phase: P4, must: "the faction is the BBEG; the steering person is in dm-only"}]}
      - {id: shape_rival, value: rival, label: The rival, rule: "wants what the party wants, for reasons as good", hooks: [{phase: P9, must: "one PC's mission collides with it"}]}
      - {id: shape_parent, value: parent, label: The parent or teacher, rule: "made someone in the party or the world, and wants it back", hooks: [{phase: P9, must: "a socket binds a PC to them"}]}
      - {id: shape_convert, value: convert, label: The convert, rule: "was on the world's side once and saw something", hooks: [{phase: P5, must: "a former ally in the roster remembers them kindly"}]}
      - {id: shape_survivor, value: survivor, label: The survivor, rule: "lived through the disaster and will not let it happen again, at any price", hooks: [{phase: P2, must: "the disaster is a dated event with a witness list that includes them"}]}
      - {id: shape_process, value: process, label: The tender, rule: "set a working going (a rite, a market, a migration, a sickness) and keeps feeding it, because stopping it now would cost more than finishing", hooks: [{phase: P4, must: "the working is a faction operation or a signature_; the tender is a person with a dossier"}]}
      - {id: shape_beloved, value: beloved, label: The beloved, rule: "loved by the people; moving against them costs the party the people", conflicts_with: [vis_behind_visible_front], hooks: [{phase: P8, must: "the primer speaks of them warmly"}]}
      - {id: shape_stranger, value: stranger, label: The stranger from outside, rule: "from beyond the map, come for what their own land lost here, was promised here or is owed from here; at home they are in the right", conflicts_with: [vis_known_untouchable, origin_made_by_institution, origin_ambition_for_a_seat], hooks: [{phase: P3, must: "an inset region or the edge of the map is theirs"}]}
      - {id: shape_warden, value: warden, label: The warden, rule: "guards the land against something real and has decided the land may be trusted neither with the truth nor with its freedom", hooks: [{phase: P4, must: "the BBEG's faction gives a real protection the party will miss when it is gone"}]}
      - {id: shape_champion, value: champion, label: The champion, rule: "fights for a people or a cause that was truly wronged and has stopped counting what the fight costs anyone else", hooks: [{phase: P5, must: "the wronged are in the demographic table; one of them disowns the champion"}]}
      - {id: shape_builder, value: builder, label: The builder, rule: "is making something meant to outlast everyone (a wall, a city, a line, a peace) and spends lives on it as material", hooks: [{phase: P3, must: "the work is a landmark that grows with the front's steps"}]}
      - {id: shape_oathkeeper, value: oathkeeper, label: The oath-keeper, rule: "swore to do a thing and will do it though the reason has gone; to break the oath would unmake who they are", hooks: [{phase: P2, must: "the oath is a dated event with witnesses"}]}
      - {id: shape_dark_lord, value: dark_lord, label: The dark lord, same_figure_with: {contest_dark_lord: {visibility: vis_known_untouchable, role: a}}, rule: "rules by fear from a seat of power and means to rule everything; holds that only one will can keep the world from tearing itself apart, and has the armies to prove it", hooks: [{phase: P3, must: "the seat is a site on the map with a fixed tier; its shadow is on every neighbouring region's travel table"}]}
      - {id: shape_whispering_advisor, value: whispering_advisor, label: The whispering advisor, rule: "stands behind a ruler and steers by counsel; serves a cause held higher than the throne and will spend the ruler to reach it", hooks: [{phase: P5, must: "the ruler is a major NPC with a will of their own; one scene shows the ruler refusing the advice and what it costs them"}]}
      - {id: shape_secretly_evil_ruler, value: secretly_evil_ruler, label: The ruler with a hidden purpose, rule: "holds the seat openly and keeps what it is for hidden; believes the realm must be spent for something greater, and rules well until the day it is", conflicts_with: [vis_known_untouchable], hooks: [{phase: P4, must: "the ruler's faction is the leading faction; its public operations are sound, its hidden one is the front"}]}
      - {id: shape_outlaw_lord, value: outlaw_lord, label: The lord of the lawless, rule: "rules what the realm abandoned (a sea, a quarter, a road, a people nobody would defend); built the only order those people have, and will burn the realm before handing it back", hooks: [{phase: P4, must: "the BBEG's faction gives its own people a real order the realm never did; one NPC owes it their life"}]}
      - {id: shape_bargainer, value: bargainer, label: The bargainer, rule: "gives people what they ask for at a cost they agreed to; holds that no one is wronged who chose, and collects without mercy", hooks: [{phase: P5, must: "three NPCs have struck a bargain with them: one glad of it, one ruined, one about to be collected from"}]}

  origin:
    roll: {avoid_used: false}
    note: "the rows may repeat across campaigns; the shape and origin pair never does. Closed list for the registry field `bbeg_origin`; none is barred (build item 16a). Behind every origin stands a choice made by a living person within the history's span"
    rows:
      - {id: origin_choice_in_history, value: choice_in_history, label: A choice at a dated event, hooks: [{phase: P2, must: "the event is within years_covered and has a divergence"}]}
      - {id: origin_bargain, value: bargain, label: A bargain with a power, hooks: [{phase: P2, must: "the power is a rank_power god or a plane's keeper"}]}
      - {id: origin_loss, value: loss, label: A loss at a dated event, hooks: [{phase: P2, must: "the loss is on the witness list"}]}
      - {id: origin_inheritance, value: inheritance, label: An inheritance, hooks: [{phase: P4, must: "the inherited thing is an asset"}]}
      - {id: origin_taken_by_phenomenon, value: taken_by_phenomenon, label: The phenomenon took them, hooks: [{phase: P1, must: "the signature phenomenon's rule is what took them: its sign is on them and its limit is their weakness"}]}
      - {id: origin_conversion, value: conversion, label: A conversion, hooks: [{phase: P2, must: "the converting god or doctrine is in the pantheon or a cult"}]}
      - {id: origin_ambition_for_a_seat, value: ambition_for_a_seat, label: An ambition for a seat, conflicts_with: [break_rule_by_lottery], hooks: [{phase: P4, must: "the seat belongs to the leading faction; its access chain is the way they climbed"}]}
      - {id: origin_wrong_done, value: wrong_done, label: A wrong done to them, hooks: [{phase: P5, must: "the wrongdoer is in the roster or the history"}]}
      - {id: origin_made_by_institution, value: made_by_institution, label: Made by the institution, hooks: [{phase: P1, must: "the signature institution raised or shaped them"}]}
      - {id: origin_awakened_ancient, value: awakened_ancient, label: Awakened from an older age, conflicts_with: [bond_product_of_it], hooks: [{phase: P2, must: "what they were is an event of the history's deep layer; what woke them is a dated act within living memory, done by someone alive"}]}
      - {id: origin_refused_death, value: refused_death, label: They would not die, conflicts_with: [shape_institution], hooks: [{phase: P2, must: "the day they should have died is a dated event; what keeps them is named, with what it costs others"}]}
      - {id: origin_cursed, value: cursed, label: A curse was laid on them, hooks: [{phase: P2, must: "who laid the curse, for what wrong, and what would lift it are written; the one who laid it is in the history or the roster"}]}
      - {id: origin_changed_from_outside, value: changed_from_outside, label: Something from outside changed them, conflicts_with: [shape_institution], hooks: [{phase: P6, must: "they went to it, or someone brought them to it: a dated act by a person in the history or the roster; the place where it happened is a site, and what changed them left more than one mark there"}]}

  break_tie:
    roll: {avoid_used: false}
    notation: d6
    note: "the villain's tie to the break (plan item 25 step 2 #7; rolled secretly in P1 from build item 10 on). The list is public, the roll is secret. `bond_caused_it` stands exactly when the secret's chooser is the villain (secrets.yaml#chooser): it requires that chooser, and that chooser bars the other five. A tie that needs the break to have happened cannot stand with a break still coming."
    rows:
      - {id: bond_caused_it, label: Caused it, rule: "the villain chose the break and did it", requires: {any_of: [chooser_the_villain]}, hooks: [{phase: P7, must: "the confrontation turns on why they did it; the win ending answers that reason"}]}
      - {id: bond_exploits_it, label: Exploits it, rule: "the villain did not cause the break and grows on it; every day it lasts is worth more to them", hooks: [{phase: P4, must: "one front step is a gain that exists only because of the break"}]}
      - {id: bond_wants_to_complete, label: Wants to complete it, rule: "the break stopped short; the villain means to carry it to its end", hooks: [{phase: P7, must: "the doom is the break completed"}]}
      - {id: bond_wants_to_reverse, label: Wants to reverse it at a terrible cost, rule: "the villain will undo the break and has accepted what the undoing takes from others", conflicts_with: [time_coming], hooks: [{phase: P7, must: "the doom is the undoing; its cost falls on people the party knows"}]}
      - {id: bond_failed_to_stop, label: Tried to stop it and failed, rule: "the villain fought the break, lost, and now turns on those who stood by", conflicts_with: [time_coming], hooks: [{phase: P5, must: "one NPC stood by on the day and knows it"}]}
      - {id: bond_product_of_it, label: Is its product, rule: "the break made the villain what they are; they were born with it", conflicts_with: [time_coming, origin_inheritance, origin_ambition_for_a_seat, origin_made_by_institution], hooks: [{phase: P2, must: "the villain's first day is the break's dated event"}]}

  bbeg_faction_archetype:
    note: "which archetype the BBEG's faction may have; none is barred (build item 16a)"
    rows:
      - {id: bfa_state, value: state, label: State, hooks: [{phase: P4, must: "the BBEG holds a seat or is the ruler's rival"}]}
      - {id: bfa_guild, value: guild, label: Guild, hooks: [{phase: P4, must: "the BBEG is a master or the regulator's head"}]}
      - {id: bfa_criminal, value: criminal, label: Criminal, hooks: [{phase: P4, must: "the front runs through the criminal faction's assets"}]}
      - {id: bfa_martial, value: martial, label: Martial, hooks: [{phase: P4, must: "the doom is a war"}]}
      - {id: bfa_scholarly, value: scholarly, label: Scholarly, hooks: [{phase: P4, must: "the doom is a discovery or a rite"}]}
      - {id: bfa_resistance, value: resistance, label: Resistance, hooks: [{phase: P4, must: "the villain's answer is the resistance's endgame"}]}
      - {id: bfa_cult, value: cult, label: Cult, hooks: [{phase: P4, must: "the cult doctrine is the villain's answer"}]}
      - {id: bfa_trade, value: trade, label: Trade, hooks: [{phase: P4, must: "the doom is a monopoly or a debt"}]}
      - {id: bfa_religious, value: religious, label: Religious, hooks: [{phase: P4, must: "the BBEG leads or has captured a church of the pantheon; its doctrine carries the villain's answer"}]}

  front_template:
    note: "4-6 portents as operation steps; `at` is the fraction of the doom clock each portent lands at; kinds are factions.yaml step kinds"
    notation: d8
    rows:
      - id: front_gathering
        label: The gathering
        portents:
          - {at: 0.15, kind: timed, shape: "recruits or buys the first hands; a notice, a rumour of pay"}
          - {at: 0.35, kind: contested, shape: "takes a supply (a well, a road, a warehouse)"}
          - {at: 0.55, kind: contested, shape: "strikes a rival and takes its asset"}
          - {at: 0.75, kind: party-only, shape: "closes the place the rite needs"}
          - {at: 1.0, kind: timed, shape: "the rite; the doom"}
        hooks:
          - {phase: P7, must: "the Act 1 beat's world_pressure is the first or second portent"}
      - id: front_count
        label: The count
        portents:
          - {at: 0.1, kind: timed, shape: "a census, a listing, a register opened"}
          - {at: 0.3, kind: timed, shape: "the first names struck"}
          - {at: 0.5, kind: contested, shape: "a district emptied"}
          - {at: 0.7, kind: party-only, shape: "someone the party knows is counted"}
          - {at: 0.9, kind: contested, shape: "the registers moved to the seat"}
          - {at: 1.0, kind: timed, shape: "the count closed; the doom"}
        hooks:
          - {phase: P5, must: "the counted NPC is load-bearing"}
      - id: front_silence
        label: The silence
        portents:
          - {at: 0.2, kind: timed, shape: "a witness goes quiet"}
          - {at: 0.4, kind: contested, shape: "a record burns"}
          - {at: 0.6, kind: contested, shape: "the last archive is taken"}
          - {at: 0.8, kind: party-only, shape: "the last witness is found"}
          - {at: 1.0, kind: timed, shape: "the truth is gone; the doom"}
        hooks:
          - {phase: P1, must: "the big secret's clue trail runs against this front"}
      - id: front_purchase
        label: The purchase
        portents:
          - {at: 0.15, kind: timed, shape: "a debt is bought"}
          - {at: 0.35, kind: contested, shape: "a seat's vote is bought"}
          - {at: 0.55, kind: contested, shape: "a settlement's ruler is bought"}
          - {at: 0.8, kind: party-only, shape: "the party is offered a price"}
          - {at: 1.0, kind: timed, shape: "the polity is owned; the doom"}
        hooks:
          - {phase: P4, must: "each purchase is a control flip through ≥2 steps"}
      - id: front_flood
        label: The flood
        portents:
          - {at: 0.1, kind: timed, shape: "the water, the sickness or the thing is seen at the edge"}
          - {at: 0.3, kind: timed, shape: "a village falls"}
          - {at: 0.5, kind: contested, shape: "a road is cut"}
          - {at: 0.7, kind: contested, shape: "a town is besieged"}
          - {at: 0.85, kind: party-only, shape: "the flood reaches a place the party holds or an ally"}
          - {at: 1.0, kind: timed, shape: "the capital; the doom"}
        hooks:
          - {phase: P3, must: "each portent moves the travel tier of a region toward Late"}
      - id: front_trial
        label: The trial
        portents:
          - {at: 0.2, kind: timed, shape: "a charge is read"}
          - {at: 0.4, kind: contested, shape: "a witness is turned"}
          - {at: 0.6, kind: party-only, shape: "the party is summoned"}
          - {at: 0.8, kind: contested, shape: "the judge is replaced"}
          - {at: 1.0, kind: timed, shape: "the verdict; the doom"}
        hooks:
          - {phase: P2, must: "the trial is a festival date or the god's-trial break"}
      - id: front_road
        label: The road
        portents:
          - {at: 0.15, kind: contested, shape: "a crossing taken"}
          - {at: 0.35, kind: contested, shape: "a toll imposed"}
          - {at: 0.55, kind: timed, shape: "a caravan goes through unhindered"}
          - {at: 0.75, kind: party-only, shape: "the party's road closes"}
          - {at: 1.0, kind: timed, shape: "the road is the villain's; the doom"}
        hooks:
          - {phase: P3, must: "each portent changes a map edge's note; travel-times regenerate"}
      - id: front_lamp
        label: The lamp
        portents:
          - {at: 0.1, kind: timed, shape: "something gathers (oil, salt, years, names)"}
          - {at: 0.3, kind: contested, shape: "a keeper is replaced"}
          - {at: 0.5, kind: timed, shape: "the gathered thing is moved"}
          - {at: 0.7, kind: party-only, shape: "the last piece is asked of someone the party knows"}
          - {at: 1.0, kind: timed, shape: "the lamp is lit; the doom"}
        hooks:
          - {phase: P6, must: "the lamp's place is the capstone or major site of the last act"}

  lieutenant_role:
    notation: d10
    rows:
      - {id: lt_hand, label: The hand (enforcer), tier: major, hooks: [{phase: P6, must: "a site boss at a fixed CR inside the band"}]}
      - {id: lt_voice, label: The voice (public face), tier: major, hooks: [{phase: P5, must: "the face of vis_behind_visible_front; voice samples that never mention the BBEG"}]}
      - {id: lt_purse, label: The purse, tier: major, hooks: [{phase: P4, must: "holds the front's economic asset"}]}
      - {id: lt_hunter, label: The hunter, tier: major, hooks: [{phase: P9, must: "one PC's personal antagonist"}]}
      - {id: lt_believer, label: The believer, tier: major, hooks: [{phase: P4, must: "holds the doctrine more purely than the BBEG; a fracture seed"}]}
      - {id: lt_traitor, label: The traitor in waiting, tier: major, hooks: [{phase: P4, must: "the betrayal candidate of the BBEG's faction"}]}
      - {id: lt_engineer, label: The engineer of the doom, tier: major, hooks: [{phase: P7, must: "removing them is a buy-time lever"}]}
      - {id: lt_keeper, label: The keeper of the secret, tier: major, hooks: [{phase: P1, must: "holds the Act 3 clue or guards it"}]}
      - {id: lt_child, label: The child (the heir), tier: major, hooks: [{phase: P4, must: "the BBEG's heir; succession makes them the BBEG"}]}
      - {id: lt_convert, label: The convert (a former ally), tier: major, hooks: [{phase: P5, must: "a roster NPC's Known Facts remember them on the other side"}]}

  doom_shape:
    notation: d10
    rows:
      - {id: doom_rite_completed, label: The rite completed, stage5: "the rite is done and the world is different; the villain's answer is the law", levers: [lever_hostage, lever_date, lever_engineer], hooks: [{phase: P7, must: "the loss ending's world_after is this"}]}
      - {id: doom_city_falls, label: The city falls, stage5: "the capital is taken; the polity is the villain's", levers: [lever_supply, lever_rival, lever_date], hooks: [{phase: P3, must: "the city is a settlement asset; the siege is a contested step"}]}
      - {id: doom_god_answers, label: The god answers, stage5: "a god speaks or wakes, for the villain", levers: [lever_witness, lever_date, lever_engineer], hooks: [{phase: P2, must: "the god's secret and presence row"}]}
      - {id: doom_border_closes, label: The border closes, stage5: "the map shrinks; a region is lost to the map", levers: [lever_supply, lever_rival], hooks: [{phase: P3, must: "the region becomes an inset"}]}
      - {id: doom_plague_peaks, label: The sickness peaks, stage5: "a people, a district or a settlement is gone", levers: [lever_supply, lever_witness, lever_engineer], hooks: [{phase: P5, must: "the demographic table loses a row"}]}
      - {id: doom_seat_taken, label: The seat taken, stage5: "the villain rules openly", levers: [lever_rival, lever_hostage, lever_date], hooks: [{phase: P4, must: "a control flip of the HQ through ≥2 steps"}]}
      - {id: doom_dead_rise, label: The dead rise, stage5: "the dead walk and the living are the minority", levers: [lever_witness, lever_engineer], hooks: [{phase: P6, must: "every site's ecology changes at stage 5"}]}
