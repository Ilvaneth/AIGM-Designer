  front_template:
    note: "4-6 portents as operation steps; `at` is the fraction of the doom clock each portent lands at; kinds are factions.yaml step kinds"
    notation: d8
    rows:
      - id: front_gathering
        label: The gathering
        portents:
          - {at: 0.15, kind: timed, shape: "recruits or buys the first hands; a notice, a rumour of pay"}
          - {at: 0.35, kind: contested, shape: "takes a supply (a well, a road, a warehouse)"}
          - {at: 0.55, kind: contested, shape: "strikes a rival and takes its asset"}
          - {at: 0.75, kind: party-only, shape: "closes the place the rite needs"}
          - {at: 1.0, kind: timed, shape: "the rite; the doom"}
        hooks:
          - {phase: P7, must: "the Act 1 beat's world_pressure is the first or second portent"}
      - id: front_count
        label: The count
        portents:
          - {at: 0.1, kind: timed, shape: "a census, a listing, a register opened"}
          - {at: 0.3, kind: timed, shape: "the first names struck"}
          - {at: 0.5, kind: contested, shape: "a district emptied"}
          - {at: 0.7, kind: party-only, shape: "someone the party knows is counted"}
          - {at: 0.9, kind: contested, shape: "the registers moved to the seat"}
          - {at: 1.0, kind: timed, shape: "the count closed; the doom"}
        hooks:
          - {phase: P5, must: "the counted NPC is load-bearing"}
      - id: front_silence
        label: The silence
        portents:
          - {at: 0.2, kind: timed, shape: "a witness goes quiet"}
          - {at: 0.4, kind: contested, shape: "a record burns"}
          - {at: 0.6, kind: contested, shape: "the last archive is taken"}
          - {at: 0.8, kind: party-only, shape: "the last witness is found"}
          - {at: 1.0, kind: timed, shape: "the truth is gone; the doom"}
        hooks:
          - {phase: P1, must: "the big secret's clue trail runs against this front"}
      - id: front_purchase
        label: The purchase
        portents:
          - {at: 0.15, kind: timed, shape: "a debt is bought"}
          - {at: 0.35, kind: contested, shape: "a seat's vote is bought"}
          - {at: 0.55, kind: contested, shape: "a settlement's ruler is bought"}
          - {at: 0.8, kind: party-only, shape: "the party is offered a price"}
          - {at: 1.0, kind: timed, shape: "the polity is owned; the doom"}
        hooks:
          - {phase: P4, must: "each purchase is a control flip through ≥2 steps"}
      - id: front_flood
        label: The flood
        portents:
          - {at: 0.1, kind: timed, shape: "the water, the sickness or the thing is seen at the edge"}
          - {at: 0.3, kind: timed, shape: "a village falls"}
          - {at: 0.5, kind: contested, shape: "a road is cut"}
          - {at: 0.7, kind: contested, shape: "a town is besieged"}
          - {at: 0.85, kind: party-only, shape: "the flood reaches a place the party holds or an ally"}
          - {at: 1.0, kind: timed, shape: "the capital; the doom"}
        hooks:
          - {phase: P3, must: "each portent moves the travel tier of a region toward Late"}
      - id: front_trial
        label: The trial
        portents:
          - {at: 0.2, kind: timed, shape: "a charge is read"}
          - {at: 0.4, kind: contested, shape: "a witness is turned"}
          - {at: 0.6, kind: party-only, shape: "the party is summoned"}
          - {at: 0.8, kind: contested, shape: "the judge is replaced"}
          - {at: 1.0, kind: timed, shape: "the verdict; the doom"}
        hooks:
          - {phase: P2, must: "the trial is a festival date or the god's-trial break"}
      - id: front_road
        label: The road
        portents:
          - {at: 0.15, kind: contested, shape: "a crossing taken"}
          - {at: 0.35, kind: contested, shape: "a toll imposed"}
          - {at: 0.55, kind: timed, shape: "a caravan goes through unhindered"}
          - {at: 0.75, kind: party-only, shape: "the party's road closes"}
          - {at: 1.0, kind: timed, shape: "the road is the villain's; the doom"}
        hooks:
