# rubrics.yaml — the critique pass (item 15.2): the questions the plan records under items 4-12,
# one row per question, run at every phase end by the SAME model in a SEPARATE call without the
# generation context (input: the phase output, the rubric, the premise). The verdict is structured:
# pass / fix:<list> / rerun; a fix list goes back to generation for at most two loops, then the
# phase is brought to the owner as "did not pass, because…". The `wishes` rubric runs over dm-only
# text with a per-wish tick on the card (24.6 #6); BBEG, lieutenant and premise-secret files get two
# independent critics (different rubric order, no shared notes). Cliché judgement lives here, not in
# the lexical validator (risk 24.1 #10). SKILL-design.md references this file.
schema_version: 1
table: rubrics
consumed_by: [P1, P2, P3, P4, P5, P6, P7, P8, P9, validator, play]
plan: "item 15.2, 4-12 critique questions, 13.5, 24.6 #6, risk 24.1 #10 #17 #19 #20"
rules:
  critic: "same model as generation, separate call, no generation context; input is the phase output plus this rubric plus the premise (public part unless scope is dm-only)"
  verdict: "one of pass / fix / rerun with a `findings[]` of {rubric_id, entity_id, verdict, reason}; `fix` carries the list; `rerun` means the phase output cannot be repaired by targeted fixes"
  loops: "at most two fix loops; a third failure is reported to the owner as `did not pass, because…` with the rubric ids; never silently accepted"
  two_critics: "BBEG, lieutenant and premise-secret files: two critics with the rubric rows in different order and no shared notes; disagreement is reported as a count on the card"
  redaction: "a critic that read dm-only text returns rubric ids and entity ids only, never quoted text"
hooks_common:
  - {phase: validator, must: "the phase card lists critique loops used and the failed rubric ids; the report records loops per phase"}

tables:

  verdict:
    rows:
      - {id: verdict_pass, value: pass, label: Pass, hooks: [{phase: validator, must: "no findings, or findings all marked `note`"}]}
      - {id: verdict_fix, value: fix, label: Fix, hooks: [{phase: validator, must: "findings with entity ids; targeted fix agents run within the loop cap"}]}
      - {id: verdict_rerun, value: rerun, label: Rerun, hooks: [{phase: validator, must: "the phase's skeleton or premise is wrong; the attempt number increments and the draws redraw"}]}

  phase_rubric:
    note: "`scope` is what the critic reads: phase (skeleton plus one-line identities), entity (one file), dm-only (the secret projection); `fails_when` is the test in words"
    rows:
      - {id: rubric_p1_hundred_campaigns, phase: P1, label: "P1 rubric: hundred campaigns", scope: phase, effort: high, critics: 1, question: "Could this premise describe a hundred other campaigns? Show the three sentences that could only be true here.", fails_when: "fewer than three sentences are specific to this world's signatures, breaks and tension", hooks: [{phase: P1, must: "a fail is a rerun, not a fix"}]}
      - {id: rubric_p1_question_not_adjective, phase: P1, label: "P1 rubric: question not adjective", scope: phase, effort: high, critics: 1, question: "Is the theme a question with two answers the villain and the world each hold, or an adjective?", fails_when: "the question has an obvious right answer or the villain's answer is not stated", hooks: [{phase: P1, must: "tensions.yaml villain_answer and world_default are both present"}]}
      - {id: rubric_p1_signatures_pervade, phase: P1, label: "P1 rubric: signatures pervade", scope: phase, effort: medium, critics: 1, question: "Does each signature change something a native would notice daily, and does the break touch the phases its row names?", fails_when: "a signature is decoration or a break is one sentence with no consequences", hooks: [{phase: P1, must: "hooks of signatures.yaml and trope-breaks.yaml rows are checked one by one"}]}
      - {id: rubric_p1_secret_trail, phase: P1, label: "P1 rubric: secret trail", scope: dm-only, effort: high, critics: 2, question: "Is the big secret one sentence, pinned to a god and an event, with three clues a party could find in act order without the DM's help?", fails_when: "a clue requires knowing the secret to recognise it", hooks: [{phase: P1, must: "two critics; findings carry ids only"}]}
      - {id: rubric_p1_forbidden, phase: P1, label: "P1 rubric: forbidden", scope: phase, effort: medium, critics: 1, question: "Is any forbidden default present as a default rather than as a conscious break named in the DM pitch?", fails_when: "a forbidden row's label describes the premise", hooks: [{phase: P1, must: "the cliché judgement is here, the lexical scan only warns"}]}
      - {id: rubric_p2_gods_carry_question, phase: P2, label: "P2 rubric: gods carry question", scope: phase, effort: high, critics: 1, question: "How does this pantheon and cosmology carry the premise's question: which god embodies the villain's answer, which the world's?", fails_when: "no god is named for either pole; the pantheon is scenery", hooks: [{phase: P2, must: "a fail is a rerun"}]}
      - {id: rubric_p2_history_diverges, phase: P2, label: "P2 rubric: history diverges", scope: phase, effort: medium, critics: 1, question: "Do the taught and true layers differ where the divergence rows say, and is the villain's origin on the timeline?", fails_when: "every event's layers agree, or the villain has no dated origin", hooks: [{phase: P2, must: "history.yaml divergence tiers respected"}]}
      - {id: rubric_p2_calendar_felt, phase: P2, label: "P2 rubric: calendar felt", scope: phase, effort: medium, critics: 1, question: "Could a player tell which month it is from the sensory line alone?", fails_when: "two months share a tone or the tone is weather only", hooks: [{phase: P2, must: "calendar.yaml climate templates used"}]}
      - {id: rubric_p3_regions_distinct, phase: P3, label: "P3 rubric: regions distinct", scope: phase, effort: high, critics: 1, question: "Are these regions distinct only by name? For each region, show one travel result that could happen only there.", fails_when: "a region has no unique result or two identity lines could swap", hooks: [{phase: P3, must: "regions.yaml unique_result rule"}]}
      - {id: rubric_p3_settlement_fears, phase: P3, label: "P3 rubric: settlement fears", scope: entity, effort: medium, critics: 1, question: "What does this settlement fear, and does the fear show in an anchor, a district and a rumour?", fails_when: "the fear is stated once and appears nowhere", hooks: [{phase: P3, must: "settlements.yaml fear row hooks"}]}
      - {id: rubric_p3_map_honest, phase: P3, label: "P3 rubric: map honest", scope: phase, effort: medium, critics: 1, question: "Does the player map show what a native knows and hide what they do not, and do the over-tier sites read as places nobody goes?", fails_when: "a secret node is on the player map or an over-tier site has no public telegraph line", hooks: [{phase: P3, must: "map.json secrecy and the primer's dangerous-places section"}]}
      - {id: rubric_p4_independent_want, phase: P4, label: "P4 rubric: independent want", scope: entity, effort: high, critics: 1, question: "What does this faction want independent of the party, and what would it have done 60 days from now if the party never appeared?", fails_when: "the answer is `it waits`; the faction is scenery", hooks: [{phase: P4, must: "the operation's steps answer the 60-day question"}]}
      - {id: rubric_p4_fracture_real, phase: P4, label: "P4 rubric: fracture real", scope: entity, effort: medium, critics: 1, question: "Is the fracture a person with a name and a reason, and could the party widen it?", fails_when: "the fracture is a sentence without an NPC", hooks: [{phase: P4, must: "factions.yaml fracture row hooks"}]}
      - {id: rubric_p4_stance_reasons, phase: P4, label: "P4 rubric: stance reasons", scope: phase, effort: medium, critics: 1, question: "Does every stance edge carry one reason both dossiers repeat?", fails_when: "two dossiers explain one stance differently", hooks: [{phase: P4, must: "risk 24.1 #19: the skeleton's reason lines"}]}
      - {id: rubric_p4_bbeg_answer, phase: P4, label: "P4 rubric: bbeg answer", scope: dm-only, effort: high, critics: 2, question: "Is the BBEG's objective the villain's answer made policy, is their origin a choice within the history, and does every portent leave a visible sign?", fails_when: "the BBEG wants harm for its own sake or a portent is invisible", hooks: [{phase: P4, must: "two critics; antagonists.yaml closed lists"}]}
      - {id: rubric_p4_calculus_actors, phase: P4, label: "P4 rubric: calculus actors", scope: phase, effort: medium, critics: 1, question: "Does each act's A/B scenario use that act's own actors, and is the first rung of every ladder short of war?", fails_when: "Act 2 is built on Act 1's actors or a ladder starts at war", hooks: [{phase: P7, must: "item 7's Ashen Crown lesson"}]}
      - {id: rubric_p5_own_want, phase: P5, label: "P5 rubric: own want", scope: entity, effort: medium, critics: 1, question: "What does this NPC want that has nothing to do with the party?", fails_when: "the want is to help, hinder or hire the party", hooks: [{phase: P5, must: "the current goal field"}]}
      - {id: rubric_p5_contradiction, phase: P5, label: "P5 rubric: contradiction", scope: entity, effort: medium, critics: 1, question: "Show the one contradiction that makes them a person.", fails_when: "the axes all point the same way and the weakness is not derived from them", hooks: [{phase: P5, must: "npcs.yaml axis weakness_from"}]}
      - {id: rubric_p5_voice_distinct, phase: P5, label: "P5 rubric: voice distinct", scope: phase, effort: medium, critics: 1, question: "Read the voice samples without the names: can you tell the NPCs apart?", fails_when: "two NPCs share a tic, a register or an opening phrase", hooks: [{phase: P5, must: "risk 24.1 #19 distinctness"}]}
      - {id: rubric_p5_secret_surfaces, phase: P5, label: "P5 rubric: secret surfaces", scope: dm-only, effort: medium, critics: 1, question: "Could the secret surface through the path written, by a party that does not know it exists?", fails_when: "the path needs the DM to volunteer it", hooks: [{phase: P5, must: "npcs.yaml secret paths"}]}
      - {id: rubric_p5_lieutenant, phase: P5, label: "P5 rubric: lieutenant", scope: dm-only, effort: high, critics: 2, question: "Does this lieutenant have their own seat, their own operation and a reason to betray the BBEG?", fails_when: "the lieutenant is a mouthpiece", hooks: [{phase: P4, must: "two critics; lt_ roles"}]}
      - {id: rubric_p6_thread_and_60_days, phase: P6, label: "P6 rubric: thread and 60 days", scope: entity, effort: medium, critics: 1, question: "Which thread ties this site to the game, and what has it done 60 days from now if the party never comes?", fails_when: "the thread is `exploration` or the never-visited line is `nothing`", hooks: [{phase: P6, must: "sites.yaml never_visited rows"}]}
      - {id: rubric_p6_danger_legible, phase: P6, label: "P6 rubric: danger legible", scope: entity, effort: high, critics: 1, question: "How does a party know this place's danger before stepping in, and where does a party three levels early run?", fails_when: "a telegraph is missing at a distance or the escape line needs luck", hooks: [{phase: P6, must: "three telegraphs and an escape row"}]}
      - {id: rubric_p6_only_here, phase: P6, label: "P6 rubric: only here", scope: entity, effort: medium, critics: 1, question: "Name three things in this site that could exist only in this campaign.", fails_when: "fewer than three, or all three are names", hooks: [{phase: P6, must: "also the detail-time rubric (item 13.5)"}]}
      - {id: rubric_p6_boss, phase: P6, label: "P6 rubric: boss", scope: entity, effort: high, critics: 1, question: "Does the boss survive the reference party's first round, and is every checklist row answered with a number or a room?", fails_when: "a checklist row is a sentence without a number", hooks: [{phase: P6, must: "sites.yaml boss_checklist; burst_check output pasted"}]}
      - {id: rubric_p7_three_routes, phase: P7, label: "P7 rubric: three routes", scope: entity, effort: high, critics: 1, question: "How can the party trigger this beat by three different routes? One route means it is a plot, not a situation.", fails_when: "fewer than two delivery paths are real places or people", hooks: [{phase: P7, must: "arc.yaml delivery paths"}]}
      - {id: rubric_p7_never_enters, phase: P7, label: "P7 rubric: never enters", scope: phase, effort: high, critics: 1, question: "If the party never enters this act, what does the world do?", fails_when: "a chapter's nodes have no if-never-arrives, or the answer is `it waits`", hooks: [{phase: P7, must: "node if_never_arrives bound to steps"}]}
      - {id: rubric_p7_consequence_shape, phase: P7, label: "P7 rubric: consequence shape", scope: entity, effort: medium, critics: 1, question: "Is what_changes a difference in the world that survives every delivery path, or an event?", fails_when: "the sentence matches a forbidden phrasing or names a scene", hooks: [{phase: P7, must: "arc.yaml forbidden_phrasing"}]}
      - {id: rubric_p7_endings_answer, phase: P7, label: "P7 rubric: endings answer", scope: phase, effort: medium, critics: 1, question: "Is each ending an answer to the question, with a world after that could seed a next arc?", fails_when: "an ending is a battle's outcome", hooks: [{phase: P7, must: "arc.yaml ending rows"}]}
      - {id: rubric_p8_native_knows, phase: P8, label: "P8 rubric: native knows", scope: phase, effort: medium, critics: 1, question: "Does the primer read as what a native knows, sectioned by origin, with nothing a native could not know?", fails_when: "a discoverable or secret fact appears, or an origin section knows the other polity too well", hooks: [{phase: P8, must: "the secrecy validator runs on the primer too"}]}
      - {id: rubric_p8_session_one, phase: P8, label: "P8 rubric: session one", scope: phase, effort: high, critics: 1, question: "Could a human DM run session 1 from the primer, chapter 1 and the first site alone?", fails_when: "the opening bang, the first site's telegraphs or the day-0 rumours are missing", hooks: [{phase: P9, must: "the session-1 pack"}]}
      - {id: rubric_p9_independent_mission, phase: P9, label: "P9 rubric: independent mission", scope: entity, effort: high, critics: 1, question: "Can this mission be played independently of the main road, or is it the main plot renamed?", fails_when: "the mission's object is the BBEG's doom", hooks: [{phase: P9, must: "threads.yaml mission verbs"}]}
      - {id: rubric_p9_finale_pull, phase: P9, label: "P9 rubric: finale pull", scope: phase, effort: medium, critics: 1, question: "Why would the other PC want to be there at this thread's finale?", fails_when: "no crossing point names the other PC", hooks: [{phase: P9, must: "skipped for a solo party"}]}
      - {id: rubric_p9_engine, phase: P9, label: "P9 rubric: engine", scope: entity, effort: medium, critics: 1, question: "Which faction has this PC on its target list, and which two NPCs will seek them in Act 1?", fails_when: "the thread has no initiating engine (risk 24.1 #20)", hooks: [{phase: P9, must: "threads.yaml engine rule"}]}
      - {id: rubric_detail_three_things, phase: detail, label: "detail rubric: detail three things", scope: entity, effort: medium, critics: 1, question: "Three things that could exist only here, and what a party three levels early sees and where it runs.", fails_when: "the detailed site could be any dungeon", hooks: [{phase: play, must: "the detail-time critique (item 13.5)"}]}
      - {id: rubric_detail_stamps, phase: detail, label: "detail rubric: detail stamps", scope: entity, effort: medium, critics: 1, question: "Does the detailed file keep every stamped fact and reference nothing from a later act?", fails_when: "a stamp moved or a later-act entity is referenced", hooks: [{phase: play, must: "errata 24.2 #9"}]}

  special:
    note: "rubrics that run across phases or on the owner's behalf"
    rows:
      - {id: rubric_wishes, phase: all, scope: dm-only, effort: high, critics: 1, label: The wishes rubric, question: "For each must and must-not the owner wrote: is it honoured in the public and the dm-only text?", fails_when: "a must is absent or a must-not is present anywhere, including secrets", hooks: [{phase: validator, must: "a per-wish tick on every phase card (24.6 #6)"}]}
      - {id: rubric_leak, phase: all, scope: phase, effort: medium, critics: 1, label: The leak rubric, question: "Does any card, return, name, label or note carry a sentence from a dm-only file?", fails_when: "any overlap", hooks: [{phase: validator, must: "the automated leak grep is the belt; this is the braces"}]}
      - {id: rubric_distinctness, phase: all, scope: phase, effort: medium, critics: 1, label: The distinctness rubric, question: "Across the phase's entities, is anything a reskin of another: two regions, two factions, two NPCs, two sites?", fails_when: "two entities differ only by name", hooks: [{phase: validator, must: "risk 24.1 #19"}]}
      - {id: rubric_cliche, phase: all, scope: phase, effort: medium, critics: 1, label: The cliché rubric, question: "Name the genre default this entity is closest to, and the one detail that makes it not that.", fails_when: "no such detail exists", hooks: [{phase: validator, must: "risk 24.1 #10: the judgement the lexical scan cannot make"}]}
      - {id: rubric_english_names, phase: all, scope: phase, effort: medium, critics: 1, label: The naming rubric, question: "Is every proper noun an English fantasy name from the culture's language, and does no name sit on the blacklist or recall a real-world mythology?", fails_when: "a Turkish proper noun, a banned stem or a mythology name appears", hooks: [{phase: validator, must: "errata 24.2 #17 #18 #19"}]}
      - {id: rubric_load_lightness, phase: all, scope: phase, effort: medium, critics: 1, label: The load-lightness rubric, question: "Would `load` read under the token budget with this phase's files in place?", fails_when: "world.md, npcs.md, the current chapter and the threads exceed the budget", hooks: [{phase: P8, must: "the quality panel's judge (item 22.4); a warning at birth"}]}
