  phenomenon_rule:
    roll: {"avoid_used": true}
    note: "the pool is filtered to the ruin source's olgu_families; with the magic-rule scar, family born_of_break alone and the phenomenon's home is the break (review #6); magic low halves families 1, 6 and 8; no row owns or sells magic; a rule another campaign drew is not drawn again; `kind` says who uses the rule: `spell` whoever casts, `self` no one, `usable` a rolled user (item 10 rolls the user for the usable rules only, from the row's `users` when it names them)"
    hooks_common:
      - {phase: P2, must: "the magic system agrees with the rule"}
      - {phase: P3, must: "where the rule is strong and where it is weak"}
      - {phase: P5, must: "the NPCs who use it"}
      - {phase: P6, must: "a site where the rule is strongest; its trials use the rule"}
      - {phase: P8, must: "what natives know of it"}
      - {phase: play, must: "the DM applies the rule in combat and travel"}
    rows:
      - {id: "rule_echo", label: "Every spell leaves a readable echo", family: "magic_behaviour", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}, {when: {any_of: ["break_casting_forbidden"]}, x: 2}], tr: {"name": "her büyü saatlerce orada kalan ve okunabilen bir yankı bırakır", "at_table": "gizlice büyü yapılamaz; iz süren biri bulur"}}
      - {id: "rule_rebound", label: "Spells rebound from hard surfaces", family: "magic_behaviour", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "sert bir yüzeye çarpan büyü geri dönebilir", "at_table": "taşın ve camın yakınında büyü risklidir"}}
      - {id: "rule_inverted_element", label: "The element turns inside out", family: "magic_behaviour", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "büyünün unsuru ters döner: ateş dondurur, buz yakar", "at_table": "düşmanın dirençleri ters işler"}}
      - {id: "rule_spells_grow_life", label: "Spells make life grow", family: "magic_behaviour", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "her büyü çevresinde bitki ve küçük canlılar büyütür", "at_table": "büyü yapılan savaş alanı ormana döner"}}
      - {id: "rule_spell_twins", label: "Every spell has a distant twin", family: "magic_behaviour", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "her büyünün uzakta bir yerde bir ikizi olur", "at_table": "başka bir yerde istenmeyen bir etki doğar"}}
      - {id: "rule_shared_wounds", label: "A community shares its wounds", family: "body_blood", kind: "usable", users: ["user_the_people", "user_the_institution"], tr: {"name": "bir topluluk yaralarını paylaşır", "at_table": "birini yaralamak herkesi yaralar"}}
      - {id: "rule_slow_change", label: "Those who live near the remnant change", family: "body_blood", kind: "self", tr: {"name": "kalıntının yakınında uzun yaşayanlar yavaş yavaş değişir", "at_table": "uzun kalan partide işaretler belirir"}}
      - {id: "rule_beasts_sense_lies", label: "Animals sense lies", family: "body_blood", kind: "self", conflicts_with: ["break_no_direct_lies"], tr: {"name": "hayvanlar yalanı sezer, yalancıya yaklaşmaz", "at_table": "at ve köpek bir yalanı ele verir"}}
      - {id: "rule_kin_doubles", label: "Kinship doubles magic", family: "body_blood", kind: "spell", tr: {"name": "kan bağı büyüyü güçlendirir; bir akrabanın büyüsü iki kat işler", "at_table": "aileler güçlü, akraba düşman tehlikeli"}}
      - {id: "rule_spell_marks", label: "Every spell marks the caster's skin", family: "body_blood", kind: "spell", tr: {"name": "her büyü, yapanın teninde bir iz bırakır", "at_table": "kimin ne kadar büyü yaptığı bedeninden okunur"}}
      - {id: "rule_visible_currents", label: "Magic flows along visible paths", family: "place_path", kind: "self", tr: {"name": "büyü görünür yollar boyunca akar", "at_table": "yolların kesiştiği yerler değerli ve çekişmeli"}}
      - {id: "rule_mirror_doors", label: "Mirrors are doors", family: "place_path", kind: "usable", tr: {"name": "aynalar belli koşullarda kapıdır", "at_table": "kaçış ve baskın yolları"}}
      - {id: "rule_roads_lead_where_needed", label: "Roads lead where you must go", family: "place_path", kind: "self", tr: {"name": "yollar yürüyeni istediği yere değil, gitmesi gereken yere götürür", "at_table": "yolculuk bir yön arayışına döner"}}
      - {id: "rule_night_distances", label: "Distances change at night", family: "place_path", kind: "self", requires: {dial: {era: ["medieval", "renaissance", "ancient", "nautical"]}}, tr: {"name": "mesafeler gece değişir; gece yolculuğu kısa da sürebilir uzun da", "at_table": "gece yürüyüşü bir kumar"}}
      - {id: "rule_shifting_doors", label: "Some doors open somewhere else each time", family: "place_path", kind: "self", tr: {"name": "bazı kapılar her açılışta başka bir yere açılır", "at_table": "kapılar bir harita olur"}}
      - {id: "rule_remnant_drinks_magic", label: "The remnant's matter drinks magic", family: "matter", kind: "self", tr: {"name": "kalıntının maddesi büyüyü emer", "at_table": "o maddeden zırh büyüye karşı korur", "name_note": "cam, taş, kemik"}}
      - {id: "rule_weightless_stone", label: "A stone loses its weight", family: "matter", kind: "self", tr: {"name": "bir taş ağırlığını kaybeder, havada durur", "at_table": "uçan yapılar, düşen şeyler"}}
      - {id: "rule_water_remembers", label: "Water remembers its course", family: "matter", kind: "self", tr: {"name": "su bir kez aktığı yolu hatırlar ve oraya geri döner", "at_table": "su yönlendirilebilir, kuruyan yataklar geri gelir"}}
      - {id: "rule_metal_wakes", label: "Metal wakes in a master's hand", family: "matter", kind: "usable", tr: {"name": "metal bir ustanın elinde canlanır", "at_table": "dökülen şeyler kendiliğinden kıpırdar"}}
      - {id: "rule_smoke_shows_shape", label: "Fire's smoke shows what it burned", family: "matter", kind: "self", tr: {"name": "ateş yaktığı şeyin şeklini dumanında gösterir", "at_table": "duman okunur, iz sürülür"}}
      - {id: "rule_time_differs", label: "Time runs differently near the remnant", family: "time", kind: "self", tr: {"name": "kalıntının yakınında zaman farklı akar", "at_table": "içeride bir gün, dışarıda bir hafta"}}
      - {id: "rule_shadows_of_the_future", label: "What will happen casts its shadow ahead", family: "time", kind: "self", tr: {"name": "olacak bir şeyin gölgesi önceden düşer", "at_table": "pusu ve tuzak önceden sezilebilir"}}
      - {id: "rule_repeating_moment", label: "A moment relives itself every day", family: "time", kind: "self", tr: {"name": "belli bir yerde bir an her gün yeniden yaşanır", "at_table": "tekrar eden an bir bilmecedir"}}
      - {id: "rule_delayed_spells", label: "Spells take hold late", family: "time", kind: "spell", tr: {"name": "büyüler geç tutar; etkisi bir süre sonra gelir", "at_table": "büyü bir plan gerektirir"}}
      - {id: "rule_casting_ages", label: "Casting ages the caster", family: "time", kind: "spell", tr: {"name": "büyü, yapanı yaşlandırır", "at_table": "büyücüler yaşlarından yaşlı görünür"}}
      - {id: "rule_true_names", label: "A true name commands", family: "word_sign", kind: "usable", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "birinin gerçek adını bilen ona emredebilir", "at_table": "adlar saklanır"}}
      - {id: "rule_signs_are_spells", label: "Every sign drawn true is a small spell", family: "word_sign", kind: "usable", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "doğru çizilen her işaret küçük bir büyüdür", "at_table": "duvarlarda işaretler, herkeste biraz büyü"}}
      - {id: "rule_gesture_magic", label: "Magic is made by gesture, not word", family: "word_sign", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "büyü sözle değil hareketle yapılır; eli bağlı biri büyü yapamaz", "at_table": "büyücüyü susturmak değil, bağlamak gerekir"}}
      - {id: "rule_tongue_of_magic", label: "A people's tongue is the tongue of magic", family: "word_sign", kind: "usable", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}, {when: {any_of: ["break_no_common_tongue"]}, x: 2}], users: ["user_the_people"], tr: {"name": "bir halkın dili büyünün dilidir; onu konuşan küçük büyüler yapar", "at_table": "dil öğrenmek güç kazanmaktır"}}
      - {id: "rule_names_shape_places", label: "A named place grows like its name", family: "word_sign", kind: "self", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "ad konan bir yer yavaş yavaş adına benzer", "at_table": "yer adları bir silahtır"}}
      - {id: "rule_feelings_make_weather", label: "Strong feeling changes the weather", family: "nature_creatures", kind: "self", requires: {dial: {era: ["medieval", "renaissance", "ancient", "nautical"]}}, tr: {"name": "güçlü bir duygu havayı değiştirir", "at_table": "öfkeli bir kalabalık fırtına getirir"}}
      - {id: "rule_monsters_smell_magic", label: "Monsters come to the smell of magic", family: "nature_creatures", kind: "spell", tr: {"name": "canavarlar büyünün kokusuna gelir", "at_table": "her büyü bir karşılaşma riskidir"}}
      - {id: "rule_seasons_bound_to_a_beast", label: "The seasons are bound to a creature", family: "nature_creatures", kind: "self", requires: {dial: {era: ["medieval", "renaissance", "ancient", "nautical"]}}, tr: {"name": "mevsimler bir canlıya bağlıdır; dev bir hayvanın uykusu kışı getirir", "at_table": "o canlıya dokunmak mevsimi bozar"}}
      - {id: "rule_land_guards_lifeline", label: "The land guards the lifeline", family: "nature_creatures", kind: "self", tr: {"name": "toprak can damarını korur; damara zarar veren toprağın öfkesiyle karşılaşır", "at_table": "doğa bir taraf olur"}}
      - {id: "rule_shadows_move", label: "Shadows move on their own", family: "nature_creatures", kind: "self", tr: {"name": "gölgeler kendi başına hareket eder", "at_table": "bir gölge casus olabilir"}}
      - {id: "rule_one_way_magic", label: "Since the break magic works one way", family: "born_of_break", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], after_the_break: true, tr: {"name": "kırılmadan beri büyü tek yönde çalışır", "at_table": "nerede durduğun, ne yapabileceğini belirler", "name_note": "kalpten dışarı ya da yukarıdan aşağı"}, requires: {none_of: ["time_coming"]}}
      - {id: "rule_spells_feed_the_break", label: "Every spell widens the break", family: "born_of_break", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "her büyü kırılmayı biraz daha büyütür", "at_table": "büyücüler sorumlu tutulur"}}
      - {id: "rule_born_with_magic", label: "Since the break some are born with magic", family: "born_of_break", kind: "self", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], after_the_break: true, tr: {"name": "kırılmadan beri bazı insanlar büyüyle doğuyor", "at_table": "yeni yeteneklilerden korkulur"}, requires: {none_of: ["time_coming"]}}
      - {id: "rule_geography_of_power", label: "Magic is strong near the break's target", family: "born_of_break", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "büyü kırılmanın hedefine yakınken güçlü, uzakta zayıf", "at_table": "gücün bir coğrafyası olur"}}
      - {id: "rule_half_spells", label: "Half of every spell comes out elsewhere", family: "born_of_break", kind: "spell", weight_by: [{when: {dial: {magic: ["low"]}}, x: 0.5}], tr: {"name": "her büyünün yarısı başka bir yerde çıkar", "at_table": "büyü tam kontrol edilemez"}}

  phenomenon_sign:
    roll: {"avoid_used": false}
    note: "may repeat across campaigns"
    hooks_common:
      - {phase: P8, must: "natives know the sign"}
    rows:
      - {id: "psign_colour", label: "A colour in the air", tr: {"name": "havada bir renk"}}
      - {id: "psign_smell", label: "A smell", tr: {"name": "bir koku", "name_note": "ozon, bakır, yanık şeker"}}
      - {id: "psign_hum", label: "A hum or a crackle", tr: {"name": "bir uğultu ya da çıtırtı"}}
      - {id: "psign_tremor", label: "A tremor in the ground", tr: {"name": "yerde bir titreşim"}}
      - {id: "psign_frost", label: "Frost patterns on glass and water", tr: {"name": "camda ve suda kırağı desenleri"}}
      - {id: "psign_body_marks", label: "Marks on the body", tr: {"name": "bedende işaretler"}}
      - {id: "psign_restless_beasts", label: "Restless animals", tr: {"name": "hayvanların huzursuzluğu"}}
      - {id: "psign_compasses", label: "Compasses stray", tr: {"name": "pusulaların sapması"}}
      - {id: "psign_late_reflections", label: "Late reflections", tr: {"name": "geç kalan yansımalar"}}
      - {id: "psign_wrong_shadows", label: "Shadows falling the wrong way", tr: {"name": "ters düşen gölgeler"}}
      - {id: "psign_rings", label: "Rings on still water", tr: {"name": "durgun suda halkalar"}}
      - {id: "psign_leaning_plants", label: "Plants leaning one way", tr: {"name": "bitkilerin bir yöne eğilmesi"}}
      - {id: "psign_metal_taste", label: "A taste of metal", tr: {"name": "ağızda metal tadı"}}
      - {id: "psign_hair_on_end", label: "Hair standing on end", tr: {"name": "dikleşen saçlar"}}
      - {id: "psign_hanging_dust", label: "Dust hanging in the air", tr: {"name": "havada asılı kalan toz"}}
      - {id: "psign_chill", label: "A sudden chill", tr: {"name": "ani bir serinlik"}}

  phenomenon_limit:
    roll: {"avoid_used": false}
    note: "may repeat across campaigns; two limits tie to the people or the institution"
    hooks_common:
      - {phase: P6, must: "the phenomenon's site uses its limit"}
    rows:
      - {id: "limit_iron_cuts", label: "Iron cuts it", weight_by: [{when: {any_of: ["break_iron_is_sacred"]}, x: 2}], tr: {"name": "demir onu keser"}}
      - {id: "limit_running_water", label: "It cannot cross running water", tr: {"name": "akan suyu geçemez"}}
      - {id: "limit_not_on_sleepers", label: "It does not touch sleepers", tr: {"name": "uyuyanlara işlemez"}}
      - {id: "limit_fire_scatters", label: "Fire scatters it", tr: {"name": "ateş onu dağıtır"}}
      - {id: "limit_cold_strengthens", label: "Stronger in cold, weaker in heat", tr: {"name": "soğukta güçlenir, sıcakta zayıflar"}}
      - {id: "limit_height_strengthens", label: "Stronger high, weaker low", tr: {"name": "yüksekte güçlenir, alçakta zayıflar"}}
      - {id: "limit_bloodline_resists", label: "A lineage's blood resists it", tr: {"name": "bir soyun kanı ona karşı koyar", "name_note": "halk imzasına bağlanabilir"}}
      - {id: "limit_institution_sign_stops", label: "The institution's sign stops it", tr: {"name": "kurumun işareti onu durdurur", "name_note": "kurum imzasına bağlanabilir"}}

  phenomenon_user:
    roll: {"avoid_used": false}
    note: "may repeat across campaigns; rolled for the `usable` rules only (item 10); a user row can lock the three signatures together"
    hooks_common:
