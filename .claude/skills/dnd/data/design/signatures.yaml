      - {id: "practice_keep_the_old_works", label: "They keep the remnant's works running", family: "make", hints: ["guild", "scholarly", "state"], tr: {"name": "kalıntının yapılarını onarıp çalışır tutarlar", "gives": "kalıntılara giriş, eski bilgiler", "name_note": "sarnıçlar, yollar, kuleler"}}
      - {id: "practice_golem_founders", label: "They cast golems and machines", family: "make", hints: ["guild", "scholarly", "martial"], tr: {"name": "golem ve makine dökerler", "gives": "koruyucu yapılar, bozulan makineler"}}
