      - {id: "user_everyone", label: "Everyone", tr: {"name": "herkes"}}
      - {id: "user_no_one", label: "No one: it happens by itself", tr: {"name": "kimse, olgu kendiliğinden olur"}}
      - {id: "user_the_people", label: "Only the signature people", tr: {"name": "yalnızca imza halkı"}}
      - {id: "user_the_institution", label: "Only the institution's trained", tr: {"name": "yalnızca imza kurumunun eğitimlileri"}}
      - {id: "user_touched_by_the_break", label: "Only those the break touched", after_the_break: true, tr: {"name": "yalnızca kırılmanın dokundukları"}, requires: {none_of: ["time_coming"]}}
      - {id: "user_children", label: "Only children", tr: {"name": "yalnızca çocuklar"}}
      - {id: "user_casters", label: "Only spellcasters", tr: {"name": "yalnızca büyücüler"}}
      - {id: "user_born_here", label: "Only those born in this land", tr: {"name": "yalnızca o toprakta doğanlar"}}
