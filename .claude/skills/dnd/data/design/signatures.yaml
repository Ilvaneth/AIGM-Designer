      - {id: "practice_pilots", label: "Pilots of dangerous waters and roads", family: "carry", hints: ["guild", "trade", "criminal"], weight_by: [{when: {any_of: ["break_maps_are_illegal"]}, x: 3}], tr: {"name": "tehlikeli sularda ve yollarda kılavuzluk ederler", "gives": "rehberler, yol bilgisi"}}
