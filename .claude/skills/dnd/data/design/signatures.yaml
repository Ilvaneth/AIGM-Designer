      - {id: "practice_keep_the_dying", label: "They keep what is dying", family: "know", hints: ["scholarly", "religious", "resistance"], tr: {"name": "ölmekte olanı saklarlar", "gives": "koruma ve toplama görevleri", "name_note": "tohumlar, türler, şarkılar"}}
      - {id: "practice_healers", label: "They are healers", family: "care", hints: ["religious", "guild", "scholarly", "resistance"], tr: {"name": "şifacıdırlar", "gives": "iyileşme, salgın görevleri"}}
      - {id: "practice_keep_the_granaries", label: "They keep the famine granaries", family: "care", hints: ["state", "religious", "guild"], tr: {"name": "kıtlıkta halkı besleyen ambarları tutarlar", "gives": "ekinin dağıtımı, kıtlığın siyaseti"}}
      - {id: "practice_midwives", label: "Midwives who watch the births", family: "care", hints: ["religious", "guild"], tr: {"name": "ebedirler, doğumları gözetirler", "gives": "doğan çocukların işaretleri"}}
      - {id: "practice_herd_healers", label: "They heal herds and mounts", family: "care", hints: ["guild", "religious"], tr: {"name": "sürüleri ve binekleri iyileştirirler", "gives": "sürü hastalığı görevleri"}}
      - {id: "practice_monster_hunters", label: "Monster hunters", family: "war", hints: ["martial", "guild", "resistance"], tr: {"name": "canavar avcılarıdır", "gives": "av sözleşmeleri, canavar bilgisi"}}
      - {id: "practice_border_riders", label: "Riders of the border and its forts", family: "war", hints: ["martial", "state"], weight_by: [{when: {any_of: ["break_border_forbidden"]}, x: 3}], tr: {"name": "sınırın ve kalelerin süvarileridir", "gives": "sınır görevleri"}}
      - {id: "practice_champions", label: "Champions who settle disputes in single combat", family: "war", hints: ["martial", "state"], weight_by: [{when: {any_of: ["break_war_is_ritual"]}, x: 3}], tr: {"name": "anlaşmazlıkları teke tek dövüşle çözen şampiyonlardır", "gives": "düellolar; parti bir tarafın şampiyonu olabilir"}}
      - {id: "practice_free_company", label: "A mercenary company", family: "war", hints: ["martial", "trade", "criminal"], form: "form_company", tr: {"name": "paralı bir bölüktür", "gives": "iş, rakipler, bozulan sözleşmeler"}}
      - {id: "practice_dragon_hunters", label: "They hunt dragons", family: "war", weight_by: [{when: {any_of: ["life_dragon_protection", "contest_humans_dragon", "ruin_age_of_dragons", "ruin_giants_and_dragons", "break_dragons_rule"]}, x: 3}], hints: ["martial"], tr: {"name": "ejderha avlarlar", "gives": "büyük av, ejderhanın hazinesi"}}
      - {id: "practice_monopoly", label: "The monopoly of one good", family: "trade", hints: ["trade", "guild", "state"], tr: {"name": "bir malın tekelini tutarlar", "gives": "ticaret görevleri, tekelin düşmanları"}}
      - {id: "practice_sell_the_remnant", label: "They sell what comes out of the remnant", family: "trade", hints: ["trade", "criminal", "scholarly"], weight_by: [{when: {any_of: ["break_ruins_forbidden"]}, x: 3}], tr: {"name": "kalıntıdan çıkan eşyaları satarlar", "gives": "hazine, sahte eserler"}}
