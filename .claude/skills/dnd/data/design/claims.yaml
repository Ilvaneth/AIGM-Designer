# how two overrides of one default stand together: [{default, rows: [a, b], combine: "one line"}];
# `any_two: true` makes one line hold for any two or more of its rows (build item 22a)
combines:
  - {default: regulator_identity, rows: [break_magic_is_nobility, contest_casters_casterless], combine: "the contest's side a is the nobility; one regulator"}
  - {default: regulator_identity, rows: [break_casting_forbidden, contest_casters_casterless], combine: "the contest's side a is the ban's licensed exception and its enforcer; one regulator"}
  - {default: regulator_strictness, rows: [break_casting_forbidden, contest_casters_casterless], combine: "the ban's strictest rule holds; side a enforces it"}
  - {default: site_attitude_pool, rows: [break_monsters_have_treaties, break_dungeons_inhabited], combine: "the treaty people's lairs are negotiate; every other site's pool loses kill and ignore"}
  # build item 22a (open point 7): the great gods' raisers stand together. A line with `any_two: true` holds for
  # whichever two or more of its rows are rolled together (the ledger makes them one promise)
  - {default: great_gods_floor, any_two: true, rows: [break_gods_among_mortals, break_god_name_forbidden, contest_one_pasture, contest_one_shrine, contest_old_gods_new_faith, contest_lords_peasants, contest_casters_casterless, contest_sealed_remnant, contest_open_close_gate, contest_empty_throne, contest_two_branches, contest_order_schism, contest_humans_dragon, contest_humans_fey, contest_living_dead, contest_elemental_lord, contest_relic_pieces, contest_prophecy],
     combine: "the floor is the count of distinct great gods the rows name: one per seated religious role, at least one among mortals, the unnamed god one of them; under the dualist pantheon its two great gods carry them"}
