# claims.yaml — the closed registry of claims, clashes and overridable defaults (plan item 25, build item 7c;
# docs/p1-tags.md, the rules of 2026-10-02).
#
# A claim is a fact about the world a rolled row asserts: `claims: {topic: value}` on a row, or on a contest
# role. A rolled row's claims enter the arbiter's context as tokens `claim:<topic>=<value>`; a row conflicts
# with every token whose claim clashes with one of its own. Clashes are declared pair by pair: two values of
# one topic never clash by default. A row may also name a token directly in `conflicts_with`, `requires`
# (`any_of`, `all_of`, `none_of`) and `weight_by`.
#
# An overridable default is something a dial effect, a scale number, a quota or a later phase's roll sets, which a
# rolled row may rewrite: `overrides: [{default: <id>, to: <text or value>}]` on the row. An override is data
# only: the floor that owns the default applies it at its own turn. When two rows that can be rolled together
# override the same default, `combines` says in one line how the two overrides stand together.
#
# The file holds no rows and is never rolled.
schema_version: 1
table: claims
consumed_by: [P1, P2, P3, P4, P5, P6, P7, P8, validator]
plan: "item 25, build item 7c; docs/p1-tags.md"

topics:
  rule: {label: "the land's rule", values: [hereditary, throne, by_lot, guild_council, dragon_sovereign]}
  nobility: {label: "the nobility", values: [exists, none]}
  below_ground: {label: "below ground", values: [lived_in]}
  writing: {label: "writing", values: [printed]}
  magic: {label: "how plentiful magic is", values: [scarce, middling, plentiful, faded, running_out]}
  war: {label: "how war is fought", values: [by_armies, by_champions]}
  # build item 22a (the P2 tag pass, docs/reports/p2-tags-draft.md §1.1; the owner's rulings in docs/p2-tags.md)
  gods: {label: "what the gods are now", values: [answering, dead, silent, among_mortals, spirits]}
  gods_shown: {label: "how the gods show themselves", values: [never, omens, ordained, at_places, walking, through_phenomenon]}
  casting: {label: "whether casting is allowed", values: [forbidden, licensed, by_caste, free]}
  moon: {label: "the moon", values: [none, unseen, one, two, place, face, tidal]}

# pair by pair; `rule=throne` clashes with neither by_lot nor dragon_sovereign
clashes:
  - ["nobility=exists", "nobility=none"]
  - ["rule=hereditary", "rule=by_lot"]
  - ["rule=hereditary", "rule=guild_council"]
  - ["rule=hereditary", "rule=dragon_sovereign"]
  - ["rule=throne", "rule=guild_council"]
  - ["magic=plentiful", "magic=faded"]
  - ["war=by_armies", "war=by_champions"]
  # build item 22a: the P2 tag pass's pairs between two claims (D1-D6, and C5 for the silent gods)
  - ["gods=dead", "gods_shown=walking"]
  - ["gods=silent", "gods_shown=omens"]
  - ["gods=silent", "gods_shown=walking"]
  - ["gods=among_mortals", "gods=dead"]
  - ["gods=among_mortals", "gods=silent"]
  - ["casting=forbidden", "casting=free"]
  - ["gods=silent", "gods_shown=through_phenomenon"]

