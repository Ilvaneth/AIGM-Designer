# trope-breaks.yaml — the trope break (plan item 25, step 2 #5; docs/p1-foundation-rows.md §12 and §18 #1).
# Step 2's first roll: it inverts defaults the later rolls read (lineage homes, weapons, monster treaties, divine
# magic). Count by scale: short 1, standard and epic 2, from different families. Each break carries a rolled tie to
# one foundation piece (lifeline, ruin source, contest, break) through which the writer explains the inversion; the
# new-taboo scar draws one break from the prohibition rows. 17 rows kept, 25 dropped, 16 added (2026-09-28/29).
schema_version: 1
table: trope-breaks
consumed_by: [P1, P2, P3, P4, P5, P6, P8]
plan: "item 4.4, 17 #5, item 25 step 2 #5, risk 24.1 #10"
roll: {count_by_scale: {short: 1, standard: 2, epic: 2}, avoid_used: true, families_distinct: true}
hooks_common:
  - {phase: P1, must: "the break is stated in one sentence in the player pitch and explained through its tied foundation piece; it is public knowledge unless the row says otherwise"}
  - {phase: P8, must: "the primer states the break as a native would: plainly, without wonder"}
  - {phase: validator, must: "the break_ entity's refs reach at least five entities of at least three types"}

tables:
  tie:
    roll: {avoid_used: false, note: "one per trope break; the foundation pieces only (item 25 review #1)"}
    hooks_common:
      - {phase: P1, must: "the writer explains the inversion through the tied piece; the door checks the tie's id"}
    rows:
      - {id: tie_lifeline, label: The lifeline, piece: lifeline, tr: {name: "can damarı"}}
      - {id: tie_ruin_source, label: The ruin source, piece: ruin_source, tr: {name: "yıkıntı kaynağı"}}
      - {id: tie_contest, label: The contest, piece: contest, tr: {name: "çekişme"}}
      - {id: tie_break, label: The break, piece: break, tr: {name: "kırılma"}}

rows:
  - id: break_rule_by_lottery
    label: "Rulers are drawn by lot"
    family: governance
    statement: "Every office is filled by lottery for a fixed term; ambition is shameful and secretly universal."
    tags: [polity, society]
    conflicts_with: [tension_inheritance_merit]
    tr: {"name": "hükümdarlar kurayla seçilir", "at_table": "her kura bir siyasi kriz"}
    hooks:
      - {phase: P4, must: "the state faction's succession rule is the lottery; an operation is rigging it"}
      - {phase: P5, must: "the ruler NPC is an ordinary person; the heir field is `next draw`"}
  - id: break_no_kings_only_guilds
    label: "Guilds rule; there are no lords"
    family: governance
    statement: "There is no nobility; the guild charters are the constitution and the masters sit as the council."
    tags: [polity, economy]
    tr: {"name": "lordlar yoktur; loncalar yönetir", "at_table": "güç, zanaat ve para demek"}
    hooks:
      - {phase: P4, must: "the state faction has archetype guild; the access chain runs through masters"}
      - {phase: P3, must: "the seat of rule anchor is a guild hall"}
  - id: break_war_is_ritual
    label: "War is fought by champions"
    family: governance
    statement: "Mass war is unthinkable; disputes are settled by a small number of named fighters under rules everyone knows."
    tags: [war, law]
    tr: {"name": "savaşları ordular değil şampiyonlar yapar", "at_table": "parti bir ülkenin şampiyonu olabilir"}
    hooks:
      - {phase: P4, must: "martial factions' assets are champions (NPCs); a seize move is a challenge"}
      - {phase: P8, must: "the primer states the rules of challenge"}
  - id: break_weapons_one_class
    label: "Only one class may bear arms"
    family: governance
    statement: "Carrying a weapon is a privilege of one class; everyone else is disarmed by law."
    tags: [polity, society]
    prohibition: true                # the new-taboo scar draws from these
    tr: {"name": "silah taşımak yalnızca bir sınıfa açıktır", "at_table": "silahlı bir parti ya ayrıcalıklıdır ya suçlu"}
    hooks:
      - {phase: P3, must: "the law ladder names who may bear arms; a settlement's gate checks it"}
      - {phase: P4, must: "the armed class is a faction, or a privilege a faction guards"}
      - {phase: P5, must: "NPCs of the armed class carry weapons openly; the rest do not"}
  - id: break_magic_is_nobility
    label: "Magic is nobility"
    family: governance
    statement: "Every noble can cast and every caster is noble, or a noble's hidden child."
    tags: [polity, magic]
    tr: {"name": "büyü soyluluktur; büyüsüz soylu yoktur", "at_table": "büyücü bir PC doğuştan bir statüye sahiptir"}
    hooks:
      - {phase: P2, must: "magic's regulator is the nobility itself"}
      - {phase: P4, must: "the state faction's leaders are casters"}
      - {phase: P5, must: "caster NPCs are nobles or their bastards"}
  - id: break_dragons_rule
    label: "Dragons rule the lands"
    family: governance
    statement: "Each realm's sovereign is a dragon; a mortal household speaks and acts for it."
    tags: [polity, creatures]
    tr: {"name": "ülkeleri ejderhalar yönetir", "at_table": "hükümdarla konuşmak bir ejderhayla konuşmak demek"}
    hooks:
      - {phase: P4, must: "each polity's ruler is a dragon and its household a faction"}
      - {phase: P5, must: "a dragon ruler is a major NPC"}
      - {phase: P6, must: "a dragon's lair is a seat of rule, not a dungeon"}
  - id: break_border_forbidden
    label: "Crossing the border is forbidden"
    family: governance
    statement: "No one may cross the land's border; what lies beyond is both lure and crime."
    tags: [polity, geography]
    prohibition: true                # the new-taboo scar draws from these
    tr: {"name": "sınırı geçmek yasaktır", "at_table": "sınırın ötesi hem çekici hem cezalı"}
    hooks:
      - {phase: P3, must: "the border is a map line with its wardens; beyond it lies a named region"}
      - {phase: P4, must: "a faction guards the border and another profits from crossing it"}
      - {phase: P7, must: "a chapter asks the party to cross it"}
  - id: break_elves_are_new
    label: "The elves arrived last century"
    family: peoples
    statement: "Humans are the ancient people with the old ruins; elves, dwarves or another people are recent arrivals with no past here."
    tags: [people, history]
    conflicts_with: [ruin_elven_withdrawal]
    tr: {"name": "elfler geçen yüzyıl geldi", "at_table": "elfler yeni, yabancı ve kuşkuyla karşılanan bir halktır"}
    hooks:
      - {phase: P2, must: "a dated event is the arrival; taught and true layers differ on why they came"}
      - {phase: P5, must: "the demographic table gives the new people a district or a camp and no roots older than one generation"}
  - id: break_giants_are_peasants
    label: "The large folk are the peasantry"
    family: peoples
    statement: "Giants, ogres or trolls are the tenant farmers and labourers; the small are the landlords."
    tags: [people, society]
    tr: {"name": "devler köylüdür; toprağı onlar işler", "at_table": "devler dost, hatta işveren olabilir"}
    hooks:
      - {phase: P5, must: "the demographic table lists the large folk with a settlement share; one supporting NPC is one"}
      - {phase: P6, must: "monster-ecology marks the species as a people; their homes are not lairs"}
  - id: break_monsters_have_treaties
    label: "The monsters hold treaties"
    family: peoples
    statement: "Goblins, giants or another 'monster' people hold sealed treaties; breaking one is the crime, not meeting them."
    tags: [creature, law]
    tr: {"name": "canavarların antlaşmaları vardır", "at_table": "her canavar karşılaşması önce bir pazarlıktır"}
    hooks:
      - {phase: P4, must: "the treaty people are a faction with a stance row and an operation"}
      - {phase: P6, must: "their lairs are sites with attitude `negotiate`; monster-ecology marks the species as a people"}
      - {phase: P8, must: "the primer lists the treaty terms a native knows"}
  - id: break_beasts_own_land
    label: "Beasts speak and hold land"
    family: peoples
    statement: "Some animals speak and hold title; a wood may have a lord who is a stag."
    tags: [creature, law]
    tr: {"name": "hayvanlar konuşur ve toprak sahibidir", "at_table": "ormanın bir sahibi, bir sözü vardır"}
    hooks:
      - {phase: P3, must: "one region is held by a beast lord; its travel table is negotiated passage"}
      - {phase: P4, must: "the beast lord is a faction with a stance row"}
  - id: break_humans_minority
    label: "Humans are the minority"
    family: peoples
    statement: "The world belongs to other lineages; humans are few, recent and strange."
    tags: [peoples, society]
    tr: {"name": "insanlar azınlıktır; dünya başka soyların", "at_table": "insan bir PC yabancıdır"}
    hooks:
      - {phase: P3, must: "the settlements' demographic rows put humans last"}
      - {phase: P5, must: "most NPCs are of other lineages"}
      - {phase: P8, must: "the primer tells a human stranger how they are seen"}
  - id: break_lineage_homes_inverted
    label: "The lineages' homes are inverted"
    family: peoples
    statement: "Each lineage lives where the defaults would never put it."
    tags: [peoples, geography]
    tr: {"name": "soyların yurtları alışılmışın tersidir", "at_table": "beklenti her soyda bozulur", "name_note": "cüceler denizci, elfler bozkır göçebesi"}
    hooks:
      - {phase: P1, must: "the people signature's lineage takes an inverted home"}
      - {phase: P3, must: "each lineage's settlements sit where the defaults would not put them"}
      - {phase: P5, must: "NPCs' lineages and trades break the defaults"}
  - id: break_goblins_are_merchants
    label: "Goblins are the world's merchants"
    family: peoples
    statement: "Every market is goblin-run; trade speaks goblin."
    tags: [peoples, economy]
    tr: {"name": "dünyanın tüccarları goblinlerdir", "at_table": "her pazar onlarındır"}
    hooks:
      - {phase: P3, must: "the markets are goblin-run"}
      - {phase: P4, must: "a trade faction is goblin"}
      - {phase: P6, must: "goblins are no filler monsters; a goblin site is a trading house"}
  - id: break_sacred_beast
    label: "Killing a sacred beast is forbidden"
    family: peoples
    statement: "One kind of animal is holy; killing one is the gravest crime, whatever the need."
    tags: [faith, creatures]
    prohibition: true                # the new-taboo scar draws from these
    tr: {"name": "kutsal bir hayvanı öldürmek yasaktır", "at_table": "bir av, bir savunma, bir açlık ahlaki bir karara döner"}
    hooks:
      - {phase: P2, must: "a god or a rite names the sacred beast"}
      - {phase: P5, must: "an NPC has killed one, or wants to"}
      - {phase: P6, must: "a site's encounter or hazard is the sacred beast"}
  - id: break_gods_need_witnesses
    label: "The gods need witnesses, not worship"
    family: gods
    statement: "A god exists only while someone is watching; the temples are watch-houses and the rite is attention."
    tags: [faith, cosmology]
    tr: {"name": "tanrılar tapınma değil tanık ister", "at_table": "bir mucizeyi görmek bir görevdir"}
    hooks:
      - {phase: P2, must: "each god's church is a watch; one god is fading for lack of witnesses"}
      - {phase: P6, must: "one site is a watch that failed"}
  - id: break_gods_are_ancestors_known
    label: "The gods are the souls of mortal ancestors"
    family: gods
    statement: "Everyone knows the gods were once people of this land; godhood is a career the dead can have."
    tags: [faith, death]
    overrides: {"pantheon_type": "pantheon_ancestor_gods"}
    tr: {"name": "tanrıların ölümlü ataların ruhları olduğunu herkes bilir", "at_table": "din bir aile işidir"}
    hooks:
      - {phase: P2, must: "every god has a mortal biography in the history; rank is earned; one candidate is pending"}
      - {phase: P4, must: "a religious faction's endgame is raising its founder"}
  - id: break_moon_trades
    label: "The moon is inhabited and trades"
    family: gods
    statement: "Ships go to the moon when it is full; the moon folk sell what nothing here can make."
    tags: [cosmology, economy]
    overrides: {"era_bias": ["era_nautical"]}
    tr: {"name": "ayda yaşayanlar vardır ve ticaret yaparlar", "at_table": "gökten gelen mallar ve yabancılar"}
    hooks:
      - {phase: P2, must: "the moon is a touched plane with a way in, a cost and a time rate"}
      - {phase: P4, must: "a trade faction holds the moon charter"}
  - id: break_divine_magic_holy_ground
    label: "Divine magic works only on holy ground"
    family: gods
    statement: "A god's power reaches only as far as its holy places."
    tags: [faith, magic]
    tr: {"name": "tanrıların büyüsü yalnızca kutsal yerlerde işler", "at_table": "rahip bir PC kutsal yerden uzaklaştıkça güç kaybeder"}
    hooks:
      - {phase: P2, must: "each god's holy ground is named"}
      - {phase: P3, must: "the holy grounds are map nodes"}
      - {phase: P6, must: "a site's holy ground changes what a cleric can do there"}
  - id: break_god_name_forbidden
    label: "Naming one of the gods is forbidden"
    family: gods
    statement: "One god's name may not be spoken; its priests hide, and whoever knows the name is dangerous."
    tags: [faith, society]
    prohibition: true                # the new-taboo scar draws from these
    tr: {"name": "tanrılardan birinin adını anmak yasaktır", "at_table": "o tanrının rahipleri gizlenir, adı bilen tehlikelidir"}
    hooks:
      - {phase: P2, must: "the unnamed god has a public epithet and a hidden name"}
      - {phase: P4, must: "the unnamed god's priests are a hidden faction"}
      - {phase: P5, must: "an NPC knows the name"}
  - id: break_night_is_safe
    label: "Night is safe and day is dangerous"
    family: danger
    statement: "Whatever hunts does so under the sun; people travel and work by night and shutter at dawn."
    tags: [ecology, calendar]
    tr: {"name": "gece güvenli, gündüz tehlikelidir", "at_table": "yolculuk ve baskın gece yapılır"}
    hooks:
      - {phase: P2, must: "the calendar's sensory tone is written for night; the moon marks the working hours"}
      - {phase: P3, must: "travel tables roll by day-hours; a daylight crossing is a hazard"}
      - {phase: P6, must: "the signature creature or the ecology's apex hunts by day"}
  - id: break_cities_dangerous
    label: "Cities are dangerous, the wild is safe"
    family: danger
    statement: "The wild shelters; the cities are where people die."
    tags: [society, danger]
    tr: {"name": "şehirler tehlikeli, vahşi doğa güvenlidir", "at_table": "sığınak ormandır, tuzak şehir"}
    hooks:
      - {phase: P3, must: "each settlement carries a danger the wild lacks"}
      - {phase: P6, must: "an urban site is the deadliest of its tier"}
      - {phase: P8, must: "the primer says where it is safe to sleep"}
  - id: break_dungeons_inhabited
    label: "Every ruin is someone's home"
    family: danger
    statement: "No dungeon is empty; you knock before you enter."
    tags: [danger, society]
    tr: {"name": "zindanlar boş değildir; her harabe birilerinin evidir ve kapısı çalınır", "at_table": "zindana girmek önce bir ziyarettir"}
    hooks:
      - {phase: P5, must: "each site's householder is an NPC"}
      - {phase: P6, must: "every site's attitude starts at negotiate; its inhabitants answer the door"}
  - id: break_slayer_inherits
    label: "Who slays a great monster inherits its burden"
    family: danger
    statement: "Killing a great beast hands you what it carried."
    tags: [danger, creatures]
    tr: {"name": "büyük bir canavarı öldüren onun yükünü devralır", "at_table": "zafer bir bedel getirir, öldürmek bir karardır"}
    hooks:
      - {phase: P4, must: "a faction watches who kills great monsters"}
      - {phase: P6, must: "a site's boss carries a burden its slayer inherits"}
      - {phase: P7, must: "a chapter turns on an inherited burden"}
  - id: break_underground_forbidden
    label: "Going below ground is forbidden"
    family: danger
    statement: "No one may go down into the earth; every descent is a crime and whoever comes back up is shunned."
    tags: [danger, society]
    prohibition: true                # the new-taboo scar draws from these
    tr: {"name": "yeraltına inmek yasaktır", "at_table": "her zindan bir suçtur, aşağıdan dönen dışlanır"}
    hooks:
      - {phase: P3, must: "the law ladder punishes descent; the ways down are watched"}
      - {phase: P5, must: "an NPC came back from below and is shunned"}
      - {phase: P6, must: "every underground site is entered against the law"}
  - id: break_world_is_young
    label: "The world is young"
    family: time
    statement: "Written history is three hundred years old; there are no ancient secrets, only the recent past's."
    tags: [history, society]
    tr: {"name": "dünya genç; yazılı tarih üç yüz yıllık", "at_table": "kadim sırlar yok, yakın geçmişin sırları var"}
    hooks:
      - {phase: P2, must: "the history's ages fit in three centuries; the ruin source's fall and the break are within them"}
      - {phase: P6, must: "sites may be older than the fall, but everything known about them dates from the fall; what came before is unknown, not hidden"}
  - id: break_the_enemy_won
    label: "The enemy won and everyone is fine"
    family: time
    statement: "The taught war was lost; the party's people live under the victors, and life is better than the songs admit."
    tags: [history, polity]
    tr: {"name": "eski düşman kazandı ve herkes iyi", "at_table": "\"kötülerin\" dünyası sıradan bir dünyadır"}
    hooks:
      - {phase: P2, must: "the founding event is the defeat; taught and true layers differ on how bad the victors are"}
      - {phase: P4, must: "the resistance faction's true belief is nostalgia; the state faction is the victors"}
  - id: break_dead_month
    label: "One month a year magic does not work"
    family: time
    statement: "In the empty month nothing casts; wards fail, the sick die, and everyone who depends on magic hides."
    tags: [magic, calendar]
    tr: {"name": "yılda bir ay büyü çalışmaz", "at_table": "büyücüler o ay için hazırlanır"}
    hooks:
      - {phase: P2, must: "the calendar names the month; the simulation's volatility doubles in it"}
      - {phase: P7, must: "one beat or the doom sits in the empty month"}
  - id: break_iron_is_sacred
    label: "Iron is sacred and rare"
    family: knowledge
    statement: "Iron may be worked only by a priesthood; the world runs on bronze, bone and wood."
    tags: [economy, faith]
    tr: {"name": "demir kutsal ve nadirdir", "at_table": "demir silah bir hazinedir"}
    hooks:
      - {phase: P3, must: "the price table marks iron goods ×5 and licensed"}
      - {phase: P4, must: "the iron priesthood is a faction; its fracture is a smuggler"}
      - {phase: P6, must: "a loot rule: iron weapons are a payoff, never filler"}
  - id: break_maps_are_illegal
    label: "Maps are forbidden"
    family: knowledge
    statement: "To draw the land is treason; guides are licensed and the routes are memorised songs."
    tags: [knowledge, law]
    prohibition: true                # the new-taboo scar draws from these
    tr: {"name": "haritalar yasaktır", "at_table": "yol bilgisi en değerli şeydir"}
    hooks:
      - {phase: P3, must: "the player map shows only the primer's named places; travel-times exist for the DM only"}
      - {phase: P4, must: "the guides are a guild faction; a map fragment is an item_ everyone wants"}
  - id: break_children_are_rare
    label: "Births are rare and public"
    family: knowledge
    statement: "A child is born perhaps once a year in a town; each birth is a civic event and every child is watched."
    tags: [society, cosmology]
    tr: {"name": "doğumlar nadirdir ve herkesin önünde olur", "at_table": "her çocuk bir olaydır"}
    hooks:
      - {phase: P5, must: "the demographic table has almost no children; a child NPC is major or supporting"}
      - {phase: P2, must: "the big secret or a god's secret concerns why"}
  - id: break_no_direct_lies
    label: "No one can lie outright"
    family: knowledge
    statement: "A direct lie is impossible; everyone evades instead."
    tags: [society, magic]
    tr: {"name": "kimse doğrudan yalan söyleyemez; herkes lafı dolandırır", "at_table": "her konuşma bir bilmecedir"}
    hooks:
      - {phase: P5, must: "NPCs speak in evasions, never plain lies"}
      - {phase: P8, must: "the primer teaches how a native evades"}
  - id: break_no_writing
    label: "Writing is unknown"
    family: knowledge
    statement: "Knowledge lives in memory; a word is a handshake."
    tags: [society, knowledge]
    tr: {"name": "yazı bilinmez; bilgi ezberde taşınır, söz el sıkışmaktır", "at_table": "tanıklar ve ezberciler değerlidir"}
    hooks:
      - {phase: P3, must: "no settlement has a library; memorisers keep the records"}
      - {phase: P5, must: "at least one NPC is a memoriser"}
      - {phase: P6, must: "no site's clue is a written page"}
