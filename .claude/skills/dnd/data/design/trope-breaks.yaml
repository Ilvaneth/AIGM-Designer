# trope-breaks.yaml — the trope break (plan item 25, step 2 #5; docs/p1-foundation-rows.md §12 and §18 #1).
# Step 2's first roll: it inverts defaults the later rolls read (lineage homes, weapons, monster treaties, divine
# magic). Count by scale: short 1, standard and epic 2, from different families. Each break carries a rolled tie to
# one foundation piece (lifeline, ruin source, contest, break) through which the writer explains the inversion; the
# new-taboo scar draws one break from the prohibition rows (eight). 31 rows after the tag review (docs/p1-tags.md,
# docs/p1-build-7c.md): claims, clashes, overrides (data only), fits as weights, merge rules for item 10.
schema_version: 1
table: trope-breaks
consumed_by: [P1, P2, P3, P4, P5, P6, P8]
plan: "item 4.4, 17 #5, item 25 step 2 #5, risk 24.1 #10"
roll: {count_by_scale: {short: 1, standard: 2, epic: 2}, avoid_used: true, families_distinct: true}
hooks_common:
  - {phase: P1, must: "the break is stated in one sentence in the player pitch and explained through its tied foundation piece; it is public knowledge unless the row says otherwise"}
  - {phase: P8, must: "the primer states the break as a native would: plainly, without wonder"}
  - {phase: validator, must: "the break_ entity's refs reach at least five entities of at least three types"}

tables:
  tie:
    roll: {avoid_used: false, note: "one per trope break; the foundation pieces only (item 25 review #1)"}
    hooks_common:
      - {phase: P1, must: "the writer explains the inversion through the tied piece; the door checks the tie's id"}
    rows:
      - {id: tie_lifeline, label: The lifeline, piece: lifeline}
      - {id: tie_ruin_source, label: The ruin source, piece: ruin_source}
      - {id: tie_contest, label: The contest, piece: contest}
      - {id: tie_break, label: The break, piece: break, conflicts_with: [time_coming]}   # no break to explain by yet
rows:
  - id: break_rule_by_lottery
    label: "Rulers are drawn by lot"
    family: governance
    statement: "Every office is filled by lottery for a fixed term; ambition is shameful and secretly universal."
    claims: {"rule": "by_lot"}
    conflicts_with: ["tension_inheritance_merit"]
    overrides: [{"default": "state_succession", "to": "the lottery"}, {"default": "ruler_heir", "to": "the next draw"}, {"default": "politics_node_kinds", "to": "succession and election become the day of the draw"}]
    text: {"name": "rulers are chosen by lot", "at_table": "every draw is a political crisis"}
    hooks:
      - {phase: P4, must: "the state faction's succession rule is the lottery; an operation is rigging it"}
      - {phase: P5, must: "the ruler NPC is an ordinary person; the heir field is `next draw`"}
  - id: break_no_kings_only_guilds
    label: "Guilds rule; there are no lords"
    family: governance
    statement: "There is no nobility; the guild charters are the constitution and the masters sit as the council."
    claims: {"nobility": "none", "rule": "guild_council"}
    overrides: [{"default": "forced_state_faction", "to": "its archetype is guild"}, {"default": "seat_of_rule_anchor", "to": "a guild hall"}, {"default": "politics_node_kinds", "to": "succession becomes the choosing of masters"}]
    weight_by: [{"when": {"any_of": ["contest_one_harbour", "contest_old_new_craft", "contest_mine_owners_miners", "contest_share_keep_knowledge", "contest_monster_bounty", "contest_new_resource", "contest_split_family", "contest_surface_deep"]}, "x": 2}]
    text: {"name": "there are no lords; the guilds rule", "at_table": "power means craft and money"}
    hooks:
      - {phase: P4, must: "the state faction has archetype guild; the access chain runs through masters"}
      - {phase: P3, must: "the seat of rule anchor is a guild hall"}
  - id: break_war_is_ritual
    label: "War is fought by champions"
    family: governance
    statement: "Mass war is unthinkable; disputes are settled by a small number of named fighters under rules everyone knows."
    claims: {"war": "by_champions"}
    overrides: [{"default": "contest_last_step", "to": "a challenge of champions"}, {"default": "war_node_kinds", "to": "duel, the choosing of champions, parley, raid"}, {"default": "martial_assets", "to": "champions"}]
    text: {"name": "wars are fought not by armies but by champions", "at_table": "the party can be a country's champion"}
    hooks:
      - {phase: P4, must: "martial factions' assets are champions (NPCs); a seize move is a challenge"}
      - {phase: P8, must: "the primer states the rules of challenge"}
  - id: break_weapons_one_class
    label: "Only one class may bear arms"
    family: governance
    statement: "Carrying a weapon is a privilege of one class; everyone else is disarmed by law."
    prohibition: true                # the new-taboo scar draws from these
    weight_by: [{"when": {"any_of": ["contest_lords_peasants"]}, "x": 2}]
    text: {"name": "bearing arms is open to one class only", "at_table": "an armed party is either privileged or criminal"}
    hooks:
      - {phase: P3, must: "the law ladder names who may bear arms; a settlement's gate checks it"}
      - {phase: P4, must: "the armed class is a faction, or a privilege a faction guards"}
      - {phase: P5, must: "NPCs of the armed class carry weapons openly; the rest do not"}
  - id: break_magic_is_nobility
    label: "Magic is nobility"
    family: governance
    statement: "Every noble can cast and every caster is noble, or a noble's hidden child."
    claims: {"nobility": "exists"}
    conflicts_with: ["break_casting_forbidden"]
    overrides: [{"default": "regulator_identity", "to": "the nobility"}, {"default": "caster_share", "to": "as many as the nobles"}, {"default": "primer_public_casting", "to": "what a commoner risks by casting"}]
    weight_by: [{"when": {"any_of": ["contest_casters_casterless"]}, "x": 2}]
    merges_with: {"contest_casters_casterless": "role a is the nobility; one regulator"}
    text: {"name": "magic is nobility; there is no noble without magic", "at_table": "a spellcaster PC holds a status by birth"}
    hooks:
      - {phase: P2, must: "magic's regulator is the nobility itself"}
      - {phase: P4, must: "the state faction's leaders are casters"}
      - {phase: P5, must: "caster NPCs are nobles or their bastards"}
  - id: break_dragons_rule
    label: "Dragons rule the lands"
    family: governance
    statement: "Each realm's sovereign is a dragon; a mortal household speaks and acts for it."
    claims: {"rule": "dragon_sovereign"}
    overrides: [{"default": "state_leader", "to": "a dragon"}]
    weight_by: [{"when": {"any_of": ["life_dragon_protection"]}, "x": 2}]
    merges_with: {"contest_humans_dragon": "role b takes the hint state (the sovereign dragon and its household); role a takes resistance; third and fourth stay"}
    merge_role_hints: {"contest_humans_dragon": {"a": "resistance", "b": "state"}}     # the merge above, for the script (build item 10)
    text: {"name": "the lands are ruled by dragons", "at_table": "speaking with the ruler means speaking with a dragon"}
    hooks:
      - {phase: P4, must: "each polity's ruler is a dragon and its household a faction"}
      - {phase: P5, must: "a dragon ruler is a major NPC"}
      - {phase: P6, must: "a dragon's lair is a seat of rule, not a dungeon"}
  - id: break_border_forbidden
    label: "Crossing the border is forbidden"
    family: governance
    statement: "No one may cross the land's border; what lies beyond is both lure and crime."
    prohibition: true                # the new-taboo scar draws from these
    weight_by: [{"when": {"any_of": ["spine_long_wall"]}, "x": 2}, {"when": {"any_of": ["contest_open_close_road"]}, "x": 3}, {"when": {"any_of": ["contest_forbidden_lands"]}, "x": 2}]
    text: {"name": "crossing the border is forbidden", "at_table": "what lies beyond the border is both alluring and punished"}
    hooks:
      - {phase: P3, must: "the border is a map line with its wardens; beyond it lies a named region"}
      - {phase: P4, must: "a faction guards the border and another profits from crossing it"}
      - {phase: P7, must: "a chapter asks the party to cross it"}
  - id: break_monsters_have_treaties
    label: "The monsters hold treaties"
    family: peoples
    statement: "Goblins, giants or another 'monster' people hold sworn treaties; breaking one is the crime, not meeting them."
    overrides: [{"default": "site_attitude_pool", "to": "negotiate on the treaty people's lairs; the horror mix's 'test or enslave' site is never one of them"}]
    weight_by: [{"when": {"any_of": ["life_giant_peace", "life_dragon_protection", "life_fey_bargain", "life_sea_folk_hunt", "contest_humans_giants", "contest_humans_dragon", "contest_humans_fey", "contest_surface_deep", "contest_land_sea_folk"]}, "x": 2}]
    text: {"name": "the monsters have treaties", "at_table": "every monster encounter is first a negotiation"}
    hooks:
      - {phase: P4, must: "the treaty people are a faction with a stance row and an operation"}
      - {phase: P6, must: "their lairs are sites with attitude `negotiate`; monster-ecology marks the species as a people"}
      - {phase: P8, must: "the primer lists the treaty terms a native knows"}
  - id: break_beasts_own_land
    label: "Some lands' lord is a beast-person"
    family: peoples
    statement: "A born lineage is both beast and person and holds land; a wood may have a lord who is a stag and walks as a man."
    text: {"name": "the lord of some lands is a beast-person", "at_table": "the forest has an owner, and a say"}
    hooks:
      - {phase: P3, must: "a beast-lord holds one part of the map; its travel table is negotiated passage"}
      - {phase: P4, must: "the beast lord is a faction with a stance row"}
  - id: break_lineage_homes_inverted
    label: "The lineages' homes are inverted"
    family: peoples
    statement: "Each lineage lives where the defaults would never put it."
    overrides: [{"default": "lineage_palette_weights", "to": "inverted"}]
    text: {"name": "the homelands of the lineages are the reverse of the usual", "at_table": "expectation breaks with every lineage", "name_note": "dwarves are seafarers, elves are steppe nomads"}
    hooks:
      - {phase: P1, must: "the people signature's lineage takes an inverted home"}
      - {phase: P3, must: "each lineage's settlements sit where the defaults would not put them"}
      - {phase: P5, must: "NPCs' lineages and trades break the defaults"}
  - id: break_gods_are_ancestors_known
    label: "The gods are the souls of mortal ancestors"
    family: gods
    statement: "Everyone knows the gods were once people of this land; godhood is a career the dead can have."
    conflicts_with: ["ruin_dead_god"]
    overrides: [{"default": "pantheon_type", "to": "pantheon_ancestor_gods"}]
    weight_by: [{"when": {"any_of": ["ruin_failed_apotheosis"]}, "x": 2}]
    text: {"name": "everyone knows that the gods are the souls of mortal ancestors", "at_table": "religion is a family matter"}
    hooks:
      - {phase: P2, must: "every god has a mortal biography in the history; rank is earned; one candidate is pending"}
      - {phase: P4, must: "a religious faction's endgame is raising its founder"}
  - id: break_moon_trades
    label: "The moon is inhabited and trades"
    family: gods
    statement: "Ships go to the moon when it is full; the moon folk sell what nothing here can make."
    weight_by: [{"when": {"dial": {"era": ["nautical"]}}, "x": 2}]
    text: {"name": "there are those who live on the moon, and they trade", "at_table": "goods and strangers that come from the sky"}
    hooks:
      - {phase: P2, must: "the moon is a touched plane with a way in, a cost and a time rate; the moon is one of the touched planes; the planes the foundation names are shared to fit the scale's count"}
      - {phase: P4, must: "a trade faction holds the right to the moon trade"}
  - id: break_divine_magic_holy_ground
    label: "Divine magic works only on holy ground"
    family: gods
    statement: "A god's power reaches only as far as its holy places."
    weight_by: [{"when": {"any_of": ["contest_one_shrine", "life_pilgrim_road"]}, "x": 2}]
    text: {"name": "the magic of the gods works only in holy places", "at_table": "a cleric PC loses power the farther they go from the holy place"}
    hooks:
      - {phase: P2, must: "each god's holy ground is named"}
      - {phase: P3, must: "the holy grounds are map nodes"}
      - {phase: P6, must: "a site's holy ground changes what a cleric can do there"}
  - id: break_god_name_forbidden
    label: "Naming one of the gods is forbidden"
    family: gods
    statement: "One god's name may not be spoken; its priests hide, and whoever knows the name is dangerous."
    prohibition: true                # the new-taboo scar draws from these
    weight_by: [{"when": {"any_of": ["ruin_imprisoned_god", "ruin_departed_god"]}, "x": 2}]
    text: {"name": "speaking the name of one of the gods is forbidden", "at_table": "that god's priests hide, whoever knows the name is dangerous"}
    hooks:
      - {phase: P2, must: "the unnamed god has a public epithet and a hidden name"}
      - {phase: P4, must: "the unnamed god's priests are a hidden faction"}
      - {phase: P5, must: "an NPC knows the name"}
  - id: break_gods_among_mortals
    label: "The gods live among mortals"
    family: gods
    statement: "The gods live among mortals; each keeps a house, and one may knock at its door."
    overrides: [{"default": "great_gods_floor", "to": 1}, {"default": "pantheon_type", "to": "the silent-gods and dead-gods types leave the pool"}]
    weight_by: [{"when": {"any_of": ["ruin_dead_god", "ruin_gods_quarrel", "ruin_departed_god", "ruin_imprisoned_god", "ruin_failed_apotheosis"]}, "x": 2}]
    text: {"name": "the gods live among mortals; each has a house, and one knocks at its door", "at_table": "the party can speak with a god face to face"}
    hooks:
      - {phase: P2, must: "each great god has a house and receives petitioners; a fallen god's house stands empty or shut"}
      - {phase: P3, must: "the god's house is a map node"}
      - {phase: P6, must: "a god's house is no dungeon and a god is no boss"}
      - {phase: P8, must: "the primer says how a god is addressed"}
  - id: break_night_is_safe
    label: "Night is safe and day is dangerous"
    family: danger
    statement: "Whatever hunts does so under the sun; people travel and work by night and shutter at dawn."
    requires: {"dial": {"era": ["medieval", "renaissance", "ancient", "nautical"]}}
    text: {"name": "night is safe, day is dangerous", "at_table": "travel and raids are done at night"}
    hooks:
      - {phase: P2, must: "the calendar's sensory tone is written for night; the moon marks the working hours"}
      - {phase: P3, must: "travel tables roll by day-hours; a daylight crossing is a hazard"}
      - {phase: P6, must: "the ecology's apex hunts by day"}
  - id: break_cities_dangerous
    label: "Cities are dangerous, the wild is safe"
    family: danger
    statement: "The wild shelters; the cities are where people die."
    overrides: [{"default": "travel_danger", "to": "the wild is safe"}]
    weight_by: [{"when": {"any_of": ["spine_edge_of_civilisation"]}, "x": 2}]
    text: {"name": "cities are dangerous, the wild is safe", "at_table": "the refuge is the forest, the trap is the city"}
    hooks:
      - {phase: P3, must: "each settlement carries a danger the wild lacks"}
      - {phase: P6, must: "an urban site is the deadliest of its tier"}
      - {phase: P8, must: "the primer says where it is safe to sleep"}
  - id: break_dungeons_inhabited
    label: "Every ruin is someone's home"
    family: danger
    statement: "No dungeon is empty; you knock before you enter."
    overrides: [{"default": "site_attitude_pool", "to": "att_kill and att_ignore leave the pool"}]
    text: {"name": "dungeons are not empty; every ruin is someone's home, and one knocks at its door", "at_table": "entering a dungeon is first a visit"}
    hooks:
      - {phase: P5, must: "a site detailed at birth has a named householder; every other site names its householder in one sentence of the site row"}
      - {phase: P6, must: "every site's inhabitants answer the door; no site's attitude is kill or ignore"}
  - id: break_slayer_inherits
    label: "Who slays a great monster inherits its burden"
    family: danger
    statement: "Killing a great beast hands you what it carried."
    weight_by: [{"when": {"any_of": ["contest_monster_bounty"]}, "x": 2}]
    text: {"name": "whoever kills a great monster takes over its burden", "at_table": "victory brings a price, killing is a decision"}
    hooks:
      - {phase: P4, must: "a faction watches who kills great monsters"}
      - {phase: P6, must: "a site's boss carries a burden its slayer inherits"}
      - {phase: P7, must: "a chapter turns on an inherited burden"}
  - id: break_underground_forbidden
    label: "Going below ground is forbidden"
    family: danger
    statement: "No one may go down into the earth; every descent is a crime and whoever comes back up is shunned."
    prohibition: true                # the new-taboo scar draws from these
    conflicts_with: ["claim:below_ground=lived_in"]
    weight_by: [{"when": {"any_of": ["land_underground"]}, "x": 2}, {"when": {"any_of": ["life_deep_lake", "life_deep_mouth", "life_mushroom_fields", "life_giant_insects", "life_gemstones"]}, "x": 2}]
    text: {"name": "going down below ground is forbidden", "at_table": "every dungeon is a crime, whoever returns from below is shunned"}
    hooks:
      - {phase: P3, must: "the law ladder punishes descent; the ways down are watched"}
      - {phase: P5, must: "an NPC came back from below and is shunned"}
      - {phase: P6, must: "every underground site is entered against the law"}
  - id: break_ruins_forbidden
    label: "Entering the ruins is forbidden"
    family: danger
    statement: "No one may enter the ruins; whoever touches the remnant is a criminal."
    prohibition: true                # the new-taboo scar draws from these
    conflicts_with: ["layout:remnant_on_heart"]
    weight_by: [{"when": {"any_of": ["contest_sealed_remnant"]}, "x": 3}, {"when": {"any_of": ["contest_forbidden_lands", "contest_treasure_race"]}, "x": 2}]
    text: {"name": "entering the ruins is forbidden; whoever touches the remnant is a criminal", "at_table": "every dungeon is entered against the law; loot is contraband"}
    hooks:
      - {phase: P3, must: "the ways to the ruins are watched"}
      - {phase: P4, must: "one faction guards the ruins and another sells what comes out"}
      - {phase: P6, must: "every ruin site is entered against the law; its loot needs a fence"}
      - {phase: P8, must: "the primer says what natives say of the ruins"}
  - id: break_night_forbidden
    label: "Going out at night is forbidden"
    family: danger
    statement: "No one may be abroad after dark; the night belongs to the watch."
    prohibition: true                # the new-taboo scar draws from these
    requires: {"dial": {"era": ["medieval", "renaissance", "ancient", "nautical"]}}
    text: {"name": "going out at night is forbidden; the night belongs to the watchmen", "at_table": "night scenes become crimes; patrols and permits come into play"}
    hooks:
      - {phase: P3, must: "settlements shut their gates at dusk"}
      - {phase: P4, must: "the night watch is a faction or a faction's asset"}
      - {phase: P5, must: "an NPC works by night against the law"}
  - id: break_the_enemy_won
    label: "The enemy won and everyone is fine"
    family: time
    statement: "The taught war was lost; the party's people live under the victors, and life is better than the songs admit."
    overrides: [{"default": "state_identity", "to": "the victors"}]
    weight_by: [{"when": {"any_of": ["contest_occupier_resistance"]}, "x": 3}, {"when": {"any_of": ["ruin_besieged_land"]}, "x": 2}]
    merges_with: {"contest_occupier_resistance": "the victors are role a; role third is the state faction under them"}
    text: {"name": "the old enemy won and everyone is fine", "at_table": "the world of the \"villains\" is an ordinary world"}
    hooks:
      - {phase: P2, must: "the founding event is the defeat; taught and true layers differ on how bad the victors are"}
      - {phase: P4, must: "the resistance faction's true belief is nostalgia; the state faction is the victors"}
  - id: break_dead_month
    label: "One month a year magic does not work"
    family: time
    statement: "In the empty month nothing casts; wards fail, the sick die, and everyone who depends on magic hides."
    overrides: [{"default": "weekly_volatility", "to": "doubled in that month"}]
    text: {"name": "one month a year magic does not work", "at_table": "spellcasters prepare for that month"}
    hooks:
      - {phase: P2, must: "the calendar names the month; the simulation's volatility doubles in it"}
      - {phase: P7, must: "one beat or the doom sits in the empty month"}
  - id: break_lawless_day
    label: "One day a year no law holds"
    family: time
    statement: "On one day of the year no law holds, and everyone plans around it."
    text: {"name": "one day a year no law is in force", "at_table": "that day is marked on the calendar; everyone plans around it"}
    hooks:
      - {phase: P2, must: "the calendar names the day, inside the campaign's span"}
      - {phase: P4, must: "every faction has a plan for the day"}
      - {phase: P7, must: "one beat falls on it"}
      - {phase: P8, must: "the primer says what natives do that day"}
  - id: break_iron_is_sacred
    label: "Iron is sacred and rare"
    family: knowledge
    statement: "Iron may be worked only by a priesthood; the world runs on bronze, bone and wood."
    overrides: [{"default": "era_equipment", "to": "iron goods ×5 and licensed"}]
    weight_by: [{"when": {"any_of": ["life_copper_mine", "life_iron_coal", "life_famous_steel"]}, "x": 2}, {"when": {"dial": {"era": ["ancient"]}}, "x": 2}]
    merges_with: {"life_iron_coal": "the lifeline's smiths are the iron priesthood", "life_famous_steel": "the lifeline's smiths are the iron priesthood"}
    text: {"name": "iron is sacred and rare", "at_table": "an iron weapon is a treasure"}
    hooks:
      - {phase: P3, must: "the price table marks iron goods ×5 and licensed"}
      - {phase: P4, must: "the iron priesthood is a faction; its fracture is a smuggler"}
      - {phase: P6, must: "a loot rule: iron weapons are a payoff, never filler"}
  - id: break_maps_are_illegal
    label: "Maps are forbidden"
    family: knowledge
    statement: "To draw the land is treason; guides are licensed and the routes are memorised songs."
    prohibition: true                # the new-taboo scar draws from these
    overrides: [{"default": "player_map", "to": "only the primer's named places"}]
    weight_by: [{"when": {"dial": {"content_mix": ["exploration"]}}, "x": 2}, {"when": {"any_of": ["contest_treasure_race"]}, "x": 2}]
    text: {"name": "maps are forbidden", "at_table": "knowledge of the road is the most valuable thing"}
    hooks:
      - {phase: P3, must: "the player map shows only the primer's named places; travel-times exist for the DM only"}
      - {phase: P4, must: "the guides are a guild faction; a map fragment is an item_ everyone wants"}
  - id: break_no_direct_lies
    label: "No one can lie outright"
    family: knowledge
    statement: "A direct lie is impossible; everyone evades instead."
    text: {"name": "no one can tell a direct lie; everyone talks around the point", "at_table": "every conversation is a riddle"}
    hooks:
      - {phase: P5, must: "NPCs speak in evasions, never plain lies"}
      - {phase: P8, must: "the primer teaches how a native evades"}
  - id: break_no_writing
    label: "Writing is unknown"
    family: knowledge
    statement: "Knowledge lives in memory; a word is a handshake."
    conflicts_with: ["claim:writing=printed"]
    overrides: [{"default": "loot_writing", "to": "knots, memory or signs"}]
    text: {"name": "writing is unknown; knowledge is carried in memory, a word is a handshake", "at_table": "witnesses and memorisers are valuable"}
    hooks:
      - {phase: P3, must: "no settlement has a library; memorisers keep the records"}
      - {phase: P5, must: "at least one NPC is a memoriser"}
      - {phase: P6, must: "no site's clue is a written page"}
  - id: break_no_common_tongue
    label: "There is no common tongue"
    family: knowledge
    statement: "No tongue is shared; every people speaks its own, and nothing is said across them without an interpreter."
    overrides: [{"default": "second_language", "to": "the contest's other side's"}]
    text: {"name": "there is no common tongue; every people speaks its own language", "at_table": "language and the interpreter gain weight in every social scene"}
    hooks:
      - {phase: P5, must: "every NPC carries the languages it speaks; at least one NPC is an interpreter"}
      - {phase: P8, must: "the primer says which tongue is spoken where"}
  - id: break_casting_forbidden
    label: "Casting is forbidden"
    family: knowledge
    statement: "Casting a spell is a crime; those who can cast hide it."
    prohibition: true                # the new-taboo scar draws from these
    requires: {"dial": {"magic": ["low", "medium"]}}
    conflicts_with: ["break_magic_is_nobility"]
    overrides: [{"default": "regulator_strictness", "to": "strictest"}, {"default": "regulator_identity", "to": "the hunters"}]
