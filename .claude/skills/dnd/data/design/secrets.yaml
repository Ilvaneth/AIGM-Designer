# secrets.yaml — the big secret: one DM-only truth about the world's nature (item 4.2).
#
# Three rolls, all SECRET (results go to dm-only/dice-log.json, labels only in design.json):
#   P1.secret_archetype  — from `archetype` (≥20 rows, the floor of risk 24.1 #18)
#   P1.secret_twist      — from `twist`, orthogonal to the archetype
#   P1.secret_trail      — from `trail`, the shape of the mandatory three-clue trail
# The premise writer combines archetype × twist into one sentence, pins it to the timeline and to
# one god, places the three clues (Act 1 surface / Act 2 investigation / Act 3 deep) in sites or
# NPCs, and the validator's secrecy module checks the clues exist in act order (items 10.9, 15.1).
schema_version: 1
table: secrets
consumed_by: [P1, P2, P4, P6, P7]
plan: "item 4.2, 10.9, 15.1, 17 #4, risk 24.1 #18"
roll: {secret: true, avoid_used: true, labels: [P1.secret_archetype, P1.secret_twist, P1.secret_trail]}
hooks_common:
  - {phase: P1, must: "the secret is one sentence in premise-secret.md with archetype and twist ids; the player pitch carries only the archetype class"}
  - {phase: P2, must: "the secret is pinned to a deep-past or dated event and to one god's secret field"}
  - {phase: P4, must: "the BBEG's relation to the secret is one of knows / is / serves / hunts / denies"}
  - {phase: P6, must: "three clues placed in sites or NPCs stamped to Acts 1, 2 and 3"}
  - {phase: P7, must: "the Act 3 clue is on the intended path; the three endings each say what the secret does afterwards"}

tables:

  archetype:
    notation: d24
    rows:
      - id: secret_gods_are_mortal_ancestors
        label: The gods were people
        statement: "The gods are dead mortals who were raised by {what the people did}; the rite still works."
        hides_in: pantheon
        villain_relation: [is, hunts, knows]
        clue_shape: {act1: "a shrine with a family name under the god's", act2: "a genealogy or a tomb with the god's face", act3: "the rite itself, or its instrument"}
        conflicts_with: [break_gods_are_ancestors_known]
        hooks:
          - {phase: P2, must: "one god's `rank` is wrong in the public layer; the true rank is secret"}
      - id: secret_gods_are_prisoners
        label: The gods are bound
        statement: "The gods do not answer because they are held by {what}; worship feeds the jailer."
        hides_in: pantheon
        villain_relation: [serves, knows, denies]
        clue_shape: {act1: "prayers answered only in one place", act2: "the jailer's servants", act3: "the prison, a site"}
        hooks:
          - {phase: P2, must: "the pantheon type is silent gods unless the twist says otherwise"}
      - id: secret_god_erased
        label: A god was erased
        statement: "There was one more god; {who} struck the name from every record and the erasure holds only while {condition}."
        hides_in: history
        villain_relation: [knows, is, hunts]
        clue_shape: {act1: "a gap in a frieze or a calendar", act2: "a heretic's list", act3: "the erased name, spoken"}
        hooks:
          - {phase: P2, must: "the calendar or the festival list has one visible gap"}
      - id: secret_magic_is_borrowed
        label: Magic is borrowed
        statement: "Every spell draws on {a finite or feeling source}; it is running out, or it is waking."
        hides_in: magic
        villain_relation: [knows, hunts, serves]
        clue_shape: {act1: "a dead zone where nothing casts", act2: "the ledger of who has drawn most", act3: "the source, a site"}
        hooks:
          - {phase: P2, must: "the magic system's source field is the public lie; the true source is secret"}
      - id: secret_magic_is_a_disease
        label: Magic spreads
        statement: "Magic is contagious; {the institution} exists to keep the carriers apart, and it is failing."
        hides_in: magic
        villain_relation: [is, denies, hunts]
        clue_shape: {act1: "a village where everyone casts a little", act2: "the quarantine records", act3: "the first carrier, alive"}
        hooks:
          - {phase: P4, must: "the regulator faction's true belief is quarantine, its cover is licensing"}
      - id: secret_history_inverted
        label: The founding was a defeat
        statement: "The taught victory of {event} was a loss; the heroes were {the invaders / the losers / bought}."
        hides_in: history
        villain_relation: [knows, denies, hunts]
        clue_shape: {act1: "a monument with a corrected date", act2: "the other side's account", act3: "the battlefield, a site"}
        hooks:
          - {phase: P2, must: "the founding event's as-taught and as-happened layers contradict on the winner"}
      - id: secret_history_looping
        label: It has happened before
        statement: "The present crisis is the {n}th; each time {who} hid the previous one and the hiding is why it returns."
        hides_in: history
        villain_relation: [knows, serves, is]
        clue_shape: {act1: "an older telegraph of the same danger", act2: "the previous generation's record", act3: "the mechanism of the loop"}
        hooks:
          - {phase: P2, must: "a deep-past event mirrors the doom on the calendar"}
      - id: secret_artifact_is_seal
        label: The prize is a seal
        statement: "The thing everyone wants, {artifact}, is a seal on {what}; using it opens it."
        hides_in: artifact
        villain_relation: [hunts, knows, serves]
        clue_shape: {act1: "the artifact's public legend has a missing verse", act2: "the sealer's own account", act3: "what is under the seal, glimpsed"}
        hooks:
          - {phase: P6, must: "the artifact is an item_ entity and a site payoff in Act 2 or 3"}
      - id: secret_artifact_is_alive
        label: The relic is a person
        statement: "{Artifact} is a mind, once a person, and it has been steering its keepers for {years}."
        hides_in: artifact
        villain_relation: [serves, is, knows]
        clue_shape: {act1: "keepers who died the same way", act2: "the relic's handwriting", act3: "its name"}
        hooks:
          - {phase: P5, must: "one NPC is the relic's current keeper and does not know"}
      - id: secret_villain_is_right
        label: The enemy's diagnosis is correct
        statement: "The villain is right about {what is wrong with the world}; the crime is the cure they chose."
        hides_in: villain
        villain_relation: [is]
        clue_shape: {act1: "the villain's warning, dismissed", act2: "the proof they gathered", act3: "the cure, seen working"}
        hooks:
          - {phase: P4, must: "the BBEG's true belief is the correct diagnosis; the world's institutions deny it"}
          - {phase: P7, must: "the win ending must answer the diagnosis, not only remove the villain"}
      - id: secret_world_is_ending_suppressed
        label: The end is scheduled and hidden
        statement: "The world ends by {what} within {span}; {institution} knows and keeps order by silence."
        hides_in: cosmology
        villain_relation: [knows, denies, serves]
        clue_shape: {act1: "a measurement that does not fit", act2: "the suppressed report", act3: "the count, seen"}
        hooks:
          - {phase: P7, must: "the doom day is the end or the last chance to stop it"}
      - id: secret_enemy_is_us
        label: The threat feeds on us
        statement: "The threat is made or fed by {the party's own people / polity / rite}; stopping it means stopping ourselves."
        hides_in: polity
        villain_relation: [knows, denies, hunts]
        clue_shape: {act1: "the threat is worst where we are strongest", act2: "the rite's true purpose", act3: "the feeding, witnessed"}
        hooks:
          - {phase: P4, must: "the state faction's doctrine on exposure is denial; its fracture is the one who knows"}
      - id: secret_afterlife_is_a_place
        label: The dead go somewhere reachable
        statement: "The dead go to {a physical place}; {who} has been there and come back, and sells the way."
        hides_in: cosmology
        villain_relation: [knows, serves, hunts]
        clue_shape: {act1: "a returned person with the wrong memories", act2: "the map", act3: "the door, a site"}
        hooks:
          - {phase: P2, must: "one touched plane or off-graph region is the place"}
      - id: secret_land_is_a_body
        label: The land is a sleeper
        statement: "{Region} is the body of {a sleeping creature or god}; the mines are wounds and it is waking."
        hides_in: geography
        villain_relation: [serves, knows, hunts]
        clue_shape: {act1: "the ground is warm in winter", act2: "the miners' songs", act3: "an eye"}
        hooks:
          - {phase: P3, must: "the region's danger tier is fixed by the sleeper, not by who lives there"}
      - id: secret_the_dead_rule
        label: The dead are the government
        statement: "The true rulers of {polity} are the dead: {an ancestor council / a lich behind the throne / the buried king}."
        hides_in: polity
        villain_relation: [is, serves, knows]
        clue_shape: {act1: "decrees dated at night", act2: "the regent's schedule", act3: "the council chamber, a site"}
        hooks:
          - {phase: P4, must: "the polity's ruler NPC has a `heir_of` pointing at a secret entity"}
      - id: secret_planes_are_one
        label: The other planes are here
        statement: "The 'other planes' are this world's {past / future / underside}; travel between them is travel in {time / depth}."
        hides_in: cosmology
        villain_relation: [knows, hunts, is]
        clue_shape: {act1: "a planar creature that knows a local name", act2: "a map that fits both", act3: "the crossing, a site"}
        hooks:
          - {phase: P2, must: "the planes table deviates: at least one baseline plane is renamed as a place in this world"}
      - id: secret_monsters_were_made
        label: The monsters were people
        statement: "{Creature} are the descendants of {a people} cursed or reshaped by {who}, on purpose."
        hides_in: creature
        villain_relation: [is, knows, denies]
        clue_shape: {act1: "a creature buried with rites", act2: "the decree", act3: "a living one who speaks"}
        hooks:
          - {phase: P1, must: "the signature creature is the made people"}
      - id: secret_cure_is_the_cause
        label: The protector manufactures the threat
        statement: "{Institution} that guards against {threat} makes it, because the guarding is the institution's power."
        hides_in: institution
        villain_relation: [is, serves, knows]
        clue_shape: {act1: "outbreaks follow the guard's route", act2: "the manufacture", act3: "the founder's confession"}
        hooks:
          - {phase: P4, must: "the institution is a faction with archetype religious, guild or state; its endgame is the threat never ending"}
      - id: secret_king_is_a_copy
        label: The ruler is a replacement
        statement: "{Ruler / god / hero} is a copy ({changeling / simulacrum / impostor}); the original is {dead / held / hiding}."
        hides_in: polity
        villain_relation: [is, knows, hunts]
        clue_shape: {act1: "a habit that changed on a known date", act2: "the original's letter", act3: "the original"}
        hooks:
          - {phase: P5, must: "the copy and the original are two NPC entities; the original is secret with an opaque id"}
      - id: secret_prophecy_is_engineered
        label: The destiny was written by someone alive
        statement: "The prophecy everyone believes was written by {who} {years} ago as a plan, and they are still following it."
        hides_in: history
        villain_relation: [is, knows, serves]
        clue_shape: {act1: "a prediction that came true too exactly", act2: "the draft", act3: "the author"}
        conflicts_with: [forbidden_prophecy]
        hooks:
          - {phase: P1, must: "this is the conscious form of the forbidden default `prophecy`; the DM pitch says so"}
      - id: secret_time_is_wrong
        label: There are missing years
        statement: "The calendar is short by {n} years; something happened in the gap and {who} cut it out."
        hides_in: calendar
        villain_relation: [knows, hunts, denies]
        clue_shape: {act1: "two dates that cannot both be right", act2: "the unaltered calendar", act3: "what happened in the gap"}
        hooks:
          - {phase: P2, must: "the calendar's epoch has a discoverable inconsistency"}
      - id: secret_names_have_power
        label: Names bind
        statement: "The naming language literally binds: to know a true name is to command; {institution} hoards names."
        hides_in: magic
        villain_relation: [knows, serves, hunts]
        clue_shape: {act1: "a person who cannot say their own name", act2: "the register", act3: "the villain's name"}
        hooks:
          - {phase: P1, must: "the signature institution keeps names; naming.json marks one language as binding"}
      - id: secret_the_hero_failed
        label: The victory was bought
        statement: "The hero of {event} failed; the victory was bought with a bargain from {who} that is still being paid."
        hides_in: history
        villain_relation: [is, knows, serves]
        clue_shape: {act1: "the hero's tomb is empty", act2: "the terms", act3: "the payment, made"}
        hooks:
          - {phase: P2, must: "the hero is an event_ or npc_ entity with a public and a secret layer"}
      - id: secret_two_worlds_overlaid
        label: Another world shares this space
        statement: "Another world occupies the same places; the boundary thins at {where} and {who} is thinning it on purpose."
        hides_in: cosmology
        villain_relation: [is, serves, knows]
        clue_shape: {act1: "a room that is larger inside at night", act2: "the other world's records", act3: "the thin place, a site"}
        hooks:
          - {phase: P3, must: "one landmark exists on both sides"}

  twist:
    notation: d12
    rows:
      - id: twist_recent_not_ancient
        label: Recent, not ancient
        rule: "the secret is younger than the oldest living NPC; a witness is alive"
        hooks:
          - {phase: P5, must: "one major or supporting NPC witnessed it and holds a Known Fact"}
      - id: twist_one_faction_knows
        label: One faction knows
        rule: "a whole faction knows and has built its doctrine on the secret"
        hooks:
          - {phase: P4, must: "that faction's true belief is the secret; its cover is the public story"}
      - id: twist_worse_than_rumour
        label: Worse than the rumour
        rule: "a public rumour already tells half; the truth is worse in kind, not degree"
        hooks:
          - {phase: P8, must: "the primer's rumours section carries the half"}
      - id: twist_keeper_is_sympathetic
        label: The keeper is kind
        rule: "whoever keeps the secret does so to protect someone the party will like"
        hooks:
          - {phase: P5, must: "the keeper is a supporting NPC with an attitude of ally"}
      - id: twist_revealing_is_dangerous
        label: Revealing it opens something
        rule: "the secret holds something worse shut; telling it has a cost the party will pay"
        hooks:
          - {phase: P7, must: "the loss ending is the secret revealed carelessly"}
      - id: twist_dying_with_last_witness
        label: Dying with the last witness
        rule: "the last person who can prove it is old, ill or hunted; the clock is theirs"
        hooks:
          - {phase: P4, must: "the witness is in the load_bearing set from day 0; a front step targets them"}
      - id: twist_pc_is_involved
        label: A PC is involved
        rule: "one socket binds a PC's past to the secret: their family, their teacher, their debt"
        hooks:
          - {phase: P9, must: "one thread's truth is a layer of the secret"}
      - id: twist_inverted_guilt
        label: The guilty are the victims
        rule: "the people everyone blames for the secret's harm are its victims"
        hooks:
          - {phase: P5, must: "the demographic table gives the blamed people a settlement or district"}
      - id: twist_public_half
        label: Half is public
        rule: "everyone knows the fact; nobody knows what it means"
        hooks:
          - {phase: P8, must: "the fact is in common-knowledge.json; the meaning is secret"}
      - id: twist_the_secret_has_an_owner
        label: The secret is owned
        rule: "someone profits from the secret every day and will pay to keep it"
        hooks:
          - {phase: P4, must: "a faction asset is the profit; the simulation's news shows it moving"}
      - id: twist_reversible
        label: It can be undone
        rule: "the secret's harm can be undone by a rite, a return or a name; the cost is named"
        hooks:
          - {phase: P7, must: "the win ending is the undoing; its cost is in the ending text"}
      - id: twist_irreversible
        label: It cannot be undone
        rule: "nothing restores what the secret took; the question is only who lives with it"
        hooks:
          - {phase: P7, must: "no ending restores the loss; the pyrrhic ending is the honest one"}

  trail:
    notation: d6
    rows:
      - id: trail_rumour_document_witness
        label: Rumour, document, witness
        acts: {act1: rumour_or_sign, act2: document, act3: living_witness}
        hooks:
          - {phase: P6, must: "Act 1 clue in a settlement or social site; Act 2 clue an item_ in a site; Act 3 clue a secret NPC"}
      - id: trail_place_relic_confession
        label: Place, relic, confession
        acts: {act1: a_place_that_is_wrong, act2: relic, act3: confession}
        hooks:
          - {phase: P6, must: "Act 1 clue is a telegraph of an over-tier site; Act 2 clue is that site's payoff; Act 3 clue is spoken by the BBEG or a lieutenant"}
      - id: trail_anomaly_pattern_source
        label: Anomaly, pattern, source
        acts: {act1: anomaly, act2: pattern_across_places, act3: source_site}
        hooks:
          - {phase: P3, must: "the Act 2 pattern spans at least two regions' travel tables"}
      - id: trail_person_person_person
        label: Three people
        acts: {act1: someone_who_lied, act2: someone_who_paid, act3: someone_who_did_it}
        hooks:
          - {phase: P5, must: "three NPCs at three tiers: minor, supporting, major or secret"}
      - id: trail_map_door_room
        label: Map, door, room
        acts: {act1: a_map_fragment, act2: a_door_that_needs_it, act3: the_room_behind}
        hooks:
          - {phase: P6, must: "the Act 3 room is the payoff room of a major or capstone site; its minimum depth is stamped"}
      - id: trail_song_grave_name
        label: Song, grave, name
        acts: {act1: a_song_or_saying, act2: a_grave_with_the_wrong_date, act3: the_name_spoken}
        hooks:
          - {phase: P8, must: "the song or saying is in the primer as folklore"}
