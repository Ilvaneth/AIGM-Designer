# secrets.yaml — the big secret: the break's true cause (plan item 25 step 2 #6; build item 9).
#
# Home: the break. The secret says why the break happened and who chose it; it opens no second story beside it.
# Four pieces, all SECRET (results go to dm-only/dice-log.json, labels only in design.json):
#   P1.secret_archetype  — from `archetype`: what is really going on; every row says how it is the break's cause
#   P1.secret_chooser    — from `chooser`: who chose the break, always a person (rolled from build item 10 on)
#   P1.secret_twist      — from `twist`, orthogonal to the archetype
#   P1.secret_trail      — from `trail`, the shape of the mandatory three-clue trail
# The owner is also the player: no row of this file is ever shown in a summary, a card, a commit message or a
# test's output. The chooser list is public knowledge of the design; its roll is not.
# The standard every row is written and audited against (docs/p1-build-9.md §1): the legend test, a living choice,
# tied to the break, playable, outside the attractor, a deep villain, a villain who can kill.
# A row that would make a secret of something the foundation or a trope break already shows in public names that
# public row in `conflicts_with`; the arbiter makes the lists symmetric and keeps the public record clean.
schema_version: 1
table: secrets
consumed_by: [P1, P2, P4, P5, P6, P7]
plan: "item 25 step 2 #6, item 4.2, 10.9, 15.1, 17 #4, risk 24.1 #18"
roll: {secret: true, avoid_used: true, labels: [P1.secret_archetype, P1.secret_twist, P1.secret_trail]}
hooks_common:
  - {phase: P1, must: "the secret is one sentence in premise-secret.md with archetype and twist ids; the player pitch carries only the archetype class"}
  - {phase: P2, must: "the secret is pinned to the break's dated event and to one god"}
  - {phase: P6, must: "three clues placed in sites or NPCs stamped to Acts 1, 2 and 3"}
  - {phase: P7, must: "the Act 3 clue is on the intended path; the three endings each say what the secret does afterwards"}

tables:

  archetype:
    notation: d26
    note: "`cause` is the row told as the break's true cause; it holds for any target and action the foundation rolls. `hides_in` is the spoiler-safe class the card shows."
    rows:
      - id: secret_gods_are_mortal_ancestors
        label: A god can be made
        statement: "The gods were mortals once, raised by {what the people gave up}; the way still works, and it was walked again."
        cause: "the break is what the raising cost: {the target} was the offering, and {the chooser} chose it so that someone could rise"
        hides_in: pantheon
        clue_shape: {act1: "a shrine where a god carries a family's name", act2: "someone who stood at the raising and will not say who rose", act3: "the way itself: its place and the thing it needs"}
        conflicts_with: [break_gods_are_ancestors_known, ruin_failed_apotheosis]
        hooks:
          - {phase: P2, must: "one god's `rank` is wrong in the public layer; the true rank is secret"}
      - id: secret_gods_are_prisoners
        label: The gods are held
        statement: "The gods do not answer because {what} holds them; worship feeds the holder."
        cause: "the break was done at the holder's bidding or against it: {the chooser} struck {the target} to tighten the hold or to crack it"
        hides_in: pantheon
        clue_shape: {act1: "prayers answered in one place only", act2: "the holder's servants, who thank no god", act3: "the place of holding, a site"}
        conflicts_with: [ruin_imprisoned_god, break_gods_among_mortals]
        hooks:
          - {phase: P2, must: "the public layer explains the gods' distance wrongly; the true reason is secret"}
      - id: secret_god_erased
        label: A god was taken out of memory
        statement: "There was one more god; {who} took the name out of every mouth and every stone, and the forgetting holds only while {condition}."
        cause: "the break ended the condition or renewed it: {the chooser} broke {the target} because it was what kept the forgetting whole, or what was wearing it thin"
        hides_in: history
        clue_shape: {act1: "a gap: an empty plinth, a feast day nobody keeps", act2: "an old heresy that names what stood in the gap", act3: "the name, spoken where it counts"}
        conflicts_with: [break_god_name_forbidden]
        weight_by: [{when: {any_of: [act_forgotten]}, x: 3}]
        hooks:
          - {phase: P2, must: "the calendar or the festival list has one visible gap"}
      - id: secret_magic_is_borrowed
        label: Magic is borrowed
        statement: "Every spell draws on {a source that is finite or that feels}; it is running low, or it has noticed."
        cause: "the break is the source answering one great draw: {the chooser} took more than was ever taken at once, through {the target}"
        hides_in: magic
        clue_shape: {act1: "a place where nothing casts any more", act2: "the pattern: where the most was drawn, the land is thinnest", act3: "the source, a site"}
        conflicts_with: [ruin_dried_source, rule_spells_feed_the_break, "claim:magic=faded"]
        hooks:
          - {phase: P2, must: "the magic system's source field is the public belief; the true source is secret"}
      - id: secret_magic_is_a_disease
        label: Magic spreads
        statement: "Magic passes from one person to the next like a fever; {an institution or a custom} exists to keep the carriers apart, and it is failing."
        cause: "the break let the carriers out or shut them in: {the chooser} broke {the target} because it stood between the carriers and everyone else"
        hides_in: magic
        clue_shape: {act1: "a village where everyone casts a little", act2: "the keepers' rules, which make sense only as a quarantine", act3: "the first carrier, alive"}
        hooks:
          - {phase: P4, must: "the regulator's true belief is quarantine; its public reason is another"}
      - id: secret_history_looping
        label: It was done before
        statement: "This is not the first break: the same was done {n generations} ago, {who} buried the telling, and someone found the way again."
        cause: "the break is a repetition: {the chooser} followed what the earlier breakers left behind"
        hides_in: history
        clue_shape: {act1: "an older mark of the same harm, in a place nobody connects with it", act2: "what the earlier breakers left: a tool, a working, a warning", act3: "the one who found the way, and why they used it"}
        hooks:
          - {phase: P2, must: "an earlier dated event mirrors the break"}
      - id: secret_artifact_is_seal
        label: The prize is a seal
        statement: "{The thing everyone wants} is a stopper on {what}; to use it is to draw it out."
        cause: "the break is what came through when it was used: {the chooser} used the prize once, at {the target}"
        hides_in: artifact
        clue_shape: {act1: "the prize's legend has a verse nobody sings", act2: "the sealer's own warning, kept by those who do not understand it", act3: "what is under the seal, glimpsed"}
        conflicts_with: [contest_sealed_remnant, ruin_imprisoned_god]
        weight_by: [{when: {any_of: [act_opened]}, x: 3}]
        hooks:
          - {phase: P6, must: "the prize is an item_ entity and a site payoff in Act 2 or 3"}
      - id: secret_artifact_is_alive
        label: The relic is a person
        statement: "{A relic} is a mind that was once a person, and it has steered its keepers for {years}."
        cause: "the break is the relic's wish carried out by a keeper's hand: {the chooser} was the one who listened"
        hides_in: artifact
        clue_shape: {act1: "keepers who each made the same strange choice", act2: "a keeper who speaks in a voice that is not theirs", act3: "the relic's own name, and what it wanted"}
        hooks:
          - {phase: P5, must: "one NPC is the relic's present keeper and does not know what it is"}
      - id: secret_break_was_the_cure
        label: The break was a cure
        statement: "Something worse was coming for {the land}: {what}. The break stopped it or slowed it, and whoever chose it saw what nobody else would look at."
        cause: "the break is the remedy: {the chooser} destroyed {the target} because it was the door the worse thing would have come through"
        hides_in: history
        clue_shape: {act1: "a warning given before the break and laughed at", act2: "the proof the chooser gathered", act3: "the worse thing itself, seen close"}
        hooks:
          - {phase: P7, must: "the win ending must answer the worse thing, not only undo the break"}
      - id: secret_world_is_ending_suppressed
        label: The end has a day and is kept back
        statement: "{The land} ends by {what} within {span}; {who} has long known the day and keeps the peace by saying nothing."
        cause: "the break is the ending's first step, and it fell where it did by choice: {the chooser} turned it onto {the target} and away from something they would not lose"
        hides_in: cosmology
        clue_shape: {act1: "a measure that does not fit: a level, a count of days, a season", act2: "those who know, preparing for themselves", act3: "the ending's measure, seen whole"}
        hooks:
          - {phase: P7, must: "the doom day is the end or the last chance to stop it"}
      - id: secret_enemy_is_us
        label: We feed it
        statement: "The harm is made or fed by {our own people, rule or rite}; to stop it is to stop ourselves."
        cause: "the break is what our own way did to {the target}: {the chooser} knew and let it go on, because the way is what we are"
        hides_in: polity
        clue_shape: {act1: "the harm is worst where we are strongest", act2: "the rite's or the custom's true purpose", act3: "the feeding, witnessed"}
        hooks:
          - {phase: P4, must: "the leading faction's stance on being found out is denial; its fracture is the one who knows"}
      - id: secret_land_is_a_body
        label: The land is alive
        statement: "{The region} is a living thing that feels; {who} has been {hurting it, feeding it, bargaining with it} on purpose."
        cause: "the break is the land's answer to what was done to it: {the chooser} provoked it at {the target}"
        hides_in: geography
        clue_shape: {act1: "ground that is warm in winter, or that flinches", act2: "the workers' songs, which are instructions", act3: "the place where it can be spoken to"}
        conflicts_with: [spine_titan_back, rule_land_guards_lifeline, act_awakened, act_true_face]
        hooks:
          - {phase: P3, must: "the region's danger tier is fixed by the living land, not by who lives there"}
      - id: secret_planes_are_one
        label: The other planes are here
        statement: "The other planes are this world's {past, future or underside}; to cross is to travel in {time or depth}."
        cause: "the break is a piece of that other side brought across or sent away: {the chooser} moved {the target} between then and now"
        hides_in: cosmology
        clue_shape: {act1: "a creature from beyond that knows a local name", act2: "two places that are one place, seen from both", act3: "the crossing, a site"}
        conflicts_with: [spine_two_worlds, ruin_broken_time, ruin_planar_rift]
        hooks:
          - {phase: P2, must: "the planes table deviates: at least one baseline plane is renamed as a place in this world"}
      - id: secret_monsters_were_made
        label: The monsters were people
        statement: "{A kind of creature} descends from {a people} reshaped by {who}, on purpose."
        cause: "the break is the same reshaping used again, or the reshaped striking back: {the chooser} turned the old working on {the target}"
        hides_in: creature
        clue_shape: {act1: "a creature that keeps a custom only people keep", act2: "the working's tools, in hands that should not hold them", act3: "a living one who speaks, and remembers"}
        conflicts_with: [ruin_made_peoples, ruin_failed_experiment]
        hooks:
          - {phase: P6, must: "one site's occupants are the made; their attitude to intruders is a people's, not a beast's"}
      - id: secret_cure_is_the_cause
        label: The protector makes the threat
        statement: "{An institution} that guards against {a threat} makes it, because the guarding is its power."
        cause: "the break is the threat made large for once: {the chooser} let it loose on {the target} so that the guards would be needed for a lifetime"
        hides_in: institution
        clue_shape: {act1: "the harm follows the guards' own road", act2: "the making, seen", act3: "the one who ordered it, and their reason in their own mouth"}
        hooks:
          - {phase: P4, must: "the institution is a faction with archetype religious, guild or state; its endgame is the threat never ending"}
      - id: secret_king_is_a_copy
        label: Someone is a replacement
        statement: "{A ruler, a hero, a high priest} is not who they are taken for ({a changeling, a made likeness, an impostor}); the true one is {held, hiding or gone}."
        cause: "the break removed the one thing that could tell the two apart: {the chooser} broke {the target} to keep the replacement safe, or to force it into the open"
        hides_in: polity
        clue_shape: {act1: "a habit that changed on a known day", act2: "a token only the true one could have sent", act3: "the true one, or what is left to prove them"}
        conflicts_with: [break_no_direct_lies]
        hooks:
          - {phase: P5, must: "the copy and the original are two NPC entities; the original is secret with an opaque id"}
      - id: secret_prophecy_is_engineered
        label: The destiny was composed by someone alive
        statement: "The foretelling everyone believes was composed by {who} {years} ago as a plan, and they are still following it."
        cause: "the break is a line of the foretelling made to come true: {the chooser} did to {the target} what the words said would happen"
        hides_in: history
        clue_shape: {act1: "a prediction that came true too exactly", act2: "an earlier telling with a different ending", act3: "the author"}
        conflicts_with: [forbidden_prophecy]
        hooks:
          - {phase: P1, must: "this is the conscious form of the forbidden default `prophecy`; the DM pitch says so"}
      - id: secret_names_have_power
        label: The break was spoken
        statement: "A true name commands what it names; {who} keeps such names, and one was said aloud."
        cause: "the break is a command: {the chooser} spoke the true name of {the target} and told it what to do"
        hides_in: magic
        clue_shape: {act1: "someone who cannot be made to say their own name", act2: "the keepers of names, and the one name missing from their keeping", act3: "the name of {the target}, and who else knows it"}
        conflicts_with: [rule_true_names, rule_names_shape_places]
        hooks:
          - {phase: P1, must: "naming.json marks one language as the binding one"}
      - id: secret_the_hero_failed
        label: The victory was bought
        statement: "The hero of {an old victory} did not win it; it was bought from {who} with a promise, and the promise has now been kept."
        cause: "the break is the promised thing handed over: {the chooser} decided that {the target} would be what was given"
        hides_in: history
        clue_shape: {act1: "the hero's honours do not match what witnesses saw", act2: "the terms, kept by the other side", act3: "the handing over, and who stood by"}
        conflicts_with: [break_the_enemy_won]
        hooks:
          - {phase: P2, must: "the hero is an event_ or npc_ entity with a public and a secret layer"}
      - id: secret_two_worlds_overlaid
        label: Another world shares this ground
        statement: "Another world lies over this one, place for place; the wall between is thin at {where}, and {who} is wearing it thinner on purpose."
        cause: "the break is where the wall gave: {the chooser} wore it through at {the target} to let something across, or someone out"
        hides_in: cosmology
        clue_shape: {act1: "a room larger inside by night than by day", act2: "a thing from the other side that has a twin here", act3: "the worn place, a site"}
        conflicts_with: [spine_two_worlds, ruin_planar_rift, ruin_planar_invasion, act_merged_with_plane, scar_plane_thinned]
        hooks:
          - {phase: P3, must: "one landmark exists on both sides"}
      - id: secret_wrong_target
        label: It was meant for something else
        statement: "The blow was aimed at {someone or something else}; {the target} was struck by error or as a blind, and the true aim still stands."
        cause: "the break is a miss or a mask: {the chooser} wanted {the true aim}, and will try again"
        hides_in: history
        clue_shape: {act1: "the harm makes no sense for what was struck", act2: "the true aim, which was warned and moved in time", act3: "the second attempt, being made ready"}
        hooks:
          - {phase: P7, must: "the escalation's last step is the second attempt on the true aim"}
      - id: secret_cover_for_a_taking
        label: Something was taken under it
        statement: "The break was a cover: while everyone looked at the harm, {something} was carried out of {the target}, and the taker still has it."
        cause: "the break is the noise around a taking: {the chooser} broke {the target} so that nobody would ask what was missing from it"
        hides_in: artifact
        clue_shape: {act1: "one thing absent that the harm could not have destroyed", act2: "those who carried it, and where they went", act3: "the taken thing, in use"}
        weight_by: [{when: {any_of: [act_burned, act_sank, act_vanished]}, x: 2}]
        hooks:
          - {phase: P6, must: "the taken thing is an item_ entity and a site payoff on the escalation's upper steps"}
      - id: secret_rehearsal
        label: It was a rehearsal
        statement: "The break was done small and here to learn whether it can be done; the true one is meant for {where or what}."
        cause: "the break is a first attempt: {the chooser} tried the working on {the target} and is now mending its faults"
        hides_in: history
        clue_shape: {act1: "watchers who came before the break and measured after", act2: "the faults of the first attempt, and who is mending them", act3: "the true one, made ready"}
        hooks:
          - {phase: P7, must: "the doom is the true attempt; the loss ending is its success"}
      - id: secret_lesser_harm
        label: It was the lesser thing
        statement: "{Who} was ordered, bound or driven to do something far worse; the break is what they did instead."
        cause: "the break is a refusal: {the chooser} broke {the target} because it was the least of what was demanded, and the one who demanded is not satisfied"
        hides_in: history
        clue_shape: {act1: "the harm stopped short of what it could have been", act2: "the demand, and who made it", act3: "what was refused, still wanted"}
        hooks:
          - {phase: P5, must: "the one who demanded is an NPC or a power with a dossier of its own"}
      - id: secret_done_from_inside
        label: It was done from inside
        statement: "What is told as a blow from outside was done by {those who kept the target}; they walked away, opened it or turned it themselves, and tell another story."
        cause: "the break is a leaving: {the chooser} was one of {the target}'s own, and chose to end it rather than {what staying meant}"
        hides_in: polity
        clue_shape: {act1: "no sign of force where force is claimed", act2: "one of the keepers, living under another name", act3: "what staying would have meant, shown"}
        conflicts_with: [break_no_direct_lies]
        weight_by: [{when: {any_of: [act_migrated, act_closed]}, x: 2}]
        hooks:
          - {phase: P5, must: "one of the keepers is a supporting NPC with a second identity in dm-only"}
      - id: secret_set_someone_free
        label: It set someone free
        statement: "{Someone} was bound to {the target} by {an oath, a service, a shape, a wedding}, and only its ending could loose them."
        cause: "the break is a release: {the chooser} broke {the target} to free {the bound one}, and counted the cost acceptable"
        hides_in: history
        clue_shape: {act1: "one person whose life got better the day of the break", act2: "the binding, and what it took from them", act3: "the freed one, and what they will do to stay free"}
        hooks:
          - {phase: P5, must: "the freed one is a supporting or major NPC the party has reason to like"}

  chooser:
    roll: {avoid_used: false}
    notation: d6
    note: "who chose the break: always a person, never a thing, a god acting alone or an accident. The list is public, the roll is secret. The chooser is the villain exactly when the villain's tie to the break is `bond_caused_it` (antagonists.yaml#break_tie); item 10 rolls it."
    rows:
      - id: chooser_the_villain
        label: The villain
        rule: "the villain chose the break and stands by it"
        conflicts_with: [bond_exploits_it, bond_wants_to_complete, bond_wants_to_reverse, bond_failed_to_stop, bond_product_of_it, twist_chooser_undoing]
        hooks:
          - {phase: P4, must: "the BBEG's dossier holds the choice as a dated act with a reason"}
      - id: chooser_contest_role
        label: A contest role
        rule: "the leader or a member of one of the contest's roles chose it, for the role's sake or against it"
        hooks:
          - {phase: P4, must: "the role's faction carries the choice as its secret or its fracture"}
      - id: chooser_the_institution
        label: The signature institution
        rule: "a person inside the signature institution chose it, in its name or behind its back"
        hooks:
          - {phase: P5, must: "the person is an NPC of the institution with the choice in dm-only"}
      - id: chooser_the_people
        label: The signature people
        rule: "one of the signature people chose it, for the people or against them"
        hooks:
          - {phase: P5, must: "the person is an NPC of the people with the choice in dm-only"}
      - id: chooser_ordinary_gone
        label: An ordinary person, gone or forgotten
        rule: "someone of no rank chose it and is no longer alive, or no longer remembered; what they chose outlived them"
        conflicts_with: [twist_chooser_undoing]
        hooks:
          - {phase: P5, must: "someone living knew them; the Act 2 clue passes through that NPC"}
      - id: chooser_bargainer
        label: A mortal who bargained with a power
        rule: "a mortal struck a bargain with a power (a god, a plane's lord, a dragon, the living land); the power gave the means, the mortal made the choice"
        hooks:
          - {phase: P2, must: "the power is a god or a plane's keeper with the bargain in its secret field"}

  twist:
    notation: d15
    rows:
      - id: twist_two_halves
        label: Two hold a half each
        rule: "two people each hold half of the truth and are enemies; neither half alone means anything"
        hooks:
          - {phase: P5, must: "the two are NPCs in different factions with an `enemy` relationship line"}
      - id: twist_one_faction_knows
        label: One faction knows
        rule: "a whole faction knows and has built its doctrine on the secret"
        hooks:
          - {phase: P4, must: "that faction's true belief is the secret; its cover is the public story"}
      - id: twist_worse_than_rumour
        label: Worse than the rumour
        rule: "a public rumour already tells half; the truth is worse in kind, not degree"
        hooks:
          - {phase: P8, must: "the primer's rumours section carries the half"}
      - id: twist_keeper_is_sympathetic
        label: The keeper is kind
        rule: "whoever keeps the secret does so to protect someone the party will like"
        hooks:
          - {phase: P5, must: "the keeper is a supporting NPC with an attitude of ally"}
      - id: twist_revealing_is_dangerous
        label: Revealing it opens something
        rule: "the secret holds something worse shut; telling it has a cost the party will bear"
        hooks:
          - {phase: P7, must: "the loss ending is the secret revealed carelessly"}
      - id: twist_dying_with_last_witness
        label: Going with the last witness
        rule: "the last person who can prove it is old, ill or hunted; the clock is theirs"
        hooks:
          - {phase: P4, must: "the witness is in the load_bearing set from day 0; a front step targets them"}
      - id: twist_pc_is_involved
        label: A PC is involved
        rule: "one socket binds a PC's past to the secret: their family, their teacher, their oath"
        hooks:
          - {phase: P9, must: "one thread's truth is a layer of the secret"}
      - id: twist_inverted_guilt
        label: The blamed are the harmed
        rule: "the people everyone blames for the break are the ones it harmed most"
        hooks:
          - {phase: P5, must: "the demographic table gives the blamed people a settlement or district"}
      - id: twist_public_half
        label: Half is public
        rule: "everyone knows the fact; nobody knows what it means"
        hooks:
          - {phase: P8, must: "the fact is in common-knowledge.json; the meaning is secret"}
      - id: twist_the_secret_has_an_owner
        label: The secret is owned
        rule: "someone gains from the secret every day and will kill to keep it"
        hooks:
          - {phase: P4, must: "a faction asset is the gain; the simulation's news shows it moving"}
      - id: twist_reversible
        label: It can be undone
        rule: "the break can be undone by a rite, a return or a name; the cost is named"
        hooks:
          - {phase: P7, must: "the win ending is the undoing; its cost is in the ending text"}
      - id: twist_irreversible
        label: It cannot be undone
        rule: "nothing restores what the break took; the question is only who lives with it"
        conflicts_with: [bond_wants_to_reverse]
        hooks:
          - {phase: P7, must: "no ending restores the loss; the pyrrhic ending is the honest one"}
      - id: twist_chooser_did_not_know
        label: The chooser did not know
        rule: "the chooser meant something smaller or other; the break is larger than the choice"
        conflicts_with: [secret_break_was_the_cure, secret_lesser_harm]
        hooks:
          - {phase: P5, must: "what the chooser meant to do is a Known Fact of one NPC"}
      - id: twist_chooser_undoing
        label: The chooser is trying to undo it
        rule: "the chooser regrets it and is working to undo it, by means that may be worse"
        hooks:
          - {phase: P7, must: "one beat is the chooser's attempt; the party can help it, stop it or take it over"}
      - id: twist_known_not_believed
        label: The people know and nobody believes
        rule: "the truth is told openly as a tale, a children's rhyme or one stubborn voice, and nobody takes it for true"
        hooks:
          - {phase: P8, must: "the primer carries the tale as folklore, unmarked"}

  trail:
    notation: d10
    note: "the three stages keep the keys act1, act2, act3 (how they map to a one-act campaign is build item 12's); a trail that needs writing conflicts with the land without writing"
    rows:
      - id: trail_rumour_document_witness
        label: Rumour, document, witness
        acts: {act1: rumour_or_sign, act2: document, act3: living_witness}
        conflicts_with: [break_no_writing]
        hooks:
          - {phase: P6, must: "Act 1 clue in a settlement or social site; Act 2 clue an item_ in a site; Act 3 clue a secret NPC"}
      - id: trail_place_relic_confession
        label: Place, relic, confession
        acts: {act1: a_place_that_is_wrong, act2: relic, act3: confession}
        hooks:
          - {phase: P6, must: "Act 1 clue is a telegraph of an over-tier site; Act 2 clue is that site's payoff; Act 3 clue is spoken by the BBEG or a lieutenant"}
      - id: trail_anomaly_pattern_source
        label: Anomaly, pattern, source
        acts: {act1: anomaly, act2: pattern_across_places, act3: source_site}
        hooks:
          - {phase: P3, must: "the Act 2 pattern spans at least two regions' travel tables"}
      - id: trail_person_person_person
        label: Three people
        acts: {act1: someone_who_lied, act2: someone_who_gained, act3: someone_who_did_it}
        hooks:
          - {phase: P5, must: "three NPCs at three tiers: minor, supporting, major or secret"}
      - id: trail_map_door_room
        label: Map, door, room
        acts: {act1: a_map_fragment, act2: a_door_that_needs_it, act3: the_room_behind}
        hooks:
          - {phase: P6, must: "the Act 3 room is the payoff room of a major or capstone site; its minimum depth is stamped"}
      - id: trail_trace_wound_survivor
        label: Trace, wound, survivor
        acts: {act1: a_trace_left_behind, act2: a_wound_that_matches_it, act3: a_survivor_who_saw}
        hooks:
          - {phase: P5, must: "the survivor is a supporting or secret NPC; the wound is on a person, a beast or a place the party can examine"}
      - id: trail_object_maker_owner
        label: Object, maker, owner
        acts: {act1: an_object_out_of_place, act2: the_one_who_made_it, act3: the_one_it_was_made_for}
        hooks:
          - {phase: P6, must: "the object is an item_ entity found in Act 1; the maker's workshop is a site or a settlement anchor"}
      - id: trail_tracks_lair_keeper
        label: Tracks, lair, keeper
        acts: {act1: tracks_that_lead_away, act2: the_lair_they_lead_to, act3: what_was_kept_there}
        hooks:
          - {phase: P3, must: "the tracks are a travel result in one region; the lair is a site on the map"}
      - id: trail_letter_traitor
        label: Captured letter, receiver, traitor
        acts: {act1: a_captured_letter, act2: the_one_it_was_meant_for, act3: the_traitor_who_wrote_it}
        conflicts_with: [break_no_writing]
        hooks:
          - {phase: P5, must: "the traitor is inside a faction the party trusts by Act 3"}
      - id: trail_custom_exile_origin
        label: Custom, exile, origin
        acts: {act1: a_custom_nobody_explains, act2: an_exile_who_broke_it, act3: the_place_it_began}
        hooks:
          - {phase: P8, must: "the custom is in the primer as something natives do without knowing why"}
