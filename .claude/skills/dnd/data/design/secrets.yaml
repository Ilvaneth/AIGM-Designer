      - {id: twist_reversible, label: It can be undone, rule: 'the move can be undone by a rite, a return or a name; the cost is named', hooks: [{phase: P7, must: the win ending is the undoing; its cost is in the ending text}]}
      - {id: twist_irreversible, label: It cannot be undone, rule: nothing restores what the move took; the question is only who lives with it, hooks: [{phase: P7, must: no ending restores the loss; the pyrrhic ending is the honest one}]}
      - {id: twist_chooser_did_not_know, label: The move grew larger than the villain meant, rule: 'the villain meant something smaller; the move is larger than the plan, and the villain rides it', conflicts_with: [secret_break_was_the_cure, secret_lesser_harm], hooks: [{phase: P5, must: what the villain meant to do is a Known Fact of one NPC}]}
      - {id: twist_chooser_undoing, label: The villain works to undo it, rule: 'the move backfired; the villain works to undo what it let loose, by means that may be worse', hooks: [{phase: P7, must: 'one beat is the villain''s attempt to undo what backfired; the party can help it, stop it or take it over'}], requires: {any_of: [move_backfired]}}
