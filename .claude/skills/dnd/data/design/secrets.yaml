# secrets.yaml — the secret, the threat's hidden half (plan item 25 step 2 #6; build items 9 and 18d).
#
# Since build item 18d the secret is no object of its own: it is what the threat hides (docs/p1-threat-first.md). The
# four facts (who, what it wants and why, where, how it is stopped) and the three stages with three clues each come
# from the threat's chain (design_identity.roll_secret). This file gives, all SECRET (results to dm-only/dice-log.json):
#   P1.secret_twist      — from `twist`: the threat's hidden truth, optional (always with mystery in the content mix,
#                          else on a d2, `P1.secret_twist.gate`)
#   P1.secret_keeping    — from `keeping`: how the truth is held
#   P1.secret_trail      — from `trail`: the clue shapes of the three stages; the third carries how it is stopped
#   P1.secret_power      — from `greater_power`: the kind of the power behind the villain, when the twist or the goal names one (18e-2)
# The archetypes and the chooser are retired (readable by id for legacy births).
# The owner is also the player: no row of this file is ever shown in a summary, a card, a commit message or a
# test's output. The chooser list is public knowledge of the design; its roll is not.
# The standard every row is written and audited against (docs/p1-build-9.md §1): the legend test, a living choice,
# tied to the break, playable, outside the attractor, a deep villain, a villain who can kill.
# A row that would make a secret of something the foundation or a trope break already shows in public names that
# public row in `conflicts_with`; the arbiter makes the lists symmetric and keeps the public record clean.
schema_version: 1
table: secrets
consumed_by: [P1, P2, P4, P5, P6, P7]
plan: "item 25 step 2 #6, item 4.2, 10.9, 15.1, 17 #4, risk 24.1 #18"
layer: story                    # build item 18a: the secret is the threat's hidden half
roll: {secret: true, avoid_used: true, labels: [P1.secret_twist, P1.secret_twist.gate, P1.secret_keeping, P1.secret_trail]}
hooks_common:
  - {phase: P1, must: 'the secret is the threat''s hidden half: premise-secret.md tells the four facts, the three stages with their conclusions and the chain-placed clue of each, the twist if one was rolled and the keeping; the player pitch carries none of it'}
  - {phase: P2, must: the move is the secret's dated event in the history}
  - {phase: P6, must: 'every stage''s conclusion has three clues in different places and forms: the chain places one, P5 a person, P6 a site'}
  - {phase: P7, must: the third stage's clues lie on the intended path and reveal how the villain is stopped; the three endings each say what the threat does afterwards}
tables:
  archetype:
    roll: {secret: true, avoid_used: true}
    note: "build item 18d: the archetypes leave the roll; nineteen live on as the twist, twelve (world lore with no face) are retired"
    rows: []
    retired:                          # build item 18d: readable by id for legacy births, never rolled
      - {id: secret_gods_are_mortal_ancestors, label: A god can be made, statement: 'The gods were mortals once, raised by {what the people gave up}; the way still works, and it was walked again.', cause: 'the break is what the raising cost: {the target} was the offering, and {the chooser} chose it so that someone could rise', hides_in: pantheon, clue_shape: {act1: a shrine where a god carries a family's name, act2: someone who stood at the raising and will not say who rose, act3: 'the way itself: its place and the thing it needs'}, conflicts_with: [break_gods_are_ancestors_known, ruin_failed_apotheosis], hooks: [{phase: P2, must: one god's `rank` is wrong in the public layer; the true rank is secret}]}
      - {id: secret_gods_are_prisoners, label: The gods are held, statement: 'The gods do not answer because {what} holds them; worship feeds the holder.', cause: 'the break was done at the holder''s bidding or against it: {the chooser} struck {the target} to tighten the hold or to crack it', hides_in: pantheon, clue_shape: {act1: prayers answered in one place only, act2: 'the holder''s servants, who thank no god', act3: 'the place of holding, a site'}, conflicts_with: [ruin_imprisoned_god, break_gods_among_mortals], hooks: [{phase: P2, must: the public layer explains the gods' distance wrongly; the true reason is secret}]}
      - {id: secret_god_erased, label: A god was taken out of memory, statement: 'There was one more god; {who} took the name out of every mouth and every stone, and the forgetting holds only while {condition}.', cause: 'the break ended the condition or renewed it: {the chooser} broke {the target} because it was what kept the forgetting whole, or what was wearing it thin', hides_in: history, clue_shape: {act1: 'a gap: an empty plinth, a feast day nobody keeps', act2: an old heresy that names what stood in the gap, act3: 'the name, spoken where it counts'}, conflicts_with: [break_god_name_forbidden], hooks: [{phase: P2, must: the calendar or the festival list has one visible gap}]}
      - {id: secret_magic_is_borrowed, label: Magic is borrowed, statement: 'Every spell draws on {a source that is finite or that feels}; it is running low, or it has noticed.', cause: 'the break is the source answering one great draw: {the chooser} took more than was ever taken at once, through {the target}', hides_in: magic, clue_shape: {act1: a place where nothing casts any more, act2: 'the pattern: where the most was drawn, the land is thinnest', act3: 'the source, a site'}, conflicts_with: [ruin_dried_source, rule_spells_feed_the_break, 'claim:magic=faded'], hooks: [{phase: P2, must: the magic system's source field is the public belief; the true source is secret}]}
      - {id: secret_magic_is_a_disease, label: Magic spreads, statement: 'Magic passes from one person to the next like a fever; {an institution or a custom} exists to keep the carriers apart, and it is failing.', cause: 'the break let the carriers out or shut them in: {the chooser} broke {the target} because it stood between the carriers and everyone else', hides_in: magic, clue_shape: {act1: a village where everyone casts a little, act2: 'the keepers'' rules, which make sense only as a quarantine', act3: 'the first carrier, alive'}, hooks: [{phase: P4, must: the regulator's true belief is quarantine; its public reason is another}]}
      - {id: secret_history_looping, label: It was done before, statement: 'This is not the first break: the same was done {n generations} ago, {who} buried the telling, and someone found the way again.', cause: 'the break is a repetition: {the chooser} followed what the earlier breakers left behind', hides_in: history, clue_shape: {act1: 'an older mark of the same harm, in a place nobody connects with it', act2: 'what the earlier breakers left: a tool, a working, a warning', act3: 'the one who found the way, and why they used it'}, hooks: [{phase: P2, must: an earlier dated event mirrors the break}]}
      - {id: secret_artifact_is_seal, label: The prize is a seal, statement: '{The thing everyone wants} is a stopper on {what}; to use it is to draw it out.', cause: 'the break is what came through when it was used: {the chooser} used the prize once, at {the target}', hides_in: artifact, clue_shape: {act1: the prize's legend has a verse nobody sings, act2: 'the sealer''s own warning, kept by those who do not understand it', act3: 'what is under the seal, glimpsed'}, conflicts_with: [contest_sealed_remnant, ruin_imprisoned_god], weight_by: [{when: {any_of: [act_opened]}, x: 3}], hooks: [{phase: P6, must: the prize is an item_ entity and a site payoff in Act 2 or 3}]}
      - {id: secret_artifact_is_alive, label: The relic is a person, statement: '{A relic} is a mind that was once a person, and it has steered its keepers for {years}.', cause: 'the break is the relic''s wish carried out by a keeper''s hand: {the chooser} was the one who listened', hides_in: artifact, clue_shape: {act1: keepers who each made the same strange choice, act2: a keeper who speaks in a voice that is not theirs, act3: 'the relic''s own name, and what it wanted'}, hooks: [{phase: P5, must: one NPC is the relic's present keeper and does not know what it is}]}
      - {id: secret_break_was_the_cure, label: The break was a cure, statement: 'Something worse was coming for {the land}: {what}. The break stopped it or slowed it, and whoever chose it saw what nobody else would look at.', cause: 'the break is the remedy: {the chooser} destroyed {the target} because it was the door the worse thing would have come through', hides_in: history, clue_shape: {act1: a warning given before the break and laughed at, act2: the proof the chooser gathered, act3: 'the worse thing itself, seen close'}, hooks: [{phase: P7, must: 'the win ending must answer the worse thing, not only undo the break'}]}
      - {id: secret_world_is_ending_suppressed, label: The end has a day and is kept back, statement: '{The land} ends by {what} within {span}; {who} has long known the day and keeps the peace by saying nothing.', cause: 'the break is the ending''s first step, and it fell where it did by choice: {the chooser} turned it onto {the target} and away from something they would not lose', hides_in: cosmology, clue_shape: {act1: 'a measure that does not fit: a level, a count of days, a season', act2: 'those who know, preparing for themselves', act3: 'the ending''s measure, seen whole'}, hooks: [{phase: P7, must: the doom day is the end or the last chance to stop it}]}
      - {id: secret_enemy_is_us, label: We feed it, statement: 'The harm is made or fed by {our own people, rule or rite}; to stop it is to stop ourselves.', cause: 'the break is what our own way did to {the target}: {the chooser} knew and let it go on, because the way is what we are', hides_in: polity, clue_shape: {act1: the harm is worst where we are strongest, act2: the rite's or the custom's true purpose, act3: 'the feeding, witnessed'}, hooks: [{phase: P4, must: the leading faction's stance on being found out is denial; its fracture is the one who knows}]}
      - {id: secret_land_is_a_body, label: The land is alive, statement: '{The region} is a living thing that feels; {who} has been {hurting it, feeding it, bargaining with it} on purpose.', cause: 'the break is the land''s answer to what was done to it: {the chooser} provoked it at {the target}', hides_in: geography, clue_shape: {act1: 'ground that is warm in winter, or that flinches', act2: 'the workers'' songs, which are instructions', act3: the place where it can be spoken to}, conflicts_with: [spine_titan_back, rule_land_guards_lifeline, act_awakened], hooks: [{phase: P3, must: 'the region''s danger tier is fixed by the living land, not by who lives there'}]}
      - {id: secret_planes_are_one, label: The other planes are here, statement: 'The other planes are this world''s {past, future or underside}; to cross is to travel in {time or depth}.', cause: 'the break is a piece of that other side brought across or sent away: {the chooser} moved {the target} between then and now', hides_in: cosmology, clue_shape: {act1: a creature from beyond that knows a local name, act2: 'two places that are one place, seen from both', act3: 'the crossing, a site'}, conflicts_with: [spine_two_worlds, ruin_broken_time, ruin_planar_rift], hooks: [{phase: P2, must: 'the planes table deviates: at least one baseline plane is renamed as a place in this world'}]}
      - {id: secret_monsters_were_made, label: The monsters were people, statement: '{A kind of creature} descends from {a people} reshaped by {who}, on purpose.', cause: 'the break is the same reshaping used again, or the reshaped striking back: {the chooser} turned the old working on {the target}', hides_in: creature, clue_shape: {act1: a creature that keeps a custom only people keep, act2: 'the working''s tools, in hands that should not hold them', act3: 'a living one who speaks, and remembers'}, conflicts_with: [ruin_made_peoples, ruin_failed_experiment], hooks: [{phase: P6, must: 'one site''s occupants are the made; their attitude to intruders is a people''s, not a beast''s'}]}
      - {id: secret_cure_is_the_cause, label: The protector makes the threat, statement: '{An institution} that guards against {a threat} makes it, because the guarding is its power.', cause: 'the break is the threat made large for once: {the chooser} let it loose on {the target} so that the guards would be needed for a lifetime', hides_in: institution, clue_shape: {act1: the harm follows the guards' own road, act2: 'the making, seen', act3: 'the one who ordered it, and their reason in their own mouth'}, hooks: [{phase: P4, must: 'the institution is a faction with archetype religious, guild or state; its endgame is the threat never ending'}]}
      - {id: secret_king_is_a_copy, label: Someone is a replacement, statement: '{A ruler, a hero, a high priest} is not who they are taken for ({a changeling, a made likeness, an impostor}); the true one is {held, hiding or gone}.', cause: 'the break removed the one thing that could tell the two apart: {the chooser} broke {the target} to keep the replacement safe, or to force it into the open', hides_in: polity, clue_shape: {act1: a habit that changed on a known day, act2: a token only the true one could have sent, act3: 'the true one, or what is left to prove them'}, conflicts_with: [break_no_direct_lies], hooks: [{phase: P5, must: the copy and the original are two NPC entities; the original is secret with an opaque id}]}
      - {id: secret_prophecy_is_engineered, label: The destiny was composed by someone alive, statement: 'The foretelling everyone believes was composed by {who} {years} ago as a plan, and they are still following it.', cause: 'the break is a line of the foretelling made to come true: {the chooser} did to {the target} what the words said would happen', hides_in: history, clue_shape: {act1: a prediction that came true too exactly, act2: an earlier telling with a different ending, act3: the author}, hooks: [{phase: P7, must: the foretelling's next line is a beat its author means to bring about}]}
      - {id: secret_names_have_power, label: The break was spoken, statement: 'A true name commands what it names; {who} keeps such names, and one was said aloud.', cause: 'the break is a command: {the chooser} spoke the true name of {the target} and told it what to do', hides_in: magic, clue_shape: {act1: someone who cannot be made to say their own name, act2: 'the keepers of names, and the one name missing from their keeping', act3: 'the name of {the target}, and who else knows it'}, conflicts_with: [rule_true_names, rule_names_shape_places], hooks: [{phase: P1, must: naming.json marks one language as the binding one}]}
      - {id: secret_the_hero_failed, label: The victory was bought, statement: 'The hero of {an old victory} did not win it; it was bought from {who} with a promise, and the promise has now been kept.', cause: 'the break is the promised thing handed over: {the chooser} decided that {the target} would be what was given', hides_in: history, clue_shape: {act1: the hero's honours do not match what witnesses saw, act2: 'the terms, kept by the other side', act3: 'the handing over, and who stood by'}, conflicts_with: [break_the_enemy_won], hooks: [{phase: P2, must: the hero is an event_ or npc_ entity with a public and a secret layer}]}
      - {id: secret_two_worlds_overlaid, label: Another world shares this ground, statement: 'Another world lies over this one, place for place; the wall between is thin at {where}, and {who} is wearing it thinner on purpose.', cause: 'the break is where the wall gave: {the chooser} wore it through at {the target} to let something across, or someone out', hides_in: cosmology, clue_shape: {act1: a room larger inside by night than by day, act2: a thing from the other side that has a twin here, act3: 'the worn place, a site'}, conflicts_with: [spine_two_worlds, ruin_planar_rift, ruin_planar_invasion, act_merged_with_plane, scar_plane_thinned], hooks: [{phase: P3, must: one landmark exists on both sides}]}
      - {id: secret_wrong_target, label: It was meant for something else, statement: 'The blow was aimed at {someone or something else}; {the target} was struck by error or as a blind, and the true aim still stands.', cause: 'the break is a miss or a mask: {the chooser} wanted {the true aim}, and will try again', hides_in: history, clue_shape: {act1: the harm makes no sense for what was struck, act2: 'the true aim, which was warned and moved in time', act3: 'the second attempt, being made ready'}, hooks: [{phase: P7, must: the escalation's last step is the second attempt on the true aim}]}
      - {id: secret_cover_for_a_taking, label: Something was taken under it, statement: 'The break was a cover: while everyone looked at the harm, {something} was carried out of {the target}, and the taker still has it.', cause: 'the break is the noise around a taking: {the chooser} broke {the target} so that nobody would ask what was missing from it', hides_in: artifact, clue_shape: {act1: one thing absent that the harm could not have destroyed, act2: 'those who carried it, and where they went', act3: 'the taken thing, in use'}, weight_by: [{when: {any_of: [act_burned, act_sank, act_vanished]}, x: 2}], hooks: [{phase: P6, must: the taken thing is an item_ entity and a site payoff on the escalation's upper steps}]}
      - {id: secret_rehearsal, label: It was a rehearsal, statement: 'The break was done small and here to learn whether it can be done; the true one is meant for {where or what}.', cause: 'the break is a first attempt: {the chooser} tried the working on {the target} and is now mending its faults', hides_in: history, clue_shape: {act1: watchers who came before the break and measured after, act2: 'the faults of the first attempt, and who is mending them', act3: 'the true one, made ready'}, hooks: [{phase: P7, must: the doom is the true attempt; the loss ending is its success}]}
      - {id: secret_lesser_harm, label: It was the lesser thing, statement: '{Who} was ordered, bound or driven to do something far worse; the break is what they did instead.', cause: 'the break is a refusal: {the chooser} broke {the target} because it was the least of what was demanded, and the one who demanded is not satisfied', hides_in: history, clue_shape: {act1: the harm stopped short of what it could have been, act2: 'the demand, and who made it', act3: 'what was refused, still wanted'}, hooks: [{phase: P5, must: the one who demanded is an NPC or a power with a dossier of its own}]}
      - {id: secret_done_from_inside, label: It was done from inside, statement: 'What is told as a blow from outside was done by {those who kept the target}; they walked away, opened it or turned it themselves, and tell another story.', cause: 'the break is a leaving: {the chooser} was one of {the target}''s own, and chose to end it rather than {what staying meant}', hides_in: polity, clue_shape: {act1: no sign of force where force is claimed, act2: 'one of the keepers, living under another name', act3: 'what staying would have meant, shown'}, conflicts_with: [break_no_direct_lies], weight_by: [{when: {any_of: [act_migrated, act_closed]}, x: 2}], hooks: [{phase: P5, must: one of the keepers is a supporting NPC with a second identity in dm-only}]}
      - {id: secret_set_someone_free, label: It set someone free, statement: '{Someone} was bound to {the target} by {an oath, a service, a shape, a wedding}, and only its ending could loose them.', cause: 'the break is a release: {the chooser} broke {the target} to free {the bound one}, and counted the cost acceptable', hides_in: history, clue_shape: {act1: one person whose life got better the day of the break, act2: 'the binding, and what it took from them', act3: 'the freed one, and what they will do to stay free'}, hooks: [{phase: P5, must: the freed one is a supporting or major NPC the party has reason to like}]}
      - {id: secret_death_refused, label: A death was refused, statement: '{Someone} should have died and was not let go; what holds them here is fed by {what}, and it has to be fed again.', cause: 'the break is what the holding cost: {the chooser} gave {the target} so that one death would not stand', hides_in: cosmology, clue_shape: {act1: someone who was seen to die and is seen again, act2: 'the one who feeds the holding, and what it eats', act3: 'the held one, and whether they wish to stay'}, conflicts_with: [break_dead_rise, contest_living_dead], hooks: [{phase: P5, must: the held one is an NPC with a dossier; one NPC who loved them knows}]}
      - {id: secret_mind_from_outside, label: Someone is worn by a mind from outside, statement: '{A trusted person} let a mind from outside the world in, for {a reason that seemed good}; it has worn them for {years} and learns the land through their eyes.', cause: 'the break is the mind''s first act with a borrowed hand: {the chooser} opened themselves to it, and it moved them against {the target}', hides_in: creature, clue_shape: {act1: a trusted person whose small habits are all a little wrong, act2: others who met the same mind and were let go, act3: 'the mind itself, and what it came to learn'}, conflicts_with: [break_no_direct_lies], hooks: [{phase: P6, must: one site is where the mind was first met; its ecology is not of this world}]}
      - {id: secret_restoration, label: It clears the ground for an old order, statement: '{An old order: an empire, a dynasty, a sworn order, a faith} never accepted its end; the break removes what was built over it.', cause: 'the break is a clearing: {the chooser} broke {the target} because it stood where the old order means to stand again', hides_in: polity, clue_shape: {act1: old emblems kept clean in a place that should have forgotten them, act2: 'those who still hold the old ranks, and who pays them', act3: the one who would sit in the old seat}, hooks: [{phase: P4, must: one faction holds the old order's ranks in secret; its endgame is the restoration}]}
      - {id: secret_curse_fell_due, label: A curse fell due, statement: '{Someone} broke {a sworn thing} or wronged {a power} knowing what it would call down, and judged it worth it.', cause: 'the break is the curse landing: {the chooser} did the wrong, and {the target} is where it fell', hides_in: history, clue_shape: {act1: 'the harm spares one house, one field, one name', act2: 'the sworn thing, and who witnessed its breaking', act3: 'the wronged power, and what would end the curse'}, conflicts_with: [break_oath_curse], hooks: [{phase: P2, must: 'the wronged power is a god, a plane''s keeper or a named force with the curse in its secret field'}]}
      - {id: secret_dreamed_into_being, label: It was dreamed first, statement: '{A sleeper} dreamed the break before it happened; {who} learned how a dream of theirs is made to hold on waking.', cause: 'the break is a dream made to hold: {the chooser} put {the target} into the sleeper''s dream, and woke them at the right moment', hides_in: cosmology, clue_shape: {act1: people who dreamed the harm the night before it came, act2: 'the sleeper, kept and tended', act3: 'the next dream, being prepared'}, conflicts_with: [break_dreams_are_a_place], hooks: [{phase: P5, must: the sleeper is an NPC who does not know what their dreams are used for}]}

  twist:
    roll: {secret: true, avoid_used: true, labels: [P1.secret_twist, P1.secret_twist.gate]}
    note: "the threat's hidden truth, optional (build item 18d): rolled when the content mix holds mystery, else on a d2; `cause` is told with the villain and the move; revealed at stage 2 or at the final confrontation. The old twists are the keeping now"
    rows:
      - {id: secret_history_looping, label: It was done before, hides_in: history, cause: 'the villain repeats what felled the old kingdom of the ruin: the same move by the same road, and the first time it worked', statement: 'This was done once before: what felled {the ruin''s old kingdom} was the same move, {who} buried the telling, and the villain found the way again.', hooks: [{phase: P2, must: an earlier dated event mirrors the move}], requires: {any_of: [ruin_road_kingdom, ruin_water_kingdom, ruin_sorcerer_kings, ruin_city_states, ruin_steppe_union, ruin_kingdom_of_the_dead, ruin_empire, ruin_mage_war, ruin_giants_and_dragons, ruin_besieged_land, ruin_kin_war, ruin_celestial_war, ruin_dark_lords_fall, ruin_fallen_order]}}
      - {id: secret_artifact_is_seal, label: The prize is a seal, hides_in: artifact, cause: 'the prize everyone fights for is a seal, and the villain wants it used, because using it lets out what it holds', statement: '{The prize} is a stopper on {what}; to use it is to draw it out, and the villain knows it.', conflicts_with: [contest_sealed_remnant, ruin_imprisoned_god], weight_by: [{when: {any_of: [act_opened]}, x: 3}], hooks: [{phase: P6, must: the prize is an item_ entity and a site payoff in stage 2 or 3}], requires: {any_of: ["prize:new", "prize:remnant"]}}
      - {id: secret_artifact_is_alive, label: The relic is a person, hides_in: artifact, cause: 'the relic the goal turns on is a mind that was once a person, and the villain is its hand, not its master', statement: '{A relic} is a mind that was once a person; it has steered its keepers for {years}, and now it steers the villain.', hooks: [{phase: P5, must: one NPC is the relic's present keeper and does not know what it is}], requires: {any_of: ["goal_piece:remnant", "goal_piece:new"]}}
      - {id: secret_break_was_the_cure, label: The move was a cure, hides_in: history, cause: 'the villain struck to hold back something worse that was coming, and the cure has become a harm of its own', statement: 'Something worse was coming for {the land}: {what}. The move held it back, and only the villain would look at it.', hooks: [{phase: P7, must: 'the win ending must answer the worse thing, not only undo the move'}]}
      - {id: secret_monsters_were_made, label: The monsters were people, hides_in: creature, cause: 'the hand''s creatures were once a people, reshaped by the villain or for it: victims, not a people evil by birth', statement: '{The hand''s creatures} descend from {a people} reshaped by {who}, on purpose; some of them remember.', conflicts_with: [ruin_made_peoples, ruin_failed_experiment], hooks: [{phase: P6, must: 'one site''s occupants are the made; their attitude to intruders is a people''s, not a beast''s'}], requires: {any_of: ["hand_family:monstrosity", "hand_family:undead", "hand_family:lycanthrope", "hand_family:plant", "hand_family:aberration", "hand_family:construct"]}}
      - {id: secret_cure_is_the_cause, label: The protector makes the threat, hides_in: institution, cause: 'the protector the land relies on, a side of the contest, an order or a guard, feeds the threat, because the guarding is its power', statement: '{A side, an order or a guard} that protects the land against {the threat} feeds it, because the guarding is its power.', hooks: [{phase: P4, must: 'the institution is a faction with archetype religious, guild or state; its endgame is the threat never ending'}]}
      - {id: secret_king_is_a_copy, label: Someone is a replacement, hides_in: polity, cause: 'someone the land trusts is a replacement the villain set in place, and the true one is held, hidden or gone', statement: '{A ruler, a hero, a high priest} is not who they are taken for ({a changeling, a made likeness, an impostor}); the true one is {held, hiding or gone}.', conflicts_with: [break_no_direct_lies], hooks: [{phase: P5, must: the copy and the original are two NPC entities; the original is secret with an opaque id}]}
      - {id: secret_prophecy_is_engineered, label: The destiny was composed by someone alive, hides_in: history, cause: 'the foretelling that names the villain''s goal was composed by someone alive as a plan, and the villain follows it or was written into it', statement: 'The foretelling everyone believes was composed by {who} {years} ago as a plan, and they are still following it.', hooks: [{phase: P7, must: the foretelling's next line is a beat its author means to bring about}]}
      - {id: secret_names_have_power, label: The move was spoken, hides_in: magic, cause: 'the villain struck by speaking a true name and telling what it named what to do, and it keeps more names', statement: 'A true name commands what it names; {who} keeps such names, and one was said aloud.', conflicts_with: [rule_true_names, rule_names_shape_places], hooks: [{phase: P1, must: naming.json marks one language as the binding one}]}
      - {id: secret_the_hero_failed, label: The victory was bought, hides_in: history, cause: 'the old victory the land celebrates was bought from the villain or its master with a promise, and the move is the promise coming due', statement: 'The hero of {an old victory} did not win it; it was bought from {who} with a promise, and the promise has now been kept.', conflicts_with: [break_the_enemy_won], hooks: [{phase: P2, must: the hero is an event_ or npc_ entity with a public and a secret layer}]}
      - {id: secret_wrong_target, label: It was meant for something else, hides_in: history, cause: 'what the move struck was a blind or a miss; the villain''s true aim still stands, and it will strike again', statement: 'The blow was aimed at {someone or something else}; {the target} was struck by error or as a blind, and the true aim still stands.', hooks: [{phase: P7, must: the escalation's last step is the second attempt on the true aim}]}
      - {id: secret_cover_for_a_taking, label: Something was taken under it, hides_in: artifact, cause: 'the move was a cover: while everyone looked at the harm, the villain carried something out, and still has it', statement: 'The move was a cover: while everyone looked at the harm, {something} was carried out of {the target}, and the taker still has it.', weight_by: [{when: {any_of: [act_burned, act_sank, act_vanished]}, x: 2}], hooks: [{phase: P6, must: the taken thing is an item_ entity and a site payoff on the escalation's upper steps}]}
      - {id: secret_rehearsal, label: It was a rehearsal, hides_in: history, cause: 'the move was a rehearsal, made small to learn whether it can be done, and the true one is meant for a greater place', statement: 'The move was done small and here to learn whether it can be done; the true one is meant for {where or what}.', hooks: [{phase: P7, must: the doom is the true attempt; the loss ending is its success}]}
      - {id: secret_lesser_harm, label: It was the lesser thing, hides_in: history, cause: 'the villain was ordered or bound to do something far worse, and the move is the lesser thing it did instead; the one who ordered it is not satisfied', statement: '{Who} was ordered, bound or driven to do something far worse; the move is what they did instead.', hooks: [{phase: P5, must: the one who demanded is an NPC or a power with a dossier of its own}]}
      - {id: secret_done_from_inside, label: It was done from inside, hides_in: polity, cause: 'the move was made from inside: those who kept what was struck turned it themselves, and tell another story', statement: 'What is told as a blow from outside was done by {those who kept the target}; they walked away, opened it or turned it themselves, and tell another story.', conflicts_with: [break_no_direct_lies], weight_by: [{when: {any_of: [act_migrated, act_closed]}, x: 2}], hooks: [{phase: P5, must: one of the keepers is a supporting NPC with a second identity in dm-only}]}
      - {id: secret_set_someone_free, label: It set someone free, hides_in: history, cause: 'the move set free someone bound to what it struck, and the villain counted the cost worth it', statement: '{Someone} was bound to {the target} by {an oath, a service, a shape, a wedding}, and only its ending could loose them.', hooks: [{phase: P5, must: the freed one is a supporting or major NPC the party has reason to like}]}
      - {id: secret_death_refused, label: A death was refused, hides_in: cosmology, cause: 'the villain refused a death, and what the move took feeds what holds the dead one here; it has to be fed again', statement: '{Someone} should have died and was not let go; what holds them here is fed by {what}, and it has to be fed again.', conflicts_with: [break_dead_rise, contest_living_dead], hooks: [{phase: P5, must: the held one is an NPC with a dossier; one NPC who loved them knows}]}
      - {id: secret_mind_from_outside, label: Someone is worn by a mind from outside, hides_in: creature, cause: 'the villain is worn by a mind from outside the world, let in for a reason that seemed good, and it learns the land through the villain''s eyes', statement: '{A trusted person} let a mind from outside the world in, for {a reason that seemed good}; it has worn them for {years} and learns the land through their eyes.', conflicts_with: [break_no_direct_lies], hooks: [{phase: P6, must: one site is where the mind was first met; its ecology is not of this world}]}
      - {id: secret_restoration, label: It clears the ground for an old order, hides_in: polity, cause: 'the move clears the ground for an old order that never accepted its end, and the villain serves it', statement: '{An old order: an empire, a dynasty, a sworn order, a faith} never accepted its end; the move removes what was built over it.', hooks: [{phase: P4, must: one faction holds the old order's ranks in secret; its endgame is the restoration}]}
      - {id: twist_greater_power, label: A greater power stands behind the villain, hides_in: cosmology, cause: 'the villain is a pawn: a greater power behind it means to take what the goal wins, and the villain believes it is the master', hooks: [{phase: P2, must: 'the greater power stands in the history or the planes, never named in public'}, {phase: P7, must: the final confrontation shows the greater power's hand; the villain's fall does not end it}], statement: 'Behind the villain stands a greater power ({a fiend lord, a god, an elder mind, an old empire''s ghost, an archfey, an elemental prince}) that means to take what the goal wins; the villain believes it is the master.'}
    retired:                          # build item 18d: readable by id for legacy births, never rolled
      - {id: twist_two_halves, label: Two hold a half each, rule: two people each hold half of the truth and are enemies; neither half alone means anything, hooks: [{phase: P5, must: the two are NPCs in different factions with an `enemy` relationship line}]}
      - {id: twist_one_faction_knows, label: One faction knows, rule: a whole faction knows and has built its doctrine on the secret, hooks: [{phase: P4, must: that faction's true belief is the secret; its cover is the public story}]}
      - {id: twist_worse_than_rumour, label: Worse than the rumour, rule: 'a public rumour already tells half; the truth is worse in kind, not degree', hooks: [{phase: P8, must: the primer's rumours section carries the half}]}
      - {id: twist_keeper_is_sympathetic, label: The keeper is kind, rule: whoever keeps the secret does so to protect someone the party will like, hooks: [{phase: P5, must: the keeper is a supporting NPC with an attitude of ally}]}
      - {id: twist_revealing_is_dangerous, label: Revealing it opens something, rule: the secret holds something worse shut; telling it has a cost the party will bear, hooks: [{phase: P7, must: the loss ending is the secret revealed carelessly}]}
      - {id: twist_dying_with_last_witness, label: Going with the last witness, rule: 'the last person who can prove it is old, ill or hunted; the clock is theirs', hooks: [{phase: P4, must: the witness is in the load_bearing set from day 0; a front step targets them}]}
      - {id: twist_pc_is_involved, label: A PC is involved, rule: 'one socket binds a PC''s past to the secret: their family, their teacher, their oath', hooks: [{phase: P9, must: one thread's truth is a layer of the secret}]}
      - {id: twist_inverted_guilt, label: The blamed are the harmed, rule: the people everyone blames for the break are the ones it harmed most, hooks: [{phase: P5, must: the demographic table gives the blamed people a settlement or district}]}
      - {id: twist_public_half, label: Half is public, rule: everyone knows the fact; nobody knows what it means, hooks: [{phase: P8, must: the fact is in common-knowledge.json; the meaning is secret}]}
      - {id: twist_the_secret_has_an_owner, label: The secret is owned, rule: someone gains from the secret every day and will kill to keep it, hooks: [{phase: P4, must: a faction asset is the gain; the simulation's news shows it moving}]}
      - {id: twist_reversible, label: It can be undone, rule: 'the break can be undone by a rite, a return or a name; the cost is named', hooks: [{phase: P7, must: the win ending is the undoing; its cost is in the ending text}]}
      - {id: twist_irreversible, label: It cannot be undone, rule: nothing restores what the break took; the question is only who lives with it, hooks: [{phase: P7, must: no ending restores the loss; the pyrrhic ending is the honest one}]}
      - {id: twist_chooser_did_not_know, label: The chooser did not know, rule: the chooser meant something smaller or other; the break is larger than the choice, conflicts_with: [secret_break_was_the_cure, secret_lesser_harm], hooks: [{phase: P5, must: what the chooser meant to do is a Known Fact of one NPC}]}
      - {id: twist_chooser_undoing, label: The chooser is trying to undo it, rule: 'the chooser regrets it and is working to undo it, by means that may be worse', hooks: [{phase: P7, must: 'one beat is the chooser''s attempt; the party can help it, stop it or take it over'}]}
      - {id: twist_known_not_believed, label: The people know and nobody believes, rule: 'the truth is told openly as a tale, a children''s rhyme or one stubborn voice, and nobody takes it for true', hooks: [{phase: P8, must: 'the primer carries the tale as folklore, unmarked'}]}

  keeping:
    roll: {secret: true, avoid_used: true, labels: [P1.secret_keeping]}
    note: "how the truth is held (the old twist table, build item 18d)"
    rows:
      - {id: twist_two_halves, label: Two hold a half each, rule: two people each hold half of the truth and are enemies; neither half alone means anything, hooks: [{phase: P5, must: the two are NPCs in different factions with an `enemy` relationship line}]}
