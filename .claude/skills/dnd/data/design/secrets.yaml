      - {id: keep_hand_sends_heroes, label: The one who sends the heroes is the hand itself, rule: 'the patron who sets the party on the trail is the hand, steering them at its own enemies', hooks: [{phase: P9, must: 'the first session''s patron is the hand or speaks for it, and the party cannot know it yet'}]}
      - {id: keep_pitied_victim, label: The pitied victim staged it all, rule: 'the one the world pities for the move staged it, and the pity is its cover', hooks: [{phase: P5, must: 'the victim is a supporting or major NPC whose grief is played, with a second layer in dm-only'}]}

  trail:
    roll: {secret: true, avoid_used: true, labels: [P1.secret_trail]}
    note: "the clue shapes of the three stages (`stages`: stage1, stage2, stage3); the third carries how the villain is stopped"
    rows:
      - {id: trail_rumour_document_witness, label: 'Rumour, document, witness', stages: {stage1: rumour_or_sign, stage2: document, stage3: living_witness_and_how_it_is_stopped}, conflicts_with: [break_no_writing], hooks: [{phase: P6, must: stage 1 clue in a settlement or social site; stage 2 clue an item_ in a site; stage 3 clue a secret NPC}]}
      - {id: trail_place_relic_confession, label: 'Place, relic, confession', stages: {stage1: a_place_that_is_wrong, stage2: relic, stage3: confession_and_how_it_is_stopped}, hooks: [{phase: P6, must: stage 1 clue is a telegraph of an over-tier site; stage 2 clue is that site's payoff; stage 3 clue is spoken by the BBEG or a lieutenant}]}
      - {id: trail_anomaly_pattern_source, label: 'Anomaly, pattern, source', stages: {stage1: anomaly, stage2: pattern_across_places, stage3: source_site_and_how_it_is_stopped}, hooks: [{phase: P3, must: the stage 2 pattern spans at least two regions' travel tables}]}
      - {id: trail_person_person_person, label: Three people, stages: {stage1: someone_who_lied, stage2: someone_who_gained, stage3: someone_who_did_it_and_how_it_is_stopped}, hooks: [{phase: P5, must: 'three NPCs at three tiers: minor, supporting, major or secret'}]}
      - {id: trail_map_door_room, label: 'Map, door, room', stages: {stage1: a_map_fragment, stage2: a_door_that_needs_it, stage3: the_room_behind_and_how_it_is_stopped}, hooks: [{phase: P6, must: the stage 3 room is the payoff room of a major or capstone site; its minimum depth is stamped}]}
      - {id: trail_trace_wound_survivor, label: 'Trace, wound, survivor', stages: {stage1: a_trace_left_behind, stage2: a_wound_that_matches_it, stage3: a_survivor_who_saw_and_how_it_is_stopped}, hooks: [{phase: P5, must: 'the survivor is a supporting or secret NPC; the wound is on a person, a beast or a place the party can examine'}]}
      - {id: trail_object_maker_owner, label: 'Object, maker, owner', stages: {stage1: an_object_out_of_place, stage2: the_one_who_made_it, stage3: the_one_it_was_made_for_and_how_it_is_stopped}, hooks: [{phase: P6, must: the object is an item_ entity found in stage 1; the maker's workshop is a site or a settlement anchor}]}
      - {id: trail_tracks_lair_keeper, label: 'Tracks, lair, keeper', stages: {stage1: tracks_that_lead_away, stage2: the_lair_they_lead_to, stage3: what_was_kept_there_and_how_it_is_stopped}, hooks: [{phase: P3, must: the tracks are a travel result in one region; the lair is a site on the map}]}
      - {id: trail_letter_traitor, label: 'Captured letter, receiver, traitor', stages: {stage1: a_captured_letter, stage2: the_one_it_was_meant_for, stage3: the_traitor_who_wrote_it_and_how_it_is_stopped}, conflicts_with: [break_no_writing], hooks: [{phase: P5, must: the traitor is inside a faction the party trusts by stage 3}]}
      - {id: trail_custom_exile_origin, label: 'Custom, exile, origin', stages: {stage1: a_custom_nobody_explains, stage2: an_exile_who_broke_it, stage3: the_place_it_began_and_how_it_is_stopped}, hooks: [{phase: P8, must: the custom is in the primer as something natives do without knowing why}]}
      - {id: trail_omen_divination_dead, label: 'Omen, divination, the testimony of the dead', stages: {stage1: an_omen, stage2: a_divination, stage3: the_testimony_of_the_dead_and_how_it_is_stopped}, hooks: [{phase: P2, must: the omen is a dated sign in the history}, {phase: P5, must: one NPC can read the divination of the second stage}, {phase: P6, must: the dead who can testify lie at a site the party can reach; speak with dead works there}]}


  god_relation:
    roll: {secret: true, avoid_used: false, labels: [P1.secret_pin.relation]}
    note: "W1 (build item 18e): the secret is pinned to a god only when the threat's family is the god or the power behind it (the twist's or the goal's patron, `greater_power`) is a god; the god's part in it is rolled here, never the writer's"
    rows:
      - {id: godrel_deceived, label: Deceived, text: {name: "the god was deceived: it believes it blesses something else"}, hooks: [{phase: P2, must: "the god's church can be shown the deceit"}]}
      - {id: godrel_impersonated, label: Impersonated, text: {name: "the god is impersonated: another speaks in its voice"}, hooks: [{phase: P2, must: "the god's true voice can be told from the false one"}]}
      - {id: godrel_complicit, label: Complicit, text: {name: "the god is complicit: it wants what the villain wants"}, hooks: [{phase: P2, must: "the god's ends stand in the history, read rightly"}]}
      - {id: godrel_silent, label: Silent, text: {name: "the god is silent: it knows and does nothing"}, hooks: [{phase: P2, must: "the god's silence has a reason the party can learn"}]}
      - {id: godrel_opposed, label: Opposed, text: {name: "the god is opposed: it works against the villain, and cannot act directly"}, hooks: [{phase: P2, must: "the god's church can be an ally of the party"}]}

  greater_power:
    roll: {secret: true, avoid_used: false, labels: [P1.secret_power]}
    note: "build item 18e-2: a power behind the villain (the twist 'a greater power stands behind the villain', the goal 'a patron's will') rolls its kind here, once; the secret is pinned to a god only when the kind is a god (`god: true`)"
    rows:
      - {id: power_fiend_lord, label: A fiend lord, text: {name: "a fiend lord of the lower planes"}, hooks: [{phase: P2, must: "the fiend lord has a domain among the planes and a true name the party can learn"}]}
      - {id: power_god, label: A god, god: true, text: {name: "a god"}, hooks: [{phase: P2, must: "the god stands in the pantheon; its part in the threat is the pin's rolled relation"}]}
      - {id: power_elder_mind, label: An elder mind, text: {name: "an elder mind from beyond the stars"}, hooks: [{phase: P2, must: "the elder mind has a place in the cosmology, outside the planes the gods keep"}]}
      - {id: power_old_empire_ghost, label: An old empire's ghost, text: {name: "the ghost of an old empire"}, hooks: [{phase: P2, must: "the old empire stands in the history; its ghost wants it back"}]}
      # the design tab's sufficiency check against classic D&D, owner-approved 2026-10-08 (build item 22c)
      - {id: power_archfey, label: An archfey, text: {name: "an archfey of the fey echo"}, weight_by: [{when: {any_of: [family_hag_fey]}, x: 2}], hooks: [{phase: P2, must: "the archfey holds a court in the fey echo and a bargain the party can learn"}]}
      - {id: power_elemental_prince, label: An elemental prince, text: {name: "an elemental prince of evil"}, weight_by: [{when: {any_of: [family_genie_elemental, ruin_bound_elements]}, x: 2}], hooks: [{phase: P2, must: "the elemental prince holds a realm among the inner planes and a cult the party can trace"}]}

  chooser:
    roll: {avoid_used: false}
    notation: d6
    note: "who chose the break: always a person, never a thing, a god acting alone or an accident. The list is public, the roll is secret. The chooser is the villain exactly when the villain's tie to the break is `bond_caused_it` (antagonists.yaml#break_tie); item 10 rolls it."
    rows: []                         # build item 18c: the villain always chose; nothing is rolled here
    retired:                          # readable by id for legacy births
      - id: chooser_the_villain
        label: The villain
        rule: "the villain chose the break and stands by it"
        conflicts_with: [bond_exploits_it, bond_wants_to_complete, bond_wants_to_reverse, bond_failed_to_stop, bond_product_of_it, twist_chooser_undoing]
        hooks:
          - {phase: P4, must: "the BBEG's dossier holds the choice as a dated act with a reason"}
      - id: chooser_contest_role
        label: A contest role
        rule: "the leader or a member of one of the contest's roles chose it, for the role's sake or against it"
        hooks:
          - {phase: P4, must: "the role's faction carries the choice as its secret or its fracture"}
      - id: chooser_the_institution
        label: The signature institution
        rule: "a person inside the signature institution chose it, in its name or behind its back"
        hooks:
          - {phase: P5, must: "the person is an NPC of the institution with the choice in dm-only"}
      - id: chooser_the_people
        label: The signature people
        rule: "one of the signature people chose it, for the people or against them"
        hooks:
          - {phase: P5, must: "the person is an NPC of the people with the choice in dm-only"}
      - id: chooser_ordinary_gone
        label: An ordinary person, gone or forgotten
        rule: "someone of no rank chose it and is no longer alive, or no longer remembered; what they chose outlived them"
        conflicts_with: [twist_chooser_undoing]
        hooks:
          - {phase: P5, must: "someone living knew them; the Act 2 clue passes through that NPC"}
      - id: chooser_bargainer
        label: A mortal who bargained with a power
        rule: "a mortal struck a bargain with a power (a god, a plane's lord, a dragon, the living land); the power gave the means, the mortal made the choice"
        hooks:
          - {phase: P2, must: "the power is a god or a plane's keeper with the bargain in its secret field"}
