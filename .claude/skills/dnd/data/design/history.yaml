# history.yaml — the timeline (item 5, history): 3-5 named ages, 8-12 dated events in the last 200
# years (500 in epic) plus 3-5 deep-past events, every event an `event_` entity with two layers:
# as taught (public) and as it happened (discoverable or secret). The villain's origin and the big
# secret are pinned to the timeline; living memory (which NPCs witnessed which event) seeds the
# Known Facts ledgers of P5. Age and event names are English names (errata 24.2 #17).
schema_version: 1
table: history
consumed_by: [P2, P4, P5, P7, P8]
plan: "item 5 (history), 17 #12, item 8.6; build item 22 (docs/p2-tags.md S5, the tag pass)"
layer: texture             # build item 22a (S0 #1): the seated events (the move, the villain's origin, the ruin's age) are story records
roll: {labels: [P2.age.<n>, P2.event.<n>, P2.divergence.<n>], avoid_used: true, note: "the ages between the first and the present avoid other campaigns' rows; event types, divergences and memories repeat (rule 8: their sub-tables say so)"}
rules:
  ages: "scale.yaml history.ages; the first age (age_before or age_founding) and the present (age_now_named_for_fear) stand in place, the ruin's fall is an age, only the ages between are rolled (none at short)"
  events: "scale.yaml history.dated_events over history.years_covered, plus history.deep_past_events; at least one event per age"
  seated: [the move (dated from P1's time row), the villain's origin (its true layer secret, from P1's chain), the signature institution's founding, the ruin's fall (an age)]
  layers: "every event has `as_taught` (public) and `as_happened` (discoverable; secret only for the villain's origin); a divergence row of `div_none` means the layers agree"
  divergences: "exactly scale.yaml history.divergences of the unseated dated events diverge (1 / 2 / 3); every other event's layers agree"
  living_memory: "witness lists are written for the seated story events only (S5: they do not swell P5's people)"
hooks_common:
  - {phase: P2, must: "each age and event carries its id, a year or span, its taught line and, where they differ, its true line in dm-only"}
  - {phase: P5, must: "Known Facts baselines are filled from the witness lists"}
  - {phase: P8, must: "the primer's history is the taught layer only, sectioned per culture"}

tables:

  age_template:
    notation: d14
    rows:
      - id: age_founding
        label: The Founding
        span_hint: "the first age; ends with a date everyone knows"
        hooks:
          - {phase: P2, must: "the founding event is in it"}
      - id: age_golden
        label: The Golden Age
        span_hint: "an age everyone wishes they were born in; it ended for a reason nobody agrees on"
        hooks:
          - {phase: P2, must: "the ending is a dated event"}
      - id: age_silence
        label: The Silence
        span_hint: "an age defined by an absence (of gods, of ships, of rain, of a people)"
        hooks:
          - {phase: P2, must: "what fell silent is a registry entity; the silence has a date"}
      - id: age_flood
        label: The Flood
        span_hint: "an age that began with the land changing shape"
        hooks:
          - {phase: P3, must: "a landmark is what the flood left; a region's biome is the flood's"}
      - id: age_the_war_of
        label: The War of {Name}
        span_hint: "an age of one war, named for its cause or its loser"
        hooks:
          - {phase: P4, must: "two factions' stance is the war's; the war's end is a treaty event"}
      - id: age_long_peace
        label: The Long Peace
        span_hint: "an age with no war, whose price someone paid"
        hooks:
          - {phase: P2, must: "the peace's as_happened layer names what was given for it"}
      - id: age_dimming
        label: The Dimming
        span_hint: "an age in which something is slowly going out"
        hooks:
          - {phase: P8, must: "the primer says what is going out, as the folk see it"}
      - id: age_reckoning
        label: The Reckoning
        span_hint: "an age of tribunals, lists and settlements of old debts"
        hooks:
          - {phase: P4, must: "a faction's endgame is the reckoning completed or escaped"}
      - id: age_wandering
        label: The Wandering
        span_hint: "an age in which a people moved, arrived or left"
        hooks:
          - {phase: P5, must: "the demographic table shows the arrivals with a district"}
      - id: age_of_thing
        label: The Age of {Thing}
        span_hint: "an age named for what was built in it (roads, walls, mills)"
        hooks:
          - {phase: P3, must: "the things built are landmarks or anchors that still stand"}
      - id: age_kings
        label: The Age of {Rulers}
        span_hint: "an age named for a dynasty or an office that no longer rules"
        hooks:
          - {phase: P4, must: "a claimant to the old office is an NPC or a resistance faction"}
      - id: age_plague
        label: The Sickness
        span_hint: "an age of a disease that changed the law"
        hooks:
          - {phase: P8, must: "the primer carries a law that dates from the sickness"}
      - id: age_now_named_for_fear
        label: The present, named for what it fears
        span_hint: "the last age; its name is what the folk fear of the threat's public face (the Waiting, the Unlit, the Short Years)"
        hooks:
          - {phase: P2, must: "the present age is named for what the folk fear of the threat's public face, never its hidden part"}
      - id: age_before
        label: The Time Before
        span_hint: "an unnamed deep age; ruins older than the record"
        hooks:
          - {phase: P6, must: "one major site predates the record"}

  event_type:
    notation: d16
    roll: {avoid_used: false}
    # build item 22n: an event is named `the <name_word> of <referent>`; `name_referent` lists the kinds its referent may
    # be (place, person, god: a counted god's public name; ship: a ship of the common tongue, else `the Loss of <place>`),
    # one drawn per event; a god only where the type's story is a god's (the owner, at the 22n audit)
    rows:
      - id: evtype_founding
        label: A founding
        name_word: Founding
        name_referent: [place]
        hooks:
          - {phase: P3, must: "the founded thing is a settlement, an institution or a polity on the map"}
      - id: evtype_treaty
        label: A treaty
        name_word: Treaty
        name_referent: [place]
        hooks:
          - {phase: P4, must: "the treaty's terms are a stance edge; its breach is a front step"}
      - id: evtype_disaster
        label: A disaster
        name_word: [Burning, Drowning, Ruin]
        name_referent: [place]
        hooks:
          - {phase: P3, must: "the disaster left a landmark; a list of who was saved exists"}
      - id: evtype_war
        label: A war
        name_word: War
        name_referent: [god, place, person]
        hooks:
          - {phase: P4, must: "the war's sides are factions or their ancestors; a veteran is an NPC"}
      - id: evtype_succession
        label: A succession
        name_word: Crowning
        name_referent: [person]
        hooks:
          - {phase: P4, must: "the succession's loser has heirs; one is the betrayal candidate"}
      - id: evtype_discovery
        label: A discovery
        name_word: Finding
        name_referent: [person]
        hooks:
          - {phase: P2, must: "what was discovered touches the magic system or the phenomenon"}
      - id: evtype_plague
        label: A sickness
        name_word: Sickness
        name_referent: [place]
        hooks:
          - {phase: P5, must: "at least one NPC is marked by it"}
      - id: evtype_miracle
        label: A miracle
        name_word: Miracle
        name_referent: [god, place, person]
        hooks:
          - {phase: P2, must: "the god credited has a discoverable story about it"}
      - id: evtype_heresy
        label: A heresy
        name_word: Heresy
        name_referent: [god, place, person]
        hooks:
          - {phase: P4, must: "the heretics survive as a faction, a cell or a rite"}
      - id: evtype_exile
        label: An exile
        name_word: Exile
        name_referent: [person]
        hooks:
          - {phase: P5, must: "the exiles' descendants are in the demographic table"}
      - id: evtype_migration
        label: A migration
        name_word: Crossing
        name_referent: [place]
        hooks:
          - {phase: P3, must: "the migrants' route is a map route; their settlement is a district or a village"}
      - id: evtype_vanishing
        label: A vanishing
        name_word: Vanishing
        name_referent: [place]
        hooks:
          - {phase: P6, must: "where the vanished went is a site"}
      - id: evtype_naming
        label: A naming or renaming
        name_word: Naming
        name_referent: [place]
      - id: evtype_wreck_or_loss
        label: A wreck or a loss
        name_word: Wreck
        name_referent: [ship, place]
        hooks:
          - {phase: P6, must: "what was lost is an item_ or a site payoff"}
      - id: evtype_silencing
        label: A silencing
        name_word: Silencing
        name_referent: [god]
        hooks:
          - {phase: P2, must: "the silenced thing is a god, a people or an institution with a rel_silenced_one row"}
      - id: evtype_building
        label: A building
        name_word: Raising
        name_referent: [place]
        hooks:
          - {phase: P3, must: "the built thing is a landmark or an anchor; who paid is discoverable"}

  divergence:
    notation: d9
    roll: {avoid_used: false}
    note: "how the as_taught and as_happened layers differ; exactly scale.yaml history.divergences of them per campaign (S5), every tier public or discoverable: the campaign's secret comes from P1's chain alone"
    rows:
      - id: div_none
        label: The layers agree
        weight: 3
        tier: public
        hooks:
          - {phase: P2, must: "the event has one line; the validator does not expect a dm-only mirror"}
      - id: div_winner_was_loser
        label: The winner was the loser
        tier: discoverable
        hooks:
          - {phase: P2, must: "the other side's account exists somewhere as a clue"}
      - id: div_hero_was_many
        label: The hero was several people
        tier: discoverable
        hooks:
          - {phase: P5, must: "one of the several has descendants in the roster"}
      - id: div_disaster_was_caused
        label: The disaster was caused
        tier: discoverable
        hooks:
          - {phase: P4, must: "the cause is a faction's ancestor"}
      - id: div_treaty_was_surrender
        label: The treaty was a surrender
        tier: discoverable
        hooks:
          - {phase: P4, must: "the surrendered thing is an asset the other side still holds"}
      - id: div_date_is_wrong
        label: The date is wrong
        tier: discoverable
        hooks:
          - {phase: P2, must: "the calendar or a grave shows the true date"}
      - id: div_villain_was_victim
        label: The villain of the story was the victim
        tier: discoverable
        hooks:
          - {phase: P5, must: "the victim's line still exists and knows"}
      - id: div_two_events_were_one
        label: Two events were one
        tier: discoverable
        hooks:
          - {phase: P2, must: "the two taught events are both entities; the true one is the dm-only mirror"}
      - id: div_someone_survived
        label: Someone survived who should not have
        tier: discoverable
        hooks:
          - {phase: P5, must: "the survivor is an NPC whose survival is discoverable"}

  memory:
    notation: d7
    roll: {avoid_used: false}
    note: "who holds the as_happened layer; drives the witness lists and the Known Facts baseline"
    rows:
      - id: mem_elders
        label: The elders
        hooks:
          - {phase: P5, must: "at least two elder NPCs hold Known Facts from the event"}
      - id: mem_one_survivor
        label: One survivor
        hooks:
          - {phase: P4, must: "the survivor is in the load_bearing set"}
      - id: mem_records
        label: An institution's records
        hooks:
          - {phase: P6, must: "the records are an item_ in a site or an anchor"}
      - id: mem_the_dead
        label: The dead, if they can be read
      - id: mem_nobody
        label: Nobody living
        hooks:
          - {phase: P6, must: "the truth is a site's payoff, never a person"}
      - id: mem_a_song
        label: A song or a saying
        hooks:
          - {phase: P8, must: "the primer carries the song as folklore"}
      - id: mem_the_land
        label: The land shows it
        hooks:
          - {phase: P3, must: "a landmark is the evidence; the travel table can find it"}
