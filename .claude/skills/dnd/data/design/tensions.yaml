# tensions.yaml — the question (plan item 25, step 2 #4; docs/p1-foundation-rows.md §11).
# The question's home is the contest: the roll is weighted by the contest's family (`families`), the contest's
# sides a and b carry the two poles (the writer assigns them; the door checks both carry one), and the villain
# carries one pole to its terrible extreme (a secret roll). One question per contest: short and standard 1, epic 2
# (scale.yaml `tensions`). The question grows with the escalation. No example question: examples anchor births;
# the rows hold the poles and their families only. 28 pairs kept, silence/witness and debt/grace dropped, 5 added.
schema_version: 1
table: tensions
consumed_by: [P1, P4, P5, P7, P8, P9]
plan: "item 4.1, 17 #3, item 25 step 2 #4"
roll: {avoid_used: true, family_weight: 3, note: "a row whose families hold the contest's family weighs ×family_weight"}
hooks_common:
  - {phase: P1, must: "the writer turns the abstract poles into one concrete question in the campaign's own terms; the player pitch carries the question, never an answer"}
  - {phase: P4, must: "each side's doctrine carries its pole; the relations' reasons come from the question"}
  - {phase: P5, must: "NPCs stand somewhere on the question; the villain's answer is dm-only"}
  - {phase: P7, must: "the endings are the question's possible answers; each escalation step asks it at its own scale"}
  - {phase: P8, must: "the primer tells how natives argue the question"}
  - {phase: P9, must: "each PC's story touches the question somewhere"}

