# naming.yaml — what a campaign's names are made from (plan item 25 step 2 piece 8; build item 11; the owner's
# decisions of 2026-10-04 are recorded in docs/p1-build-11.md).
#
# A "language" is a naming style, spoken by nobody: one part bag (`family`) for person and god names, a handful of
# rolled roots for place, institution, month and day names, and seven settlement tails of its own. The script rolls
# the bags, the roots and every candidate (design_names.py); the writer invents no proper noun. A person or god name
# is one opening, a middle by the bag's chance and one ending, joined under the shape rules; a compound name fills a
# pattern's slots from the language's roots and the word lists. A root carries no gloss. Uniqueness across campaigns
# is on full names only (errata 24.2 #18: no stem soft-ban).
schema_version: 1
table: naming
consumed_by: [P1, P2, P3, P4, P5, P6, P8]
plan: "item 25 step 2 #8, item 4.6, 8.7, 17 #8, errata 24.2 #17 #18 #20 #25 #27, risk 24.1 #18"
layer: texture                    # build item 18a: the names hang on the story
roll: {notation: d17, count_by_scale: {short: 2, standard: 3, epic: 3}, avoid_used: true, labels: [P1.naming_family.1, P1.naming_family.2, P1.naming_family.3, P1.naming_family.old]}
hooks_common:
  - {phase: P5, must: "person names come from the NPC's culture's family; no first-name collision inside a campaign"}
  - {phase: validator, must: "every registry name passes the blacklist and carries no Turkish letters"}

rules:
  world_language: "Names are English-language fantasy names, spelled in ASCII letters, never transliterated Turkish. The campaign is written in English (errata 24.2 #28); a name is written as it stands and never translated. How a name takes a Turkish suffix at the table is a play rule: data/play/turkish-suffixing.yaml."
  modes:
    person: "the script joins one opening, a middle by the bag's `middle_chance` and one ending of the language's bag, under `join`; the writer takes the next unused name"
    god: "a bag name like a person's; an epithet by `patterns.god_epithet`"
    place: "the script fills `patterns.place` from the language's roots, its settlement tails and the word lists"
    institution: "`patterns.institution`, with the rolled form's `name_words` (signatures.yaml#institution_form)"
    people: "`patterns.people`"
    phenomenon: "`patterns.phenomenon`, with `words.phenomenon_tails`"
    month_day: "`patterns.month` (one of the three rollable patterns per campaign) and `patterns.day`, from the calendar's own roots"
    old_tongue: "`patterns.old_tongue`: a word of the old tongue's bag, alone or with a site word; it names only the sites the ruin source left"
    ship: "`patterns.ship`"
  join:
    doubled_letter: "a doubled letter at a join is dropped"
    vowel_vowel: "a vowel never meets a vowel at a join"
    vowel_join: "a `vowel_join` bag never joins consonant to consonant"
    min_letters: 5
    max_consonant_run: 3
    repeats: "no two-letter chunk repeated at once, no three-letter chunk repeated anywhere"
  adjectives: "a root whose first tag is `colour` or `direction and age` is an adjective, and so is a root marked `adjective: true` (steep, dry, dark and the like); a pattern slot says whether it takes one (`adjective: true`)"
  parts_differ: "no part of a name repeats another: a building's root is not its word (no Mill Mill)"
  # build item 13b, the door's prose scan: a capitalised word that opens no sentence, heading, list item or table cell
  # belongs to a pooled or registered name (a form, region, building or site word stands inside its name and is matched
  # with it), or stands on this closed list: "I", the SRD's capitalised terms the prompts allow, and what a rolled row's
  # own text says in capitals (a test holds every public P0 and P1 row to the list). Nothing else.
  capitalised_common: ["I", "DC", "AC", "HP", "CR", "XP", "SRD", "DM", "BBEG", "Act",
                       "Strength", "Dexterity", "Constitution", "Intelligence", "Wisdom", "Charisma",
                       "Acrobatics", "Arcana", "Athletics", "Deception", "History", "Insight", "Intimidation", "Investigation",
                       "Medicine", "Nature", "Perception", "Performance", "Persuasion", "Religion", "Stealth", "Survival",
                       "Animal Handling", "Sleight of Hand", "Deep Speech",
                       "Common", "Dwarvish", "Elvish", "Giant", "Gnomish", "Goblin", "Halfling", "Orc", "Abyssal", "Celestial",
                       "Draconic", "Infernal", "Primordial", "Sylvan", "Undercommon",
                       "Hells", "Nine Hells", "Abyss"]       # planes two approved rows name in their own statements
  # build item 11b: what the script rolls for a campaign's names, at the end of P1's rolls (decisions 33-44).
  draw:
    living_languages: {short: 2, standard: 3, epic: 3}       # the old tongue stands beside them in every campaign
    roots_per_language: {short: 10, standard: 18, epic: 24}  # the old tongue has none: its names are bag words
    called_share: 0.5              # half of a language's roots (rounded up) come from the tags it calls, half freely
    head_floor: {short: 5, standard: 9, epic: 12}            # roots usable as a head in every draw
    noun_heads: 4                  # of them, not adjectives
    natural_tails: 2               # roots usable as a natural tail in every draw
    settlement_tails: 7            # per living language, of the 22
    shared_tails_max: 2            # two languages of one campaign share at most this many
    calendar:
      month_roots: 14
      day_roots: 9
      special_months: 4            # `High` / `Last` names
      tags: [crop, "weather and season", cold, animal, forest, sky, "fresh water"]
      not_days: [spring, summer, autumn, winter]             # a season names no day (Summerday)
      not_months_under: [pattern_month_fall]                 # nor a month under these month patterns (Springfall)
      # real words a calendar root and its pattern's tail would spell
      real_words: [sunday, monday, tuesday, wednesday, thursday, friday, saturday, midday, holiday, hollyday, rainfall,
                   snowfall, nightfall, windfall, dewfall, landfall, waterfall, honeymoon]
    head_uses_max: 3               # one head root in at most this many names of a stock
    compound_max_letters: 12
    stock_factor: 3                # a campaign's stocks hold at least this many times what the scale can use
    candidates: 4                  # per signature slot

