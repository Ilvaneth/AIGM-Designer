    - {root: ember, meaning: "a fire not yet out", pos: head, domains: [fire, light]}
    - {root: cinder, meaning: "what fire leaves", pos: head, domains: [fire]}
    - {root: crown, meaning: "rule, a hilltop", pos: either, domains: [law, sky]}
