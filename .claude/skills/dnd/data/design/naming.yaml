    - {root: mere, meaning: "a shallow lake", pos: tail, domains: [water]}
    - {root: fen, meaning: "wet ground", pos: either, domains: [water, plant]}
    - {root: moor, meaning: "open high ground", pos: either, domains: [earth, weather]}
