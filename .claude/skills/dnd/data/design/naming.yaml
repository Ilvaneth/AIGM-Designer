patterns:
  place:
    - {pattern: "{Head}{tail}", examples: [Lanternside, Saltmere, Reedham, Thornhold, Blackcrag, Ashford]}
    - {pattern: "{Head} {Noun}", examples: [Salt Market, Salt House, Sunken Pier]}
    - {pattern: "The {Adj} {Noun}", examples: [The Weary Gull, The Blind Lantern, The Bottomless Well]}
    - {pattern: "{Owner}'s {Noun}", examples: ["Reeve's Manor", "Mourners' Hall"]}
    - {pattern: "{Noun} of {Name}", examples: [Temple of Velune, Tomb of Skarde]}
  institution:
    - {pattern: "Court of {Noun}s", examples: [Court of Mourners, Court of Tallies]}
    - {pattern: "Order of the {Noun}", examples: [Order of the Lamp, Order of the Still Bell]}
    - {pattern: "{Head} Brotherhood / Sisterhood", examples: [Tide Brotherhood, Kiln Sisterhood]}
    - {pattern: "The {Noun} Watch", examples: [The Tide Watch, The Wall Watch]}
    - {pattern: "Guild of {Noun}s", examples: [Guild of Lamplighters, Guild of Weighers]}
    - {pattern: "House {Head}", examples: [House Ember, House Ottavia]}
    - {pattern: "Wardens of the {Noun}", examples: [Wardens of the Road, Wardens of the Deep]}
    - {pattern: "The {Head} Company", examples: [The Salt Company, The Moon Company]}
    - {pattern: "The {Head} Tribunal", examples: [The Ash Tribunal, The Grey Tribunal]}
    - {pattern: "The {Head} Choir", examples: [The Bell Choir, The Hush Choir]}
  people:
    - {pattern: "{Head}bound", examples: [Saltbound, Oathbound]}
    - {pattern: "{Head}folk", examples: [Marshfolk, Cliffolk]}
    - {pattern: "{Head}kin", examples: [Stonekin, Wolfkin]}
    - {pattern: "{Head}born", examples: [Mistborn, Ashborn]}
    - {pattern: "the {Adj} Ones", examples: [the Hollow Ones, the Unnamed]}
  god_epithet:
    - {pattern: "the {Adj} One", examples: [the Still One, the Patient One]}
    - {pattern: "{Noun}bearer", examples: [Lampbearer, Oathbearer]}
    - {pattern: "Mother / Father of {Noun}s", examples: [Mother of Waves, Father of Kilns]}
    - {pattern: "{God} of {Noun}s", examples: [God of Endings, Lady of Tallies]}
    - {pattern: "the {Noun} Who {Verb}s", examples: [the Bell Who Waits, the Crow Who Counts]}
  ship:
    - {pattern: "the {Noun}", examples: [the Vesper, the Gannet, the Tallow]}
    - {pattern: "the {Adj} {Noun}", examples: [the Kindly Sister, the Grey Hart]}
    - {pattern: "{Name}'s {Noun}", examples: ["Hild's Promise", "Ottavia's Debt"]}
  month:
    - {pattern: "{Head}month", examples: [Lampmonth, Thawmonth]}
    - {pattern: "{Head}tide", examples: [Frosttide, Reedtide]}
    - {pattern: "{Head}moon", examples: [Wolfmoon, Grainmoon]}
    - {pattern: "{Head}fall", examples: [Reedfall, Ashfall]}
    - {pattern: "High / First / Last {Head}", examples: [High Salt, First Thaw, Last Ember]}
  day:
    - {pattern: "{Head}day", examples: [Saltday, Bellday, Hushday]}

blacklist:
  # brand and real-world names a generated name may never equal (whole name, case-insensitive)
  exact: [Mordor, Gondor, Rohan, Rivendell, Hogwarts, Westeros, Winterfell, Narnia, Waterdeep, Neverwinter, Baldur, Faerun, Eberron, Greyhawk, Krynn, Ravenloft, Barovia, Hyrule, Azeroth, Tamriel, Skyrim, Camelot, Avalon, London, Istanbul, Paris, Rome, Athens, Jerusalem, Gandalf, Drizzt, Elminster, Strahd, Sauron, Aragorn, Legolas, Frodo, Bilbo, Merlin, Arthur, Excalibur]
  # substrings that mark a lift from a known property or read as an insult in Turkish or English
  substrings: [mordor, hogwart, westeros, drizzt, strahd, faerun, azeroth, tamriel, hyrule, sauron, yarak, orospu, pezevenk, amcik, sikik, fuck, shit, cunt]
  # the owner's explicit bans (2026-09-25): names that recurred across Ashen Crown until they were hated.
  # A stem here is banned as a substring of any generated NAME (Corvin, Corwyn, Corren...), never as a
  # lexicon root; lexicon roots (crown, hollow, ember) are never banned (errata 24.2 #18).
  owner_banned:
    exact: [Cassivar, Corvina, Corvin, Corven, Corwyn, Corren, Corvan, Emberhold, Cinder Choir]
    stems: [corv, corw, corr, cassiv]
    reason: "recurred across Ashen Crown sessions in ever-similar forms; the owner banned them and every derivative"
  # the model's favourite fantasy names, the regression-to-the-mean list (risk 24.1 #18): banned as a whole
  # name or a whole first name, case-insensitive, so no naming language can fall back on them
  llm_favourites: [Kael, Kaelen, Kaelith, Lyra, Lyric, Seraphina, Seraphine, Elara, Elaria, Aria, Zephyr, Zephyra,
                   Thorne, Vex, Nyx, Silas, Alaric, Aldric, Elowen, Isolde, Kieran, Marius, Valen, Varis, Draven,
                   Malachi, Eldrin, Theron, Orin, Torin, Darius, Lucian, Caspian, Cassian, Evander, Lysander,
                   Rhiannon, Sylvain, Sylvaine, Aurora, Luna, Nova, Ember, Ash, Raven, Sable, Onyx, Obsidian,
                   Jasper, Ezra, Milo, Finn, Rowan, Wren, Sage, Ivy, Hazel, Mira, Nadia, Zara, Kira, Elias,
                   Ronan, Soren, Auric, Vaelor, Xander, Zane, Vesperine, Morrigan, Astrid, Freya, Gideon]
  # in-campaign exact bans live in naming.json `banned[]` (name_registry seeds it)
  lexicon_stems_are_never_banned: true
