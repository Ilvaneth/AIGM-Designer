# naming.yaml — sound families and the root lexicon that campaign naming languages are rolled from.
#
# The world speaks English, the narration is Turkish (errata 24.2 #17): every family produces
# English-language fantasy names. Two modes per language (risk 24.1 #18): `phonetic` for persons
# and gods (onset / nucleus / coda banks below), `compound` for places and institutions (the root
# lexicon and the patterns below). P1 rolls 2-3 families with --avoid-used, mutates each into a
# campaign language (design/naming.json), assigns it to polities and peoples; every later phase
# names through that file, and name_registry check runs across campaigns on full names only
# (errata 24.2 #18: no stem soft-ban — crown, hollow, ember may recur).
schema_version: 1
table: naming
consumed_by: [P1, P2, P3, P4, P5, P8]
plan: "item 4.6, 8.7, 17 #8, errata 24.2 #17 #18, risk 24.1 #18"
roll: {notation: d10, count_by_scale: {short: 2, standard: 3, epic: 3}, avoid_used: true, labels: [P1.naming_family.1, P1.naming_family.2, P1.naming_family.3]}
hooks_common:
  - {phase: P1, must: "each rolled family is mutated (one bank changed, one cluster forbidden, one root set chosen) and written to naming.json with a `label_tr`"}
  - {phase: P5, must: "person names come from the NPC's culture's family; no first-name collision inside a campaign"}
  - {phase: validator, must: "every registry name passes the blacklist and carries no Turkish letters"}

rules:
  world_language: "Names are English-language fantasy names, spelled in ASCII letters, never transliterated Turkish. Common nouns in prose stay Turkish (kandil, han, hancı)."
  modes:
    person: "phonetic: 1-3 syllables from the family's banks; an optional byname from the lexicon (Ilme Lampwright, Yesra Saltreader)"
    god: "phonetic like a person, plus an epithet from `patterns.god_epithet` (Ormis, Lampbearer)"
    place: "compound from the lexicon: `patterns.place` (Lanternside, Saltmere, Reedham, Mourners' Hall)"
    institution: "`patterns.institution` (Court of Mourners, Tide Brotherhood)"
    people: "`patterns.people` (Saltbound, Marshfolk)"
    ship: "`patterns.ship` (the Vesper)"
    month_day: "`patterns.month` and `patterns.day` from the calendar's roots (Lampmonth, Saltday); months are 30 days"
  turkish_suffixing:
    principle: "The name keeps its English spelling; a Turkish suffix attaches after an apostrophe and harmonises with the LAST PRONOUNCED vowel, not the last letter."
    rules:
      - "back vowel sound (a, o, u, and English long i as in -side) → -a / -ı or -u / -da / -ın or -un"
      - "front vowel sound (e, i, ö, ü) → -e / -i or -ü / -de / -in or -ün"
      - "final silent e is not a vowel: Lanternside'a, Velune'a (pronounced -oon), Saltmere'e (pronounced -meer)"
      - "final voiceless consonant (p, t, k, ch, s, sh, f) → -ta / -te, -tan / -ten: Karsgate'te, Ashwick'te"
      - "a name that ends in a pronounced vowel takes the buffer y or n: Ottavia'ya, Ottavia'nın, Umbra'da"
    ending_table:
      - {ending: "-side / -ide / -ine (long i)", harmony: back, example: "Lanternside'a, Lanternside'ın"}
      - {ending: "-ham", harmony: back, example: "Reedham'a, Reedham'da"}
      - {ending: "-mere / -meer", harmony: front, example: "Saltmere'e, Saltmere'in"}
      - {ending: "-ford / -hold / -ton / -mouth / -moor", harmony: back, example: "Thornhold'a, Thornhold'un"}
      - {ending: "-gate / -stead / -wick / -bury / -reach / -fen", harmony: front, example: "Karsgate'e, Ashwick'in"}
      - {ending: "-crag / -march / -fall", harmony: back, example: "Blackcrag'a, Reedmarch'ın"}
    examples:
      - {name: Lanternside, dative: "Lanternside'a", locative: "Lanternside'da", genitive: "Lanternside'ın"}
      - {name: Saltmere, dative: "Saltmere'e", locative: "Saltmere'de", genitive: "Saltmere'in"}
      - {name: Reedham, dative: "Reedham'a", locative: "Reedham'da", genitive: "Reedham'ın"}
      - {name: Karsgate, dative: "Karsgate'e", locative: "Karsgate'te", genitive: "Karsgate'in"}
      - {name: Velune, dative: "Velune'a", locative: "Velune'da", genitive: "Velune'un"}
      - {name: Ottavia, dative: "Ottavia'ya", locative: "Ottavia'da", genitive: "Ottavia'nın"}
  tr_suffix_friendly: "a family is suffix-friendly when its names end in a single pronounced consonant or a clear vowel; every family below is, and the mutation step must keep it so (no final -ough, -que, -gh)"

tables:

  family:
    notation: d10
    rows:
      - id: family_liquid_vowel
        label: Liquid vowel-heavy
        feel: "soft, open, coastal; easy on a Turkish tongue"
        onsets: [v, m, r, l, s, n, y, ""]
        nuclei: [a, e, i, o, u]
        codas: [n, r, l, s, m, ""]
        length: [2, 3]
        forbidden_clusters: [rr, ll, sr, ii, uu]
        best_for: [coastal, river, lowland]
        samples_person: [Velune, Ormis, Sarven, Ilme, Yesra, Tolvan, Olmar, Ameli]
        samples_god: [Velune, Ormis, Isken]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by replacing one onset and one coda; pick 12-20 roots from the lexicon's water, plant or light domains"}
      - id: family_harsh_consonantal
        label: Harsh consonantal
        feel: "clipped, stony, upland; two syllables that end hard"
        onsets: [d, t, k, v, g, dr, kr, gr, br]
        nuclei: [a, o, u, e]
        codas: [k, n, sk, rt, r, g, d]
        length: [2, 2]
        forbidden_clusters: [kk, tt, gg, dd]
        best_for: [upland, mining, martial]
        samples_person: [Draskun, Tegrik, Kortan, Vardek, Brogar, Torvask]
        samples_god: [Draskun, Vurgan]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by adding one cluster onset; roots from stone, iron, oath, war domains"}
      - id: family_sibilant_soft
        label: Sibilant and soft
        feel: "hissing, secretive, sacred; s and th everywhere"
        onsets: [s, sh, th, z, ss, ""]
        nuclei: [a, e, i, y, ai]
        codas: [s, th, sh, n, l, ""]
        length: [2, 3]
        forbidden_clusters: [shsh, thth, zz, ss-s]
        best_for: [priesthood, desert, secret_society]
        samples_person: [Sethis, Ashael, Zisra, Sylith, Isseth, Shaal]
        samples_god: [Sethis, Ythasa]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by forbidding one of s / sh / th; roots from holy, dark, smoke, silence domains"}
      - id: family_nasal_round
        label: Nasal and round
        feel: "humming, warm, agricultural; m and n with round vowels"
        onsets: [m, n, b, w, ""]
        nuclei: [o, u, a, oo]
        codas: [m, n, mb, nd, ""]
        length: [2, 3]
        forbidden_clusters: [nn, ww, oooo]
        best_for: [farmland, river_delta, herding]
        samples_person: [Ummon, Nemra, Bowan, Mondu, Onnam, Bumor]
        samples_god: [Moonda, Ummon]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by adding one nucleus; roots from grain, cattle, hearth, earth domains"}
      - id: family_northern_clipped
        label: Northern clipped
        feel: "cold, short, hard-won; one or two syllables with heavy codas"
        onsets: [h, hr, sk, st, sv, ul, ""]
        nuclei: [a, o, e, i]
        codas: [lf, rd, rn, ik, ald, ""]
        length: [1, 2]
        forbidden_clusters: [hh, skst, rdrd]
        best_for: [cold, seafaring, raiders]
        samples_person: [Hrolf, Skarde, Ulvik, Stennard, Svala, Hild]
        samples_god: [Skarde, Ulvard]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by dropping one onset cluster; roots from frost, sea, wolf, oath domains"}
      - id: family_courtly_latinate
        label: Courtly Latinate
        feel: "long, formal, urban; three or four syllables, vowel endings common"
        onsets: [c, v, l, aur, cass, ott, ""]
        nuclei: [a, e, i, o]
        codas: [n, r, l, us, ia, an, ""]
        length: [3, 4]
        forbidden_clusters: [uu, ii, cc]
        best_for: [city, court, banking, scholarly]
        samples_person: [Aurelan, Valorin, Liesander, Ottavien, Sabellin, Solenne]
        samples_god: [Aurelan, Solenne]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by fixing the length to three; roots from law, coin, light, marble domains"}
      - id: family_deep_guttural
        label: Deep guttural
        feel: "throat-deep, heavy; for giants, deep-dwellers, a made people"
        onsets: [gh, uz, kr, zh, m, ""]
        nuclei: [o, u, a]
        codas: [k, g, rr, gh, sh, m]
        length: [2, 2]
        forbidden_clusters: [ghgh, zhzh, rrr]
        best_for: [underground, giants, made_people]
        samples_person: [Ghorrak, Uzhmog, Krugam, Zhurog, Moghra, Ukrash]
        samples_god: [Ghorrak, Zhumma]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by softening one onset; roots from deep, stone, hunger, ash domains"}
      - id: family_aspirate_airy
        label: Aspirate and airy
        feel: "breathy, light, high places; h and th with open vowels"
        onsets: [h, th, wh, sh, ""]
        nuclei: [a, e, i, ea, ei]
        codas: [n, th, l, r, ""]
        length: [2, 3]
        forbidden_clusters: [thth, hh, whwh]
        best_for: [mountain, sky, nomad, fey]
        samples_person: [Hathen, Ishara, Thewa, Whelan, Eirath, Sheanor]
        samples_god: [Hathen, Eirath]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by adding one nucleus diphthong; roots from wind, sky, mist, bird domains"}
      - id: family_rustic_anglic
        label: Rustic Anglic
        feel: "short, homely, English-village; names that sound like tools and weather"
        onsets: [w, b, t, h, d, p, ""]
        nuclei: [a, o, i, e, u]
        codas: [ck, nd, bb, tt, mm, ll]
        length: [1, 2]
        forbidden_clusters: [ckck, bbbb]
        best_for: [village, farmland, guild, common_folk]
        samples_person: [Wick, Brand, Tamsin, Hobb, Dunstan, Peck, Mabbot]
        samples_god: [Old Brand, Mother Tallow]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by forbidding one coda; this family names places best: roots from any domain with the place tails"}
      - id: family_sung_polysyllabic
        label: Sung polysyllabic
        feel: "long, vowel-rich, liquid; an old or long-lived people"
        onsets: [l, s, r, th, el, il, ae, ""]
        nuclei: [a, e, i, ae, ia, ie]
        codas: [l, n, r, th, ""]
        length: [3, 5]
        forbidden_clusters: [rr, thth, aeae]
        best_for: [ancient_people, forest, planar]
        samples_person: [Ilathiel, Saeravan, Elarianel, Thiriel, Lorasithe, Aerenith]
        samples_god: [Ilathiel, Saerava]
        tr_suffix_friendly: true
        hooks:
          - {phase: P1, must: "mutate by capping the length at four; roots from star, song, leaf, age domains"}

