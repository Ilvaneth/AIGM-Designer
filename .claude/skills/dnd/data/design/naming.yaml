words:
  # a region word follows the palette: a word with `requires` is drawn only where the campaign holds one of the kinds
  region_words:
    - {word: March}
    - {word: Reach}
    - {word: Vale}
    - {word: Fells, requires: {any_of: [land_mountain, land_highland]}}
    - {word: Moors, requires: {any_of: [land_plain, land_steppe, land_highland]}}
    - {word: Wold, requires: {any_of: [land_plain, land_steppe, land_highland]}}
    - {word: Coast, requires: {any_of: [land_coast, land_island, land_stone_sea]}}
    - {word: Isles, requires: {any_of: [land_coast, land_island, land_stone_sea]}}
    - {word: Deeps, requires: {any_of: [land_underground, land_coast, land_island, land_stone_sea]}}
    - {word: Wastes, requires: {any_of: [land_desert, land_glass_desert, land_cold, land_volcanic]}}
    - {word: Heights, requires: {any_of: [land_mountain, land_highland]}}
    - {word: Fens, requires: {any_of: [land_marsh, land_river, land_lake]}}
  building_words: [Market, Hall, Gate, Bridge, Cross, Wharf, Stair, Well, Mill, Tower, Shrine, Temple]
  phenomenon_tails: [fall, song, call, turn, rise, bloom, mark, gift, shift, wane, sight, bind]
  site_words: [Vault, Deep, Hall, Gate, Stair, Spire, Tomb, Well]
  # build item 22n (owner-approved 2026-10-08): the cosmos's words
  plane_words: [Realm, Reach, Deep, Expanse, Hollow, Vault, Wild, Shore, Court, Gulf]
  moon_words: [Watcher, Eye, Wanderer, Hound, Shield, Maiden, Sickle, Crown]
  festival_words: [Feast, Night, Day, Vigil]
  folk_festival_words: [Feast, Night, Day, Vigil, Fair]
  ruler_words: [Kings, Queens, Lords, Princes]

patterns:
  # Structured rows a script fills; nothing here shows a finished name (a shown name anchored four births). `parts` in order:
  #   {lit: text} · {root: head | tail | any, adjective: true|false, tags: [...]} · {settlement_tail: true} ·
  #   {word: <a list of `words`>} · {form_word: true} (the rolled form's name word) · {name: person | god | place}
  #   (a pooled name) · {bag_word: true} (a word of the language's bag) · {one_of: [...]} (rolled).
  # `join: joined` writes the parts as one word (the first capitalised); `apart` leaves them as written.
  place:
    - {id: pattern_place_settlement, for: [village, town, city], join: joined, parts: [{root: head, adjective: true}, {settlement_tail: true}]}
    - {id: pattern_place_natural, for: [village, natural_place], join: joined, parts: [{root: head, adjective: true}, {root: tail, natural: true}]}
    - {id: pattern_place_region, for: [region], join: apart, parts: [{lit: "the "}, {root: head, adjective: true}, {lit: " "}, {word: region_words}]}
    - {id: pattern_place_inn, for: [inn, tavern], join: apart, whole_lexicon: true, parts: [{lit: "The "}, {root: any, tags: [colour]}, {lit: " "}, {root: any, tags: [animal]}]}
    - {id: pattern_place_building, for: [quarter, market, building], join: apart, parts: [{root: head, adjective: true}, {lit: " "}, {word: building_words}]}
    - {id: pattern_place_owner, for: [owned_place], join: apart, composed_by: writer, parts: [{name: person}, {lit: "'s "}, {one_of: [{word: building_words}, {root: tail, natural: true}]}]}
    - {id: pattern_place_temple, for: [temple], join: apart, composed_by: writer, parts: [{word: building_words}, {lit: " of "}, {name: god}]}
  institution:
    - {id: pattern_institution_root_form, join: apart, parts: [{lit: "the "}, {root: head, adjective: true}, {lit: " "}, {form_word: true}]}
    - {id: pattern_institution_form_of_root, join: apart, parts: [{form_word: true}, {lit: " of the "}, {root: head, adjective: false}]}
    - {id: pattern_institution_place_form, join: apart, parts: [{lit: "the "}, {name: place}, {lit: " "}, {form_word: true}]}
    - {id: pattern_institution_house, only_form: form_house, join: apart, parts: [{lit: "House "}, {bag_word: true}]}
  people:
    - {id: pattern_people_folk, join: joined, parts: [{root: head, adjective: false}, {lit: folk}]}
    - {id: pattern_people_kin, join: joined, parts: [{root: head, adjective: false}, {lit: kin}]}
    - {id: pattern_people_born, join: joined, parts: [{root: head, adjective: false}, {lit: born}]}
  phenomenon:
    - {id: pattern_phenomenon_joined, join: joined, article: "the ", parts: [{root: head, adjective: false}, {word: phenomenon_tails}]}
    - {id: pattern_phenomenon_apart, join: apart, parts: [{lit: "the "}, {root: head, adjective: false}, {lit: " "}, {word: phenomenon_tails, capital: true}]}
  month:
    - {id: pattern_month_month, rollable: true, join: joined, parts: [{root: head, adjective: false}, {lit: month}]}
    - {id: pattern_month_moon, rollable: true, join: joined, parts: [{root: head, adjective: false}, {lit: moon}]}
    - {id: pattern_month_fall, rollable: true, join: joined, parts: [{root: head, adjective: false}, {lit: fall}]}
    - {id: pattern_month_high_last, rollable: false, for: [special_month, feast], join: apart, parts: [{one_of: [{lit: "High "}, {lit: "Last "}]}, {root: head, adjective: false}]}
  day:
    - {id: pattern_day, join: joined, parts: [{root: head, adjective: false}, {lit: day}]}
  old_tongue:
    - {id: pattern_old_tongue_word, for: [site], join: apart, parts: [{bag_word: true}]}
    - {id: pattern_old_tongue_site, for: [site], join: apart, parts: [{bag_word: true}, {lit: " "}, {word: site_words, plural_ok: true}]}
  god_epithet:
    - {id: pattern_epithet_bearer, join: joined, parts: [{root: head, adjective: false}, {lit: bearer}]}
    - {id: pattern_epithet_parent, join: apart, parts: [{one_of: [{lit: "Mother"}, {lit: "Father"}]}, {lit: " of the "}, {root: head, adjective: false}]}
    - {id: pattern_epithet_lord, join: apart, parts: [{one_of: [{lit: "Lord"}, {lit: "Lady"}]}, {lit: " of the "}, {root: head, adjective: false}]}
    - {id: pattern_epithet_one, join: apart, parts: [{lit: "the "}, {root: any, tags: [colour, "direction and age"]}, {lit: " One"}]}
  ship:
    - {id: pattern_ship_root, join: apart, whole_lexicon: true, parts: [{lit: "the "}, {one_of: [{root: any, tags: [animal], creature: true}, {root: any, only: [wave, pearl, star, dawn, comet]}]}]}
    - {id: pattern_ship_colour_animal, join: apart, whole_lexicon: true, parts: [{lit: "the "}, {root: any, tags: [colour]}, {lit: " "}, {root: any, tags: [animal]}]}
  # build item 22n (owner-approved 2026-10-08): the cosmos's names, drawn into the pool's `cosmos` section after every
  # other stock. `lang`: common (the common tongue; else the other side's, else the people's), old (the old tongue's
  # bag), god (the gods' language). `{name: referent}` is a name of the cosmos's own referent stock (fresh common-tongue
  # persons and places, so the NPC and settlement stocks are not drained); `{name: god}` a counted god's public name;
  # `{name: ship}` a name of the ships stock; `{name_word: true}` the rolled row's `name_word` (history.yaml#event_type,
  # foundation.yaml#action). `composed_by: script` patterns are composed by the P2 roller from what it rolled.
  plane:
    - {id: pattern_plane_word, lang: common, join: apart, parts: [{lit: "the "}, {root: head, adjective: true}, {lit: " "}, {word: plane_words}]}
    - {id: pattern_plane_old, lang: old, join: apart, parts: [{bag_word: true}]}
  festival:
    - {id: pattern_festival_god, for: [god_festival], lang: god, join: apart, parts: [{name: god}, {lit: "'s "}, {word: festival_words}]}
    - {id: pattern_festival_folk, for: [folk_festival, unnamed_god_festival], lang: common, join: apart, parts: [{lit: "the "}, {word: folk_festival_words}, {lit: " of the "}, {root: head, adjective: false}]}
  moon:
    - {id: pattern_moon_word, lang: common, join: apart, whole_lexicon: true, parts: [{lit: "the "}, {root: any, tags: [colour]}, {lit: " "}, {word: moon_words}]}
    - {id: pattern_moon_fresh, lang: common, join: joined, parts: [{root: head, adjective: true}, {root: tail, natural: true}]}
  age:
    - {id: pattern_age_name, for: [age_the_war_of], fills: "{Name}", lang: common, join: apart, parts: [{name: referent}]}
    - {id: pattern_age_thing, for: [age_of_thing], fills: "{Thing}", lang: common, join: apart, parts: [{root: head, adjective: false}]}
    - {id: pattern_age_rulers, for: [age_kings], fills: "{Rulers}", lang: common, join: apart, parts: [{lit: "the "}, {root: head, adjective: false}, {lit: " "}, {word: ruler_words}]}
    - {id: pattern_age_ruin, for: [ruin_age], lang: old, join: apart, parts: [{lit: "The Age of "}, {bag_word: true}]}
    - {id: pattern_age_present, for: [age_now_named_for_fear], composed_by: script, join: apart, parts: [{one_of: [{lit: "The Age of the "}, {lit: "The Eve of the "}]}, {name_word: true}]}   # the Eve under time_coming (the owner, 22n)
  event:
    - {id: pattern_event, for: [event], lang: common, composed_by: script, join: apart, parts: [{lit: "the "}, {name_word: true}, {lit: " of "}, {one_of: [{name: referent}, {name: god}]}]}
    - {id: pattern_event_silencing, for: [evtype_silencing], lang: common, composed_by: script, join: apart, parts: [{lit: "the Silencing of "}, {name: god}]}
    - {id: pattern_event_wreck, for: [evtype_wreck_or_loss], lang: common, composed_by: script, join: apart, parts: [{lit: "the Wreck of "}, {name: ship}]}
    - {id: pattern_event_loss, for: [evtype_wreck_or_loss_landlocked], lang: common, composed_by: script, join: apart, parts: [{lit: "the Loss of "}, {name: referent}]}
    - {id: pattern_event_founding, for: [seat_founding], composed_by: script, join: apart, parts: [{lit: "the Founding of "}, {name: institution}]}
    - {id: pattern_event_ruin, for: [seat_ruin], lang: old, composed_by: script, join: apart, parts: [{lit: "the Fall of "}, {bag_word: true}]}
    - {id: pattern_event_move, for: [seat_move], composed_by: script, join: apart, parts: [{lit: "the "}, {name_word: true}]}

blacklist:
  # brand and real-world names a generated name may never equal (whole name, case-insensitive)
  exact: [Mordor, Gondor, Rohan, Rivendell, Hogwarts, Westeros, Winterfell, Narnia, Waterdeep, Neverwinter, Baldur, Faerun, Eberron, Greyhawk, Krynn, Ravenloft, Barovia, Hyrule, Azeroth, Tamriel, Skyrim, Camelot, Avalon, London, Istanbul, Paris, Rome, Athens, Jerusalem, Gandalf, Drizzt, Elminster, Strahd, Sauron, Aragorn, Legolas, Frodo, Bilbo, Merlin, Arthur, Excalibur]
  # substrings that mark a lift from a known property or read as an insult in Turkish or English
  substrings: [mordor, hogwart, westeros, drizzt, strahd, faerun, azeroth, tamriel, hyrule, sauron, yarak, orospu, pezevenk, amcik, sikik, fuck, shit, cunt]
  # the owner's explicit bans (2026-09-25): names that recurred across Ashen Crown until they were hated.
  # A stem here is banned as a substring of any generated NAME (Corvin, Corwyn, Corren...), never as a
  # lexicon root; lexicon roots (crown, hollow, ember) are never banned (errata 24.2 #18).
  owner_banned:
    exact: [Cassivar, Corvina, Corvin, Corven, Corwyn, Corren, Corvan, Emberhold, Cinder Choir]
    stems: [corv, corw, corr, cassiv]
    reason: "recurred across Ashen Crown sessions in ever-similar forms; the owner banned them and every derivative"
  # the model's favourite fantasy names, the regression-to-the-mean list (risk 24.1 #18): banned as a whole
  # name or a whole first name, case-insensitive, so no naming language can fall back on them
  llm_favourites: [Kael, Kaelen, Kaelith, Lyra, Lyric, Seraphina, Seraphine, Elara, Elaria, Aria, Zephyr, Zephyra,
                   Thorne, Vex, Nyx, Silas, Alaric, Aldric, Elowen, Isolde, Kieran, Marius, Valen, Varis, Draven,
                   Malachi, Eldrin, Theron, Orin, Torin, Darius, Lucian, Caspian, Cassian, Evander, Lysander,
                   Rhiannon, Sylvain, Sylvaine, Aurora, Luna, Nova, Ember, Ash, Raven, Sable, Onyx, Obsidian,
                   Jasper, Ezra, Milo, Finn, Rowan, Wren, Sage, Ivy, Hazel, Mira, Nadia, Zara, Kira, Elias,
                   Ronan, Soren, Auric, Vaelor, Xander, Zane, Vesperine, Morrigan, Astrid, Freya, Gideon]
  # real-world mythology deities (owner ruling 2026-09-25, errata 24.2 #19): the SRD's four historical
  # pantheons and the other traditions the model reaches for; banned as a whole name or a whole first name
  mythology: [Aegir, Ahura Mazda, Amaterasu, Anahita, Anu, Anubis, Apep, Aphrodite, Apollo, Arawn, Ares, Artemis, Astarte, Athena, Baal, Balder, Bast, Belenus, Bes, Brahma, Brigantia, Daghdha, Demeter, Diana, Diancecht, Dionysus, Dunatis, Enki, Enlil, Erlik, Forseti, Frey, Freya, Frigga, Goibhniu, Hades, Hathor, Hecate, Heimdall, Hel, Hephaestus, Hera, Hercules, Hermes, Hermod, Hestia, Huitzilopochtli, Imhotep, Inanna, Indra, Ishtar, Isis, Izanagi, Izanami, Janus, Juno, Jupiter, Kali, Loki, Lugh, Manannan mac Lir, Marduk, Mars, Math Mathonwy, Mercury, Minerva, Mithra, Mokosh, Moloch, Morrigan, Nephthys, Neptune, Nike, Njord, Nuada, Odin, Odur, Oghma, Osiris, Pan, Perun, Pluto, Poseidon, Ptah, Quetzalcoatl, Re-Horakhty, Saturn, Set, Shiva, Sif, Silvanus, Skadi, Sobek, Surtur, Susanoo, Svarog, Tengri, Tezcatlipoca, Thor, Thoth, Thrym, Tyche, Tyr, Uller, Umay, Veles, Venus, Vishnu, Vulcan, Zeus]
  # in-campaign exact bans live in naming.json `banned[]` (name_registry seeds it)
  # Turkish common nouns a writer turns into a proper name ("Konsey", "Lonca"): a name, or an alias written with a capital,
  # equal to one of these is refused at the registry door (critique analysis 2026-09-26: turkish_proper_noun_konsey_lonca).
  # Turkish common nouns that must never stand as a proper name (a legacy birth's lowercase Turkish alias stays allowed).
  turkish_as_name: [Konsey, Lonca, Meclis, Tarikat, Kardeşlik, Birlik, Cemiyet, Kumpanya, Ocak, Hane, Tapınak, Mahkeme, Loca, Tersane, Divan, Saray, Kale, Köy, Kasaba, Şehir, Liman, Kule, Han, Pazar, Muhafızlar, Bekçiler, Rahipler, Kardeşler, Sancak,
