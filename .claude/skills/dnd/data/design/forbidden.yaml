# forbidden.yaml — the one unchanging rule (owner rulings 2026-10-04, errata 24.2 #31; build item 16a).
# A general Campaign Designer excludes no general D&D theme: the twelve cliché defaults this file once refused (the
# awakening ancient evil, the chosen one, prophecy, the dark lord, the evil cult, the corrupt church, the amnesiac
# hero, the tavern opening, the monolithic Empire, collect the pieces, the whispering advisor, the secretly evil
# ruler) are ordinary rows of their tables now. One row stays: no people is evil by birth. While a campaign is being
# formed everyone stays neutral in alignment; alignments are set when good and evil are placed. Fiends and the undead
# are creatures, not peoples; a row about them does not touch the rule.
# Detection is structural first (a closed-list registry field); the lexical patterns are a warning-only scan.
schema_version: 1
table: forbidden
consumed_by: [P1, P5, P6, validator]
plan: "item 4.5, 15.1, 17 #6, risk 24.1 #10, errata 24.2 #31"
hooks_common:
  - {phase: P1, must: "the premise prompt carries the row's label as a hard exclusion"}
  - {phase: validator, must: "structural checks are errors; lexical hits are warnings with the entity id"}

rows:
  - id: forbidden_inherently_evil_races
    label: Inherently evil races
    why: "a people whose alignment is fixed by birth cannot be negotiated with, so a site cannot have an attitude"
    structural: {field: alignment_fixed, table: npcs.yaml#demographic, forbidden_values: [true]}
    lexical: {en: ["(orcs|goblins|drow|kobolds) are (always|inherently|by nature) evil"], tr: ["doğuştan kötü", "(orklar|goblinler) her zaman kötü"]}
    allowed_via: [secret_monsters_were_made]
    hooks:
      - {phase: P5, must: "no demographic row fixes an alignment; for any species with ≥3 NPCs the alignments differ"}
      - {phase: P6, must: "every site's attitude to intruders is a choice its occupants made"}
