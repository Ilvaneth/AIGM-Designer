  # ── 6. the break: built last, strikes one of the pieces (target · action · scars · time · winner) ─────
  break_target:
    roll: {avoid_used: false, note: "the target is a load-bearing piece; the thin place only when the palette holds it; the action must fit the target (the action's `targets` and its fit lists)"}
    hooks_common:
      - {phase: P7, must: "the opening meets the break through its target"}
    rows:
      - {id: target_lifeline, label: The lifeline, piece: lifeline, text: {"name": "the lifeline"}, hooks: [{phase: P3, must: "the lifeline's weak point is where the break struck"}]}
      - {id: target_remnant, label: The ruin's remnant, piece: remnant, text: {"name": "the remnant of the ruin"}, hooks: [{phase: P6, must: "the remnant's site shows the break"}]}
      - {id: target_key_place, label: The spine's key place, piece: key_place, text: {"name": "the key place of the spine"}, hooks: [{phase: P3, must: "the key place's node shows the break"}]}
      - {id: target_heart, label: The heart, piece: heart, text: {"name": "the heart"}, hooks: [{phase: P3, must: "the heart shows the break; a destroyed heart moves the start to its ruins or the nearest end"}]}
      - {id: target_role, label: A contest role, piece: role, text: {"name": "a role of the contest"}, hooks: [{phase: P4, must: "the struck role's faction carries the break"}]}
      - {id: target_thin_place, label: The thin place, piece: thin_place, requires: {any_of: [land_thin_place]}, text: {"name": "the thin place"}, hooks: [{phase: P2, must: "the thin place's plane carries the break"}]}

  action:
    roll:
      avoid_used: false
      row_wait: 3                       # grammar: a verb the last three births used waits; a target + action pair never repeats
      note: >-
        `forms` are past (just now, a generation ago), present (unfolding) and imminent (coming), each a
        self-standing predicate the foundation sentence places after the target's phrase with no suffix.
        `leaves_ruins`: a heart this action destroys leaves ruins, where the campaign starts; otherwise it starts
        at the end nearest the heart (end_a).
        `fits` are the compatibility tables (review #8): lifeline families, remnant kinds and key-place kinds the
        action can strike; the heart, a role and the thin place need only the action's `targets`. `destroys`
        names the pieces the action destroys (a destroyed role cannot be the winner; a destroyed heart moves
        the start). The illustrations stay in docs/p1-foundation-rows.md only; examples anchor births.
    hooks_common:
      - {phase: P2, must: "a dated event of the history is the break, told with this action"}
      - {phase: P8, must: "the day-0 news carries the break's latest sign"}
    rows:
      - id: act_vanished
        label: "Vanished"
        targets: [lifeline, remnant, key_place, heart, role]
        fits: {"lifeline": ["water", "passage", "creatures", "mine", "crop", "craft", "treaty"], "remnant": ["network", "structure", "city", "body", "wasteland", "machine", "object", "source", "rift"], "key_place": ["crossing", "bridge", "water", "gate", "descent", "crossroad", "network", "landmark"]}
        destroys: [heart, role]
        forms: {"past": "vanished", "present": "is vanishing", "imminent": "is about to vanish"}
      - id: act_seized
        label: "Was seized"
        targets: [lifeline, remnant, key_place, heart, thin_place]
        fits: {"lifeline": ["water", "passage", "creatures", "mine", "crop", "craft"], "remnant": ["network", "structure", "city", "body", "machine", "object", "source", "rift"], "key_place": ["crossing", "bridge", "water", "gate", "descent", "crossroad", "network", "landmark"]}
        forms: {"past": "was seized", "present": "is being seized", "imminent": "is about to be seized"}
      - id: act_reversed
        label: "Turned backwards"
        targets: [lifeline, key_place]
        fits: {"lifeline": ["water", "passage", "creatures", "treaty"], "key_place": ["water", "descent", "network"]}
        forms: {"past": "turned backwards", "present": "is turning backwards", "imminent": "is about to turn backwards"}
      - id: act_split
        label: "Split in two"
        targets: [lifeline, key_place, heart, role]
        fits: {"lifeline": ["water", "passage", "creatures", "treaty"], "key_place": ["crossing", "bridge", "water", "gate", "crossroad", "landmark"]}
        destroys: [role]
        forms: {"past": "split in two", "present": "is splitting in two", "imminent": "is about to split in two"}
      - id: act_corrupted
        leaves_ruins: true              # owner, 2026-09-28: a destroyed heart leaves ruins to start in
        label: "Was corrupted"
        targets: [lifeline, remnant, key_place, heart]
        fits: {"lifeline": ["water", "creatures", "mine", "crop", "craft", "treaty"], "remnant": ["network", "structure", "city", "body", "wasteland", "source", "rift"], "key_place": ["crossing", "water", "gate", "network", "landmark"]}
        forms: {"past": "was corrupted", "present": "is being corrupted", "imminent": "is about to be corrupted"}
      - id: act_awakened
        label: "Came alive"
        targets: [remnant, key_place]
        fits: {"remnant": ["body", "machine", "structure", "object", "network"], "key_place": ["bridge", "gate", "descent", "landmark"]}
        forms: {"past": "came alive", "present": "is coming alive", "imminent": "is about to come alive"}
      - id: act_fell_from_sky
        requires: {dial: {era: [medieval, renaissance, ancient, nautical]}}   # not below ground
        leaves_ruins: true              # owner, 2026-09-28: a destroyed heart leaves ruins to start in
        concretise: true                # owner, 2026-09-28: step 2's writer names what fell / what was born (a promise)
        label: "Crushed by what fell from the sky"
        targets: [lifeline, key_place, heart]
        fits: {"lifeline": ["water", "passage", "mine", "crop"], "key_place": ["crossing", "bridge", "water", "gate", "crossroad", "landmark"]}
        destroys: [heart]
        forms: {"past": "was crushed by something that fell from the sky", "present": "is being crushed by something falling from the sky", "imminent": "is about to be crushed by something that will fall from the sky"}
      - id: act_stopped
        label: "Stopped"
        targets: [lifeline, key_place, heart]
        fits: {"lifeline": ["water", "passage", "creatures", "crop"], "key_place": ["crossing", "water", "crossroad", "network"]}
        forms: {"past": "stopped", "present": "is stopping", "imminent": "is about to stop"}
      - id: act_opened
        label: "Opened"
        targets: [remnant, key_place, thin_place]
        fits: {"remnant": ["city", "structure", "body", "object", "source", "rift"], "key_place": ["gate", "descent", "network", "landmark"]}
        forms: {"past": "opened", "present": "is opening", "imminent": "is about to open"}
      - id: act_closed
        label: "Closed"
        bars_scars_on_target: {thin_place: [scar_plane_thinned]}   # owner, 2026-09-28: all ways closed, no thinner border
        targets: [lifeline, key_place, thin_place]
        fits: {"lifeline": ["water", "passage", "mine"], "key_place": ["crossing", "bridge", "gate", "descent", "network"]}
        forms: {"past": "closed", "present": "is closing", "imminent": "is about to close"}
      - id: act_merged_with_plane
        label: "Merged with a plane"
        targets: [key_place, heart, thin_place]
        fits: {"key_place": ["gate", "descent", "crossroad", "network", "landmark"]}
        forms: {"past": "merged with a plane", "present": "is merging with a plane", "imminent": "is about to merge with a plane"}
        hooks:
          - {phase: P2, must: "this row's plane is chosen among the touched planes; the planes the foundation names are shared to fit the scale's count"}
      - id: act_true_face
        label: "Showed its true face"
        targets: [lifeline, remnant, key_place]
        fits: {"lifeline": ["water", "creatures", "mine", "treaty"], "remnant": ["network", "structure", "city", "body", "wasteland", "machine", "object", "source", "rift"], "key_place": ["bridge", "water", "gate", "descent", "landmark"]}
        forms: {"past": "showed its true face", "present": "is showing its true face", "imminent": "is about to show its true face"}
      - id: act_turned_on_keepers
        label: "Turned on its keepers"
        targets: [lifeline, remnant, role]
        fits: {"lifeline": ["creatures", "treaty"], "remnant": ["network", "structure", "body", "machine", "object"]}
        forms: {"past": "turned on its keepers", "present": "is turning on its keepers", "imminent": "is about to turn on its keepers"}
      - id: act_spread_unbounded
        label: "Spread without bound"
        targets: [lifeline, remnant, thin_place]
        fits: {"lifeline": ["water", "creatures", "crop"], "remnant": ["wasteland", "source", "rift"]}
        forms: {"past": "spread without bound", "present": "is spreading without bound", "imminent": "is about to spread without bound"}
      - id: act_migrated
        label: "Moved away"
        targets: [lifeline, heart, role]
        fits: {"lifeline": ["passage", "creatures", "treaty"]}
        destroys: [heart, role]
        forms: {"past": "migrated away", "present": "is migrating away", "imminent": "is about to migrate away"}
      - id: act_burned
        leaves_ruins: true              # owner, 2026-09-28: a destroyed heart leaves ruins to start in
        label: "Burned"
        targets: [lifeline, key_place, heart]
        fits: {"lifeline": ["passage", "mine", "crop", "craft"], "key_place": ["crossing", "bridge", "gate", "crossroad", "network", "landmark"]}
        destroys: [heart]
        forms: {"past": "burned", "present": "is burning", "imminent": "is about to burn"}
      - id: act_rose
        label: "Rose"
        winner_is_target_role: true     # owner, 2026-09-28: a role that rose is the break's winner
        targets: [remnant, key_place, heart, role]
        fits: {"remnant": ["city", "structure", "body", "machine", "object"], "key_place": ["crossing", "water", "crossroad", "landmark"]}
        forms: {"past": "rose", "present": "is rising", "imminent": "is about to rise"}
      - id: act_sank
        leaves_ruins: true              # owner, 2026-09-28: a destroyed heart leaves ruins to start in
        label: "Sank"
        targets: [remnant, key_place, heart]
        fits: {"remnant": ["network", "structure", "city", "body", "object"], "key_place": ["crossing", "bridge", "gate", "crossroad", "landmark"]}
        destroys: [heart]
        forms: {"past": "sank", "present": "is sinking", "imminent": "is about to sink"}
      - id: act_twinned
        label: "Was twinned"
        targets: [lifeline, heart, thin_place]
        fits: {"lifeline": ["water", "passage", "mine"]}
        forms: {"past": "was twinned", "present": "is being twinned", "imminent": "is about to be twinned"}
      - id: act_forgotten
        label: "Was forgotten"
        targets: [remnant, heart, role]
        fits: {"remnant": ["network", "structure", "city", "object", "source"]}
        destroys: [heart, role]
        forms: {"past": "was forgotten", "present": "is being forgotten", "imminent": "is about to be forgotten"}
      - id: act_gave_birth
        concretise: true                # owner, 2026-09-28: step 2's writer names what fell / what was born (a promise)
        label: "Gave birth to something new"
        targets: [lifeline, remnant, thin_place]
        fits: {"lifeline": ["water", "creatures", "mine"], "remnant": ["body", "wasteland", "source", "rift"]}
        forms: {"past": "gave birth to something new", "present": "is giving birth to something new", "imminent": "is about to give birth to something new"}

  scar:
    roll:
      avoid_used: false
      row_wait: 3
      count_by_scale: {short: 1, standard: 2, epic: 3}
      note: "every scar is a column: `floors` are the phases it lands on; a scar that brings a fantastic kind counts toward the palette's cap and is excluded when the cap is full (owner, 2026-09-28)"
    rows:
      - id: scar_new_land_kind
        label: "A new kind of land on the map"
        floors: [P1, P3]
        requires: {dial: {magic: [medium, high]}}
        needs_fantastic_room: true
        text: {"name": "a new kind of place on the map", "name_note": "from the fantastic palette"}
        hooks:
          - {phase: P1, must: "a fantastic kind joins the palette"}
          - {phase: P3, must: "the kind is a map node"}
      - id: scar_roads_changed
        label: "The roads changed"
        floors: [P3]
        text: {"name": "the changing of the roads"}
        hooks:
          - {phase: P3, must: "the map's edges and main line show the change"}
      - id: scar_cursed_belt
        label: "A poisoned or cursed belt"
        floors: [P3, P6]
        text: {"name": "a poisoned or cursed belt"}
        hooks:
          - {phase: P3, must: "a region or belt is poisoned or cursed"}
          - {phase: P6, must: "a site and its creatures stand in it"}
      - id: scar_unreachable_region
        label: "An unreachable region"
        floors: [P3, P7]
        note: "a later act opens it (P7)"
        text: {"name": "an unreachable region"}
        hooks:
          - {phase: P3, must: "a region is marked closed"}
          - {phase: P7, must: "a later act opens it"}
      - id: scar_magic_rule_changed
        label: "A rule of magic changed"
        floors: [P1, P2]
        note: "the phenomenon signature is this rule: its home becomes the break and its rule comes from family 8 (review #6)"
        text: {"name": "a rule of magic changed"}
        hooks:
          - {phase: P1, must: "the phenomenon signature is this rule"}
          - {phase: P2, must: "the magic system carries it"}
      - id: scar_god_changed
        label: "A god changed"
        floors: [P2]
        text: {"name": "a god changed"}
        hooks:
          - {phase: P2, must: "that god is changed in the pantheon"}
      - id: scar_plane_thinned
        label: "The border with a plane grew thin"
        floors: [P2]
        text: {"name": "the border with a plane grew thin"}
        hooks:
          - {phase: P2, must: "the touched plane's border is thin; this row's plane is chosen among the touched planes; the planes the foundation names are shared to fit the scale's count"}
      - id: scar_sky_changed
        requires: {dial: {era: [medieval, renaissance, ancient, nautical]}}   # not below ground: the sky is seldom seen there
        label: "The sky changed"
        floors: [P2]
        text: {"name": "the sky changed"}
        hooks:
          - {phase: P2, must: "the calendar carries the change"}
      - id: scar_seasons_broken
        requires: {dial: {era: [medieval, renaissance, ancient, nautical]}}   # not below ground: the sky is seldom seen there
        label: "The seasons broke"
        floors: [P2]
        text: {"name": "the seasons broke"}
        hooks:
          - {phase: P2, must: "the climate and the calendar carry the change"}
      - id: scar_time_flow_changed
        label: "Time's flow changed in a region"
        floors: [P2, P3]
        text: {"name": "the flow of time changed in a region", "name_note": "fast or slow"}
        hooks:
          - {phase: P2, must: "a magic or plane rule names it"}
          - {phase: P3, must: "the region where time runs differently"}
      - id: scar_people_displaced
        label: "A people was driven from its home"
        floors: [P3, P5]
        text: {"name": "a people was driven from its home"}
        hooks:
          - {phase: P3, must: "a refugee settlement"}
          - {phase: P5, must: "NPCs of that people"}
      - id: scar_new_people
        label: "A new people appeared"
        floors: [P1, P5]
        note: "the people signature may be this people (its home becomes the scar)"
        text: {"name": "a new people appeared", "name_note": "those the break transformed"}
        hooks:
          - {phase: P1, must: "the people signature may be this people"}
          - {phase: P5, must: "NPCs of that people"}
      - id: scar_state_fell
        label: "A state fell and left a void"
        floors: [P3, P4]
        text: {"name": "a state fell, a void was left in its place"}
        hooks:
          - {phase: P3, must: "one polity's status is fallen; the fallen state is never the polity a seated contest role rules, and P3 names it"}
          - {phase: P4, must: "a faction wants the void"}
      - id: scar_creatures_changed
        label: "Living things changed"
        floors: [P6]
        text: {"name": "living things changed"}
        hooks:
          - {phase: P6, must: "the creature ecology carries the change"}
      - id: scar_new_resource
        label: "A new resource was born"
        floors: [P3, P4]
        note: "a contest with a 'new' prize may take it"
        text: {"name": "a new resource was born"}
        hooks:
          - {phase: P3, must: "the goods hold the new resource"}
          - {phase: P4, must: "the contest's prize, when the prize is `new`, is this resource"}
      - id: scar_lost_knowledge
        label: "A knowledge or craft was lost"
        floors: [P3, P6]
        note: "P6's ruins keep it"
        text: {"name": "a knowledge or a craft was lost"}
        hooks:
          - {phase: P3, must: "a trade or good is missing"}
          - {phase: P6, must: "a ruin keeps it"}
      - id: scar_new_taboo
        label: "A new law or taboo"
        floors: [P1, P3]
        note: "one trope break is drawn from the prohibition rows (step 2)"
        text: {"name": "a new ban or taboo"}
        hooks:
          - {phase: P1, must: "one trope break is drawn from the prohibition rows"}
          - {phase: P3, must: "the law carries the taboo"}
      - id: scar_new_belief
        label: "A new belief"
        floors: [P2, P4]
        note: "a side; the institution practice 'they interpret the break' may join it"
        text: {"name": "a new belief", "name_note": "a side"}
        hooks:
          - {phase: P2, must: "the belief has its place in the pantheon"}
          - {phase: P4, must: "a faction holds it"}
  time:
    roll: {avoid_used: false}
    hooks_common:
      - {phase: P2, must: "the break's dated event sits at this time"}
      - {phase: P7, must: "the arc's opening follows the break's time"}
    rows:
      - id: time_just_now
        label: "Just now"
        tense: past
        meaning: "the game begins right after the break"
        text: {"name": "just now", "name_note": "play begins right after the break"}
      - id: time_generation_ago
        label: "A generation ago"
        tense: past
        meaning: "the world has been rebuilt around the wound"
        text: {"name": "a generation ago", "name_note": "the world has been rebuilt around the scar"}
      - id: time_unfolding
        label: "Unfolding"
        tense: present
        meaning: "the break unfolds through the campaign"
        text: {"name": "happening now", "name_note": "the break unfolds over the course of the campaign"}
      - id: time_coming
        conflicts_with: [scar_new_people, scar_magic_rule_changed]   # a break still coming has no products yet
        label: "Coming"
        tense: imminent
        meaning: "signs are seen; the campaign is a race against it"
        text: {"name": "approaching", "name_note": "the signs are being seen, the campaign is a race against it"}

  # ── 7. the escalation: D&D's four tiers of play are the break's steps ───────────────────────────
  escalation_tier:
    roll:
      avoid_used: false
      note: "not rolled: the steps are the tiers the campaign's level band touches (short 1-2, standard 3, epic 4)"
    hooks_common:
      - {phase: P7, must: "the arc climbs one step per tier: the party meets the break as a local symptom and ends at its heart"}
      - {phase: P1, must: "the secret's last clue sits on the top step; the villain shows its works and people at the first step, itself at the top"}
    rows:
      - id: tier_local
        label: "Local (levels 1-4)"
        levels: [1, 4]
        text: {"name": "local"}
      - id: tier_regional
        label: "Regional (levels 5-10)"
        levels: [5, 10]
        text: {"name": "regional"}
      - id: tier_continental
        label: "Continental (levels 11-16)"
        levels: [11, 16]
        text: {"name": "continental"}
      - id: tier_world
        label: "The world and the planes (levels 17-20)"
        levels: [17, 20]
        text: {"name": "the world and the planes"}
