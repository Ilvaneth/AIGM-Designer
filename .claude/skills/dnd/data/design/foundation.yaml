  # ── 5. the contest: the campaign's old fault line (8 families, 40) ────────────────────────────────
  contest:
    roll:
      avoid_used: true
      family_wait: 3
      roles_by_scale: {short: [a, b, third], standard: [a, b, third, fourth], epic: [a, b, third, fourth]}
      contests_by_scale: {short: 1, standard: 1, epic: 2}
      note: >-
        epic draws a second contest of three roles (a, b, third) from another family, seated on another part
        of the spine. `seats` override the default (a and b at the spine's two ends); `hint` is the P4 faction
        archetype a role suggests (the institution signature is drawn only from a hinted role, review #5);
        `prize` is lifeline, heart, remnant, new, or the thin place (only with the thin place in the palette); the villain is no side by default.
    hooks_common:
      - {phase: P4, must: "each role is a faction of its hinted archetype; every other faction takes a stance on the contest"}
      - {phase: P4, must: "the escalation's steps are the factions' provocation rungs, first spark to the hardest form"}
      - {phase: P1, must: "the question's two poles sit on sides a and b; the break's winner is one of the roles"}
      - {phase: P7, must: "the contest's escalation climbs with the arc"}
    rows:
      - id: contest_two_heirs
        claims: {nobility: exists, rule: hereditary}
        label: "Two heirs, a regent at the heart"
        family: two_hands
        prize: heart
        seats: {"third": "heart"}
        roles:
          a: {text: "the elder heir", hint: state}
          b: {text: "the younger heir and their army", hint: martial}
          third: {text: "the regent who holds the crown and the treasury", hint: state}
          fourth: {text: "a foreign kingdom that wants the throne", hint: null}
        escalation: ["the coronation date", "civil war"]
        text: {"name": "two heirs", "name_note": "the regent at the heart"}
      - id: contest_one_harbour
        label: "Two cities, one harbour"
        family: two_hands
        prize: lifeline
        seats: {"a": "beside_key_place", "b": "beside_key_place"}
        roles:
          a: {text: "the old harbour city", hint: guild}
          b: {text: "the newly founded rival city", hint: trade}
          third: {text: "the smugglers who use the harbour", hint: criminal}
          fourth: {text: "the sailors' guild", hint: null}
        requires: {all: [{any_of: ["land_coast"]}, {any_of: [life_natural_harbour, life_strait_crossing, life_shipbuilding, life_fish_run, life_oyster_beds, life_sea_folk_hunt, life_dye_sources, life_amber_shores]}]}   # the palette, and a lifeline the prize can be
        weight_by: [{when: {any_of: [life_natural_harbour, life_strait_crossing, life_shipbuilding, life_fish_run, life_oyster_beds, life_sea_folk_hunt, life_dye_sources, life_amber_shores]}, x: 3}]
        escalation: ["seizing of ships", "coastal war"]
        text: {"name": "two cities that want the same harbour", "name_note": "on either side of the key place"}
      - id: contest_one_pasture
        label: "Two peoples, one pasture"
        family: two_hands
        prize: lifeline
        roles:
          a: {text: "the herd-owning highland clans", hint: martial}
          b: {text: "the lowland villages widening their fields", hint: state}
          third: {text: "the merchants selling horses and weapons to both sides", hint: trade}
          fourth: {text: "the keepers of the holy place in the middle of the pasture", hint: religious}
        requires: {all: [{any_of: ["land_highland", "land_plain", "land_steppe"]}, {any_of: [life_yak_herds, life_horse_herds, life_deer_migration, life_wheat_plain, life_carpet_weaving, life_leather_armour, life_vineyards, life_flax_fields]}]}   # the palette, and a lifeline the prize can be
        weight_by: [{when: {any_of: [life_yak_herds, life_horse_herds, life_deer_migration, life_wheat_plain, life_carpet_weaving, life_leather_armour, life_vineyards, life_flax_fields]}, x: 3}]
