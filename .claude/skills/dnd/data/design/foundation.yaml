        remnant_kind: structure
        sites: [site_dungeon_planned, site_dungeon_ruin]
        olgu_families: [body_blood, word_sign]
        text: {"name": "the dynasty of sorcerer-kings", "what": "the dynasty that ruled by magic was brought down by its own magic", "remnant": "palace-towers", "remnant_short": "the sorcerer kings' towers", "sites": "towers, experiment vaults, guardian golems", "strangeness": "the magic still recognises the dynasty's blood"}
