# foundation.yaml — P1's first step, the foundation (plan item 25; the owner-approved rows in
# docs/p1-foundation-rows.md, sections 1-6 and 18). A script builds it from these sub-tables with no
# model: the spine first (it forces the landform kinds it needs), then the palette, the ruin source,
# the lifeline, the contest, the break and the escalation. Every seed is a column: its sub-table's
# hooks_common are the promises the later floors inherit (errata 24.2 #23, the promise ledger).
#
# English ids and labels; the approved Turkish phrases are the rows' `tr` fields, self-standing noun
# phrases or clauses the foundation sentence joins with separate words (item 25, step 1 #7).
# The arbiter's fields (conflicts_with, requires, weight_by, family, the roll headers) are described
# in README.md; design_arbiter.py is their only judge.
schema_version: 1
table: foundation
consumed_by: [P1, P2, P3, P4, P5, P6, P7, P8]
plan: "item 25; errata 24.2 #20-25"

# closed lists the rows name (tests/test_foundation_tables.py checks them)
phenomenon_rule_families: [magic_behaviour, body_blood, place_path, matter, time, word_sign, nature_creatures, born_of_break]
key_kinds: [crossing, bridge, water, gate, descent, crossroad, network, landmark]
remnant_kinds: [network, structure, city, body, wasteland, machine, object, source, rift]

tables:

  # ── 1. the palette: the landform kinds (22) ────────────────────────────────────────────────
  palette:
    roll:
      avoid_used: false                 # palettes are never excluded across campaigns
      count_by_scale: {short: [4, 5], standard: [6, 8], epic: [9, 12]}
      fantastic_cap_by_magic: {low: 0, medium: 1, high: 2}   # the thin place is outside the cap at low
      needs: [height, water]            # at least one of each
      note: >-
        the spine's forced kinds come first; the rest are drawn without replacement. One fantastic kind
        born of the ruin source or a scar is exempt from the cap and comes on top of the count (item 25
        review #4).
    hooks_common:
      - {phase: P3, must: "every palette kind lives on at least one map node (short has 1-2 regions against 4-5 kinds)"}
      - {phase: P3, must: "a region's biomes come from its palette kinds' biomes"}
    rows:
      - {id: land_mountain, label: Mountains, height: true, biomes: [biome_high_mountains, biome_foothills], tr: {name: "dağ"}}
      - {id: land_highland, label: Highlands, height: true, biomes: [biome_pine_uplands, biome_grazing_hills, biome_moor], tr: {name: "yayla"}}
      - {id: land_plain, label: Plains, biomes: [biome_river_valley], tr: {name: "ova"}}
      - {id: land_steppe, label: Steppe, biomes: [biome_steppe], tr: {name: "bozkır"}}
      - {id: land_forest, label: Forest, biomes: [biome_old_forest, biome_jungle], tr: {name: "orman"}}
      - {id: land_marsh, label: Marsh, biomes: [biome_fen, biome_salt_marsh], tr: {name: "bataklık"}}
      - {id: land_desert, label: Desert, biomes: [biome_sand_desert, biome_stone_desert, biome_dunes, biome_salt_flats], tr: {name: "çöl"}}
      - {id: land_cold, label: Cold lands, biomes: [biome_tundra], tr: {name: "soğuk topraklar"}}
      - {id: land_volcanic, label: Volcanic land, height: true, biomes: [biome_volcanic], tr: {name: "volkanik"}}
      - {id: land_river, label: River, water: true, biomes: [biome_river_delta, biome_river_valley], tr: {name: "nehir"}}
      - {id: land_lake, label: Lakes, water: true, biomes: [biome_lake_country], tr: {name: "göl"}}
      - id: land_coast
        label: Coast and sea
        water: true
        biomes: [biome_sea_cliffs, biome_salt_marsh]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 2}]
        tr: {name: "kıyı ve deniz"}
      - id: land_island
        label: Islands
        implies: [land_coast]
        biomes: [biome_sea_cliffs, biome_salt_marsh]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 2}]
        tr: {name: "ada"}
      - id: land_underground
        label: The underground
        biomes: [biome_caverns, biome_fungus_deeps]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "yeraltı"}
      # fantastic (8): gated by the magic dial; only the thin place at low
      - {id: land_floating_isles, label: Floating isles, fantastic: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "yüzen adalar", what: "havada asılı kayalar ve üstlerindeki köyler"}}
      - {id: land_crystal_forest, label: Crystal forest, fantastic: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "kristal orman", what: "ağaçları kristalden bir orman"}}
      - {id: land_stone_sea, label: Petrified sea, fantastic: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "taşlaşmış deniz", what: "dalgaları taş kesilmiş, üstünde yürünen bir deniz"}}
      - {id: land_giant_bones, label: Giant's bones, fantastic: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "dev kemikleri", what: "bir titanın iskeletinin üstünde ve içinde kurulmuş toprak"}}
      - {id: land_sky_river, label: River into the sky, fantastic: true, water: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "göğe akan nehir", what: "yukarı doğru akan, havada bir su yolu"}}
      - {id: land_glass_desert, label: Glass desert, fantastic: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "cam çölü", what: "eski bir büyü savaşının camlaştırdığı kum"}}
      - {id: land_giant_fungus, label: Giant fungus forest, fantastic: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "dev mantar ormanı", what: "yüzeyde, ağaç boyu mantarlar"}}
      - id: land_thin_place
        label: Thin place
        fantastic: true
        thin_place: true
        tr: {name: "ince yer", what: "bir düzlemin dünyaya değdiği yer; düzlemi P2 seçer"}
        hooks:
          - {phase: P2, must: "the thin place's plane is chosen and touched"}

  # ── 2. the spine: the world's skeleton (6 families, 30) ─────────────────────────────────────
  spine:
    roll:
      avoid_used: true
      family_wait: 3
      note: "rolled before the palette; `forces` puts the kinds it needs into the palette (item 25 review #2); `forces_one_of` puts one of them"
    hooks_common:
      - {phase: P3, must: "the map's main line follows the spine's travel; the heart, both ends and the key place are map nodes"}
      - {phase: P3, must: "the palette's kinds are spread over the spine's pieces; the two ends take different kinds"}
      - {phase: P4, must: "the contest's two sides sit at the spine's two ends unless the contest row places them"}
      - {phase: P6, must: "the site distribution follows the spine: the key place and the ends each hold or border a site"}
    rows:
      # 1. single line
      - id: spine_river_to_sea
        label: A river from source to sea
        family: line
        key_kind: crossing
        forces: [land_river, land_mountain, land_coast]
        weight_by: [{when: {dial: {scale: [epic]}}, x: 2}]
        tr: {name: "kaynaktan denize bir nehir", heart: "orta akıştaki köprü-şehir", ends: ["kaynaktaki dağ halkları", "deltadaki liman"], key_place: "nehrin tek geçilebilir sığlığı", travel: "nehir boyunca aşağı ve yukarı, mavnayla ve yoldan"}
      - id: spine_great_rift
        label: A great rift
        family: line
        key_kind: descent
        forces: [land_highland]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "dev bir yarık", heart: "iki yakayı bağlayan köprü", ends: ["yarığın tabanı", "kenarlardaki yaylalar"], key_place: "köprü ya da tabana inen merdiven", travel: "kenarlar boyunca ve aşağıya iniş"}
      - id: spine_mountain_passes
        label: Passes along a range
        family: line
        key_kind: crossing
        forces: [land_mountain]
        weight_by: [{when: {dial: {scale: [epic]}}, x: 2}]
        tr: {name: "sıradağ boyunca geçitler", heart: "en büyük geçitteki kale-şehir", ends: ["dağın yağmur alan yamacı", "kurak yamacı"], key_place: "ana geçit", travel: "geçitten geçide, mevsime bağlı"}
      - id: spine_long_coast
        label: A long coastline
        family: line
        key_kind: landmark
        forces: [land_coast]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 3}]
        tr: {name: "uzun bir kıyı şeridi", heart: "büyük liman", ends: ["bir uçta buzul fiyortları", "öbür uçta sıcak koylar"], key_place: "kıyıyı ikiye bölen burun", travel: "gemiyle kıyı boyunca; kara yolunu dağlar keser"}
      - id: spine_barren_corridor
        label: A barren corridor
        family: line
        key_kind: water
        forces_one_of: [land_desert, land_steppe]
        tr: {name: "çorak koridor", heart: "koridorun ortasındaki han-şehir", ends_both: "koridorun iki ucundaki iki uygarlık", key_place: "yoldaki tek su kaynağı", travel: "konaktan konağa, suya bağlı"}
      # 2. centred
      - id: spine_lake_basin
        label: A mountain-ringed basin with a lake
        family: centred
        key_kind: gate
        forces: [land_mountain, land_lake]
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "dağlarla çevrili çanak, ortasında göl", heart: "göldeki ada-şehir", ends: ["verimli havza", "dağların ötesindeki bilinmeyen"], key_place: "havzadan çıkan tek geçit", travel: "göl üstünden ve kıyı yollarından içeri doğru"}
      - id: spine_lone_mountain
        label: One giant mountain
        family: centred
        key_kind: descent
        forces: [land_mountain]
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "tek dev dağ", heart: "yamaçtaki en büyük şehir", ends: ["zirve", "etek"], key_place: "zirveye çıkan yol ya da dağın içine inen ağız", travel: "halkalar halinde yukarı ve aşağı"}
      - id: spine_star_crater
        label: The crater of a fallen stone
        family: centred
        key_kind: descent
        landmark: crater                 # a P3 landmark, not a palette kind (review #4)
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "gökten düşen bir taşın krateri", heart: "kraterin ortasındaki taş", ends: ["krater içi (değişmiş)", "krater dışı"], key_place: "kenardan inen tek yol", travel: "kenardan merkeze"}
        hooks:
          - {phase: P3, must: "the crater is a landmark and the heart's node"}
      - id: spine_oasis_ring
        label: An oasis and its ring
        family: centred
        key_kind: water
        forces: [land_desert]
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "vaha ve çevresindeki halka", heart: "vaha", ends: ["vaha", "çölün öbür yakası"], key_place: "vahanın suyu", travel: "vahadan dışa seferler; geri dönmek zorunlu"}
      - id: spine_crossroads
        label: Four roads meeting
        family: centred
        key_kind: crossroad
        tr: {name: "dört yol ağzı", heart: "kavşak şehri", ends_both: "dört yöndeki dört farklı iklim ve ülke", key_place: "kavşağın kendisi", travel: "merkezden dışa, dört koldan"}
      # 3. fragmented
      - id: spine_archipelago
        label: An archipelago
        family: fragmented
        key_kind: crossing
        forces: [land_island, land_coast]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 3}]
        tr: {name: "takımadalar", heart: "en büyük ada", ends: ["iç adalar", "uzak ve vahşi dış adalar"], key_place: "adaları bağlayan tek güvenli boğaz", travel: "adadan adaya gemiyle, mevsime bağlı"}
      - id: spine_valley_maze
        label: A maze of valleys
        family: fragmented
        key_kind: network
        forces: [land_mountain]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "vadiler labirenti", heart: "en geniş vadi", ends_both: "birbirinden dağlarla ayrılmış, her biri başka bir halkın vadisi", key_place: "vadileri bağlayan tüneller ve geçitler", travel: "geçitlerden; her vadi ayrı bir dünya"}
      - id: spine_forest_clearings
        label: Clearings in an endless forest
        family: fragmented
        key_kind: network
        forces: [land_forest]
        tr: {name: "sonsuz ormanın açıklıkları", heart: "en büyük açıklık", ends: ["açıklıklar", "ormanın derinliği"], key_place: "açıklıkları bağlayan patikalar", travel: "açıklıktan açıklığa, yolsuz"}
      - id: spine_mesa_land
        label: A land of mesas
        family: fragmented
        key_kind: bridge
        forces_one_of: [land_desert, land_highland]
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "mesa ülkesi", heart: "en büyük masa dağın üstündeki şehir", ends: ["yaşanan mesa tepeleri", "aradaki vahşi kanyonlar"], key_place: "mesaları bağlayan köprüler ve ip yollar", travel: "mesadan mesaya, kanyonlara iniş"}
      - id: spine_lake_chain
        label: A chain of lakes
        family: fragmented
        key_kind: crossing
        forces: [land_lake]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "göller zinciri", heart: "iki gölü bağlayan boğazdaki şehir", ends_both: "zincirin iki ucundaki göller", key_place: "göller arasındaki boğaz", travel: "gölden göle, suyla"}
      # 4. layered
      - id: spine_three_depths
        label: Surface, middle depth and the deep
        family: layered
        key_kind: descent
        forces: [land_underground]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "yüzey, orta derinlik ve derin", heart: "orta katmandaki şehir", ends: ["yüzey", "en derin katman"], key_place: "katmanları bağlayan büyük kuyu ya da kaldırgaç", travel: "aşağı ve yukarı"}
      - id: spine_terraces
        label: Terraces
        family: layered
        key_kind: descent
        forces: [land_highland, land_plain]
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "basamaklar", heart: "orta terastaki şehir", ends: ["en üstteki yayla", "en alttaki ova"], key_place: "teraslar arası merdivenler ve şelaleler", travel: "basamak basamak"}
      - id: spine_two_worlds
        label: Two worlds, one over the other
        family: layered
        key_kind: network
        forces: [land_thin_place]
        requires: {dial: {magic: [medium, high]}}
        tr: {name: "üst üste iki dünya", heart: "iki dünyanın örtüştüğü şehir", ends: ["bizim dünya", "öbür düzlem"], key_place: "geçiş noktaları", travel: "iki katman arasında gidip gelme"}
      - id: spine_mountain_within
        label: The mountain's inside and outside
        family: layered
        key_kind: gate
        forces: [land_mountain, land_underground]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "dağın içi ve dışı", heart: "dağın içindeki şehir", ends: ["dağın dışı", "dağın içi"], key_place: "dağın kapıları", travel: "kapılardan içeri ve dışarı"}
      - id: spine_above_below_sea
        label: Above and below the sea
        family: layered
        key_kind: network
        forces: [land_coast]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 3}]
        tr: {name: "deniz üstü ve deniz altı", heart: "kıyı şehri ya da bir resif", ends: ["kıyı halkı", "deniz altı halkları"], key_place: "sualtı mağaraları", travel: "dalış ve sualtı yolları"}
      # 5. frontier
      - id: spine_peninsula
        label: A peninsula
        family: frontier
        key_kind: crossing
        forces: [land_coast]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 3}, {when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "yarımada", heart: "boyuna yakın şehir", ends: ["yarımadanın ucu", "anakara"], key_place: "boyun, tek kara geçişi", travel: "yarımadanın içinde; dışarı boyundan ya da denizden"}
      - id: spine_strait_two_continents
        label: A strait and two continents
        family: frontier
        key_kind: crossing
        forces: [land_coast]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 3}, {when: {dial: {scale: [epic]}}, x: 2}]
        tr: {name: "boğaz ve iki kıta", heart: "iki yakadaki ikiz şehir", ends_both: "iki kıta", key_place: "boğaz", travel: "boğazı geçmek, iki kıyı boyunca gitmek"}
      - id: spine_long_wall
        label: A border along a long wall
        family: frontier
        key_kind: gate
        tr: {name: "uzun bir sur boyunca sınır", heart: "surun ana kapısı", ends: ["surun içi", "dışı"], key_place: "kapılar", travel: "sur boyunca ve kapılardan dışarı"}
      - id: spine_climate_belt
        label: A climate belt
        family: frontier
        key_kind: crossing
        forces: [land_cold, land_desert]
        weight_by: [{when: {dial: {scale: [epic]}}, x: 2}]
        tr: {name: "iklim kuşağı", heart: "kuşağın ortasındaki şehir", ends: ["donmuş kuzey", "kavrulan güney"], key_place: "kuşağın daraldığı yer", travel: "kuşak boyunca doğu-batı, kenarlara seferler"}
      - id: spine_edge_of_civilisation
        label: The edge of civilisation
        family: frontier
        key_kind: gate
        weight_by: [{when: {dial: {scale: [epic]}}, x: 2}]
        tr: {name: "uygarlığın kenarı", heart: "son büyük şehir", ends: ["bilinen topraklar", "haritasız vahşi"], key_place: "sınır kalesi ya da son köprü", travel: "sınırdan vahşiye doğru"}
      # 6. fantastic
      - id: spine_titan_back
        label: A titan's back
        family: fantastic
        key_kind: descent
        requires: {dial: {magic: [high]}}
        tr: {name: "bir titanın sırtı", heart: "sırttaki şehir", ends: ["baş", "kuyruk"], key_place: "canlının içine inen yol", travel: "sırt boyunca"}
      - id: spine_floating_archipelago
        label: A floating archipelago
        family: fantastic
        key_kind: network
        forces: [land_floating_isles]
        requires: {dial: {magic: [high]}}
        tr: {name: "yüzen takımada", heart: "en büyük yüzen ada", ends: ["yüksek adalar", "yere yakın adalar"], key_place: "adaları bağlayan zincirler ve rüzgâr yolları", travel: "uçan gemiler ve köprüler"}
      - id: spine_void_ring
        label: A ring around a bottomless void
        family: fantastic
        key_kind: bridge
        requires: {dial: {magic: [medium, high]}}
        tr: {name: "dipsiz bir boşluğun çevresindeki halka", heart: "boşluğa bakan şehir", ends_both: "halkanın iki karşı yakası", key_place: "boşluğun üstündeki tek köprü", travel: "halka boyunca ya da köprüden"}
      - id: spine_giant_tree
        label: One giant tree, mountain-tall
        family: fantastic
        key_kind: landmark
        forces: [land_forest]
        requires: {dial: {magic: [medium, high]}}
        tr: {name: "tek dev ağaç (dağ boyunda)", heart: "gövdedeki şehir", ends: ["dallardaki ülke", "köklerdeki ülke"], key_place: "gövde", travel: "yukarı dallara, aşağı köklere"}
        hooks:
          - {phase: validator, must: "the giant tree is no 'world tree'; nothing in it refers to a real-world mythology (errata #19)"}
      - id: spine_world_edge
        label: The edge of the world
        family: fantastic
        key_kind: descent
        requires: {dial: {magic: [medium, high]}}
        tr: {name: "dünyanın kenarı", heart: "uçurumun kenarındaki şehir", ends: ["iç topraklar", "uçurumun ötesindeki bulut denizi"], key_place: "kenardan aşağı inen tek yol", travel: "kenara doğru ve aşağıya"}

  # ── 3. the ruin source: what left the dangerous places (8 families, 40) ────────────────────
  ruin_source:
    roll:
      avoid_used: true
      family_wait: 3
      note: >-
        `sites` are sites.yaml's types the remnant yields (P6); `olgu_families` are the 2-3 families of
        the phenomenon rule its strangeness fits (item 25 review #6; family 8, born of the break, only
        with the scar); `remnant_kind` feeds the break's compatibility; `adds_palette` / `adds_biome` /
        `landmark` are what the row brings to the map.
    hooks_common:
      - {phase: P2, must: "one age of the history is this fall, told from its `what` line"}
      - {phase: P6, must: "the remnant's sites come from the row's `sites` types; at least one site stands in the remnant"}
      - {phase: P1, must: "unless the scar changed a magic rule, the phenomenon signature's home is this strangeness"}
    rows:
      # 1. fallen kingdoms
      - id: ruin_road_kingdom
        label: The road-building kingdom
        family: fallen_kingdoms
        remnant_kind: network
        sites: [site_stronghold, site_dungeon_ruin, site_dungeon_planned]
        olgu_families: [place_path, word_sign]
        tr: {name: "yol yapan krallık", what: "ülkeyi taş yollarla ve kalelerle ören krallık iç savaşla çöktü", remnant: "taş yol ağı ve yol kaleleri", sites: "yol kaleleri, köprü kuleleri, gömülü hazine odaları", strangeness: "eski yollar yürüyeni hâlâ bir yere götürüyor"}
      - id: ruin_water_kingdom
        label: The water kingdom
        family: fallen_kingdoms
        remnant_kind: network
        sites: [site_dungeon_planned, site_dungeon_ruin]
        olgu_families: [matter, magic_behaviour, place_path]
        tr: {name: "su krallığı", what: "sarnıçlar ve su kemerleri kuran krallık suyunu kaybedince dağıldı", remnant: "su kemerleri ve sarnıçlar", sites: "sarnıçlar, kanallar, bent odaları", strangeness: "suyu yönlendiren eski büyü hâlâ çalışıyor"}
      - id: ruin_sorcerer_kings
        label: The sorcerer-king dynasty
        family: fallen_kingdoms
        remnant_kind: structure
        sites: [site_dungeon_planned, site_dungeon_ruin]
        olgu_families: [body_blood, word_sign]
        tr: {name: "büyücü-krallar hanedanı", what: "büyüyle yöneten hanedan kendi büyüsüyle yıkıldı", remnant: "saray-kuleler", sites: "kuleler, deney mahzenleri, bekçi golemleri", strangeness: "büyü hâlâ hanedanın kanını tanıyor"}
      - id: ruin_city_states
        label: The city-states
        family: fallen_kingdoms
        remnant_kind: city
        adds_biome: biome_dead_city_lands
