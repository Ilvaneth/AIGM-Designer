# foundation.yaml — P1's first step, the foundation (plan item 25; the owner-approved rows in
# docs/p1-foundation-rows.md, sections 1-6 and 18). A script builds it from these sub-tables with no
# model: the spine first (it forces the landform kinds it needs), then the palette, the ruin source,
# the lifeline, the contest, the break and the escalation. Every seed is a column: its sub-table's
# hooks_common are the promises the later floors inherit (errata 24.2 #23, the promise ledger).
#
# English ids and labels; the approved Turkish phrases are the rows' `tr` fields, self-standing noun
# phrases or clauses the foundation sentence joins with separate words (item 25, step 1 #7).
# The arbiter's fields (conflicts_with, requires, weight_by, family, the roll headers) are described
# in README.md; design_arbiter.py is their only judge.
schema_version: 1
table: foundation
consumed_by: [P1, P2, P3, P4, P5, P6, P7, P8]
plan: "item 25; errata 24.2 #20-25"

# closed lists the rows name (tests/test_foundation_tables.py checks them)
phenomenon_rule_families: [magic_behaviour, body_blood, place_path, matter, time, word_sign, nature_creatures, born_of_break]
key_kinds: [crossing, bridge, water, gate, descent, crossroad, network, landmark]
remnant_kinds: [network, structure, city, body, wasteland, machine, object, source, rift]
# the palette kinds a key place of each kind can stand on (build item 6b); crossroad, network and landmark take any
key_kind_lands:
  crossing: [land_river, land_lake, land_coast, land_island, land_mountain, land_highland, land_sky_river]
  bridge: [land_mountain, land_highland, land_river, land_volcanic, land_desert, land_floating_isles]
  water: [land_river, land_lake, land_coast, land_desert, land_steppe, land_sky_river]
  gate: [land_mountain, land_highland, land_underground, land_volcanic, land_plain, land_steppe, land_river]   # a river gate, the last bridge
  descent: [land_mountain, land_highland, land_underground, land_volcanic, land_river]   # waterfall stairs

tables:

  # ── 1. the palette: the landform kinds (22) ────────────────────────────────────────────────
  palette:
    roll:
      avoid_used: false                 # palettes are never excluded across campaigns
      count_by_scale: {short: [4, 5], standard: [6, 8], epic: [9, 12]}
      fantastic_cap_by_magic: {low: 0, medium: 1, high: 2}   # `cap_exempt` rows (the thin place) never count
      needs: [height, water]            # at least one of each
      forces_by_dial: {era: {underground: [land_underground]}}   # owner, 2026-09-28: underground is never optional there
      note: >-
        the spine's and the dial's forced kinds come first; the rest are drawn without replacement. The one
        fantastic kind the ruin source brings (`adds_palette`) comes on top of the count (+1), skips the
        kind's own magic requirement and is exempt from the cap; only one is exempt. A fantastic kind a scar
        brings counts toward the cap, and a scar whose kind the full cap cannot take is excluded by requires
        (item 25 review #4; owner, 2026-09-28).
    hooks_common:
      - {phase: P3, must: "every palette kind lives on at least one map node (short has 1-2 regions against 4-5 kinds)"}
      - {phase: P3, must: "a region's biomes come from its palette kinds' biomes"}
    rows:
      - {id: land_mountain, label: Mountains, height: true, biomes: [biome_high_mountains, biome_foothills], tr: {name: "dağ"}}
      - {id: land_highland, label: Highlands, height: true, biomes: [biome_pine_uplands, biome_grazing_hills, biome_moor], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "yayla"}}
      - {id: land_plain, label: Plains, biomes: [biome_river_valley], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "ova"}}
      - {id: land_steppe, label: Steppe, biomes: [biome_steppe], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "bozkır"}}
      - {id: land_forest, label: Forest, biomes: [biome_old_forest, biome_jungle], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "orman"}}
      - {id: land_marsh, label: Marsh, biomes: [biome_fen, biome_salt_marsh], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "bataklık"}}
      - {id: land_desert, label: Desert, biomes: [biome_sand_desert, biome_stone_desert, biome_dunes, biome_salt_flats], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "çöl"}}
      - {id: land_cold, label: Cold lands, biomes: [biome_tundra], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "soğuk topraklar"}}
      - {id: land_volcanic, label: Volcanic land, height: true, biomes: [biome_volcanic], tr: {name: "volkanik"}}
      - {id: land_river, label: River, water: true, biomes: [biome_river_delta, biome_river_valley], tr: {name: "nehir"}}
      - {id: land_lake, label: Lakes, water: true, biomes: [biome_lake_country], tr: {name: "göl"}}
      - id: land_coast
        label: Coast and sea
        water: true
        biomes: [biome_sea_cliffs, biome_salt_marsh]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}, {when: {dial: {era: [nautical]}}, x: 2}]
        tr: {name: "kıyı ve deniz"}
      - id: land_island
        label: Islands
        implies: [land_coast]
        biomes: [biome_sea_cliffs, biome_salt_marsh]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}, {when: {dial: {era: [nautical]}}, x: 2}]
        tr: {name: "ada"}
      - id: land_underground
        label: The underground
        biomes: [biome_caverns, biome_fungus_deeps]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "yeraltı"}
      # fantastic (8): gated by the magic dial; only the thin place at low
      - {id: land_floating_isles, label: Floating isles, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "yüzen adalar", what: "havada asılı kayalar ve üstlerindeki köyler"}}
      - {id: land_crystal_forest, label: Crystal forest, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "kristal orman", what: "ağaçları kristalden bir orman"}}
      - {id: land_stone_sea, label: Petrified sea, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "taşlaşmış deniz", what: "dalgaları taş kesilmiş, üstünde yürünen bir deniz"}}
      - {id: land_giant_bones, label: Giant's bones, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "dev kemikleri", what: "bir titanın iskeletinin üstünde ve içinde kurulmuş toprak"}}
      - {id: land_sky_river, label: River into the sky, fantastic: true, water: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "göğe akan nehir", what: "yukarı doğru akan, havada bir su yolu"}}
      - {id: land_glass_desert, label: Glass desert, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], tr: {name: "cam çölü", what: "eski bir büyü savaşının camlaştırdığı kum"}}
      - {id: land_giant_fungus, label: Giant fungus forest, fantastic: true, requires: {dial: {magic: [medium, high]}}, tr: {name: "dev mantar ormanı", what: "yüzeyde, ağaç boyu mantarlar"}}
      - id: land_thin_place
        label: Thin place
        fantastic: true
        thin_place: true
        cap_exempt: true                 # a plane's touch (P2's planes), drawable at every magic level
        tr: {name: "ince yer", what: "bir düzlemin dünyaya değdiği yer; düzlemi P2 seçer"}
        hooks:
          - {phase: P2, must: "the thin place's plane is chosen and touched"}

  # ── 2. the spine: the world's skeleton (6 families, 30) ─────────────────────────────────────
  spine:
    roll:
      avoid_used: true
      family_wait: 3
      note: >-
        rolled before the palette; `forces` puts the kinds it needs into the palette (item 25 review #2);
        `forces_one_of` puts one of them. `parts` are the kinds each piece prefers (an empty list takes any);
        the script lays the palette on them: the key place on a kind its key_kind stands on, the two ends on
        different kinds, the rest along the spine; within a part's list a kind no part holds yet comes first
        (build item 6b). A part's kind is the land around it: two ends of one kind in the prose (the lake chain's
        two lakes) take different lands, and the prose keeps the row's picture (owner, 2026-09-29).
    hooks_common:
      - {phase: P3, must: "the map's main line follows the spine's travel; the heart, both ends and the key place are map nodes"}
      - {phase: P3, must: "the palette's kinds are spread over the spine's pieces; the two ends take different kinds"}
      - {phase: P4, must: "the contest's two sides sit at the spine's two ends unless the contest row places them"}
      - {phase: P6, must: "the site distribution follows the spine: the key place and the ends each hold or border a site"}
    rows:
      # 1. single line
      - id: spine_river_to_sea
        label: A river from source to sea
        family: line
        key_kind: crossing
        parts: {heart: [land_river, land_plain], end_a: [land_mountain], end_b: [land_coast], key_place: [land_river]}
        forces: [land_river, land_mountain, land_coast]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [epic]}}, x: 2}]
        tr: {name: "kaynaktan denize bir nehir", heart: "orta akıştaki köprü-şehir", ends: ["kaynaktaki dağ halkları", "deltadaki liman"], key_place: "nehrin tek geçilebilir sığlığı", travel: "nehir boyunca aşağı ve yukarı, mavnayla ve yoldan"}
      - id: spine_great_rift
        label: A great rift
        family: line
        key_kind: descent
        parts: {heart: [land_highland], end_a: [land_underground, land_forest, land_river, land_marsh], end_b: [land_highland], key_place: [land_highland, land_mountain]}
        forces: [land_highland]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "dev bir yarık", heart: "iki yakayı bağlayan köprü", ends: ["yarığın tabanı", "kenarlardaki yaylalar"], key_place: "köprü ya da tabana inen merdiven", travel: "kenarlar boyunca ve aşağıya iniş"}
      - id: spine_mountain_passes
        label: Passes along a range
        family: line
        key_kind: crossing
        parts: {heart: [land_mountain], end_a: [land_forest, land_highland, land_plain], end_b: [land_desert, land_steppe], key_place: [land_mountain]}
        forces: [land_mountain]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [epic]}}, x: 2}]
        tr: {name: "sıradağ boyunca geçitler", heart: "en büyük geçitteki kale-şehir", ends: ["dağın yağmur alan yamacı", "kurak yamacı"], key_place: "ana geçit", travel: "geçitten geçide, mevsime bağlı"}
      - id: spine_long_coast
        label: A long coastline
        family: line
        key_kind: landmark
        parts: {heart: [land_coast], end_a: [land_cold, land_mountain], end_b: [land_coast], key_place: [land_coast, land_mountain]}
        forces: [land_coast]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {era: [nautical]}}, x: 3}]
        tr: {name: "uzun bir kıyı şeridi", heart: "büyük liman", ends: ["bir uçta buzul fiyortları", "öbür uçta sıcak koylar"], key_place: "kıyıyı ikiye bölen burun", travel: "gemiyle kıyı boyunca; kara yolunu dağlar keser"}
      - id: spine_barren_corridor
        label: A barren corridor
        family: line
        key_kind: water
        parts: {heart: [land_desert, land_steppe], end_a: [land_plain, land_river, land_highland, land_forest], end_b: [land_plain, land_river, land_highland, land_forest], key_place: [land_desert, land_steppe]}
        forces_one_of: [land_desert, land_steppe]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}]
        tr: {name: "çorak koridor", heart: "koridorun ortasındaki han-şehir", ends_both: "koridorun iki ucundaki iki uygarlık", key_place: "yoldaki tek su kaynağı", travel: "konaktan konağa, suya bağlı"}
      # 2. centred
      - id: spine_lake_basin
        label: A mountain-ringed basin with a lake
        family: centred
        key_kind: gate
        parts: {heart: [land_lake], end_a: [land_plain, land_lake, land_forest], end_b: [land_forest, land_steppe, land_cold, land_desert], key_place: [land_mountain]}
        forces: [land_mountain, land_lake]
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "dağlarla çevrili çanak, ortasında göl", heart: "göldeki ada-şehir", ends: ["verimli havza", "dağların ötesindeki bilinmeyen"], key_place: "havzadan çıkan tek geçit", travel: "göl üstünden ve kıyı yollarından içeri doğru"}
      - id: spine_lone_mountain
        label: One giant mountain
        family: centred
        key_kind: descent
        parts: {heart: [land_mountain, land_highland], end_a: [land_mountain], end_b: [land_plain, land_forest, land_highland, land_steppe], key_place: [land_mountain, land_underground]}
        forces: [land_mountain]
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "tek dev dağ", heart: "yamaçtaki en büyük şehir", ends: ["zirve", "etek"], key_place: "zirveye çıkan yol ya da dağın içine inen ağız", travel: "halkalar halinde yukarı ve aşağı"}
      - id: spine_star_crater
        label: The crater of a fallen stone
        family: centred
        key_kind: descent
        parts: {heart: [], end_a: [land_glass_desert, land_crystal_forest, land_marsh, land_forest], end_b: [], key_place: [land_highland, land_mountain]}
        landmark: crater                 # a P3 landmark, not a palette kind (review #4)
        weight_by: [{when: {dial: {scale: [short]}}, x: 2}]
        merges_with:                     # owner, 2026-09-28: one crater, the spine's heart
          ruin_fallen_star: "the ruin's crater and star stone are the spine's heart crater"
          ruin_celestial_war: "the war's impact crater is the spine's heart crater"
        tr: {name: "gökten düşen bir taşın krateri", heart: "kraterin ortasındaki taş", ends: ["değişmiş krater içi", "krater dışı"], key_place: "kenardan inen tek yol", travel: "kenardan merkeze"}
        hooks:
          - {phase: P3, must: "the crater is a landmark and the heart's node"}
      - id: spine_oasis_ring
        label: An oasis and its ring
        family: centred
        key_kind: water
        parts: {heart: [land_desert], end_a: [land_desert], end_b: [land_plain, land_steppe, land_mountain, land_coast], key_place: [land_desert]}
        forces: [land_desert]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "vaha ve çevresindeki halka", heart: "vaha", ends: ["vaha", "çölün öbür yakası"], key_place: "vahanın suyu", travel: "vahadan dışa seferler; geri dönmek zorunlu"}
      - id: spine_crossroads
        label: Four roads meeting
        family: centred
        key_kind: crossroad
        parts: {heart: [land_plain, land_steppe], end_a: [], end_b: [], end_c: [], end_d: [], key_place: [land_plain, land_steppe]}
        tr: {name: "dört yol ağzı", heart: "kavşak şehri", ends_both: "dört yöndeki dört farklı iklim ve ülke", key_place: "kavşağın kendisi", travel: "merkezden dışa, dört koldan"}
      # 3. fragmented
      - id: spine_archipelago
        label: An archipelago
        family: fragmented
        key_kind: crossing
        parts: {heart: [land_island], end_a: [land_island], end_b: [land_volcanic, land_forest, land_mountain, land_coast], key_place: [land_coast]}
        forces: [land_island, land_coast]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {era: [nautical]}}, x: 3}]
        tr: {name: "takımadalar", heart: "en büyük ada", ends: ["iç adalar", "uzak ve vahşi dış adalar"], key_place: "adaları bağlayan tek güvenli boğaz", travel: "adadan adaya gemiyle, mevsime bağlı"}
      - id: spine_valley_maze
        label: A maze of valleys
        family: fragmented
        key_kind: network
        parts: {heart: [land_plain, land_river], end_a: [land_forest, land_plain, land_river, land_highland, land_lake], end_b: [land_forest, land_plain, land_river, land_highland, land_lake], key_place: [land_mountain, land_underground]}
        forces: [land_mountain]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "vadiler labirenti", heart: "en geniş vadi", ends_both: "birbirinden dağlarla ayrılmış, her biri başka bir halkın vadisi", key_place: "vadileri bağlayan tüneller ve geçitler", travel: "geçitlerden; her vadi ayrı bir dünya"}
      - id: spine_forest_clearings
        label: Clearings in an endless forest
        family: fragmented
        key_kind: network
        parts: {heart: [land_plain, land_forest], end_a: [land_plain, land_highland, land_lake, land_marsh], end_b: [land_forest], key_place: [land_forest]}
        forces: [land_forest]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}]
        tr: {name: "sonsuz ormanın açıklıkları", heart: "en büyük açıklık", ends: ["açıklıklar", "ormanın derinliği"], key_place: "açıklıkları bağlayan patikalar", travel: "açıklıktan açıklığa, yolsuz"}
      - id: spine_mesa_land
        label: A land of mesas
        family: fragmented
        key_kind: bridge
        parts: {heart: [land_highland], end_a: [land_highland, land_mountain], end_b: [land_desert, land_river], key_place: [land_highland, land_mountain]}
        forces_one_of: [land_desert, land_highland]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "mesa ülkesi", heart: "en büyük masa dağın üstündeki şehir", ends: ["yaşanan mesa tepeleri", "aradaki vahşi kanyonlar"], key_place: "mesaları bağlayan köprüler ve ip yollar", travel: "mesadan mesaya, kanyonlara iniş"}
      - id: spine_lake_chain
        label: A chain of lakes
        family: fragmented
        key_kind: crossing
        parts: {heart: [land_lake], end_a: [land_lake], end_b: [land_marsh, land_river, land_forest, land_cold], key_place: [land_lake, land_river]}
        forces: [land_lake]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "göller zinciri", heart: "iki gölü bağlayan boğazdaki şehir", ends_both: "zincirin iki ucundaki göller", key_place: "göller arasındaki boğaz", travel: "gölden göle, suyla"}
      # 4. layered
      - id: spine_three_depths
        label: Surface, middle depth and the deep
        family: layered
        key_kind: descent
        parts: {heart: [land_underground], end_a: [land_plain, land_forest, land_highland, land_mountain], end_b: [land_underground], key_place: [land_underground]}
        forces: [land_underground]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "yüzey, orta derinlik ve derin", heart: "orta katmandaki şehir", ends: ["yüzey", "en derin katman"], key_place: "katmanları bağlayan büyük kuyu ya da kaldırgaç", travel: "aşağı ve yukarı"}
      - id: spine_terraces
        label: Terraces
        family: layered
        key_kind: descent
        parts: {heart: [land_highland, land_plain], end_a: [land_highland], end_b: [land_plain], key_place: [land_river, land_highland, land_mountain]}
        forces: [land_highland, land_plain]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        tr: {name: "basamaklar", heart: "orta terastaki şehir", ends: ["en üstteki yayla", "en alttaki ova"], key_place: "teraslar arası merdivenler ve şelaleler", travel: "basamak basamak"}
      - id: spine_two_worlds
        label: Two worlds, one over the other
        family: layered
        key_kind: network
        parts: {heart: [land_thin_place, land_plain], end_a: [], end_b: [land_thin_place], key_place: [land_thin_place]}
        forces: [land_thin_place]
        requires: {dial: {magic: [medium, high]}}
        merges_with:                     # owner, 2026-09-28: the rift is no separate place
          ruin_planar_rift: "the rift is the two worlds' crossing point, the key place"
        tr: {name: "üst üste iki dünya", heart: "iki dünyanın örtüştüğü şehir", ends: ["bizim dünya", "öbür düzlem"], key_place: "geçiş noktaları", travel: "iki katman arasında gidip gelme"}
      - id: spine_mountain_within
        label: The mountain's inside and outside
        family: layered
        key_kind: gate
        parts: {heart: [land_underground], end_a: [land_mountain], end_b: [land_underground], key_place: [land_mountain]}
        forces: [land_mountain, land_underground]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        tr: {name: "dağın içi ve dışı", heart: "dağın içindeki şehir", ends: ["dağın dışı", "dağın içi"], key_place: "dağın kapıları", travel: "kapılardan içeri ve dışarı"}
      - id: spine_above_below_sea
        label: Above and below the sea
        family: layered
        key_kind: network
        parts: {heart: [land_coast], end_a: [land_coast], end_b: [land_island, land_underground, land_marsh], key_place: [land_coast, land_underground]}
        forces: [land_coast]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {era: [nautical]}}, x: 3}]
        tr: {name: "deniz üstü ve deniz altı", heart: "kıyı şehri ya da bir resif", ends: ["kıyı halkı", "deniz altı halkları"], key_place: "sualtı mağaraları", travel: "dalış ve sualtı yolları"}
      # 5. frontier
      - id: spine_peninsula
        label: A peninsula
        family: frontier
        key_kind: crossing
        parts: {heart: [land_coast, land_plain], end_a: [land_coast, land_highland, land_forest], end_b: [land_plain, land_mountain, land_forest, land_steppe], key_place: [land_coast]}
        forces: [land_coast]
