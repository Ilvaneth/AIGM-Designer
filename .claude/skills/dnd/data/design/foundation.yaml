  break_target:
    layer: story
    roll: {avoid_used: false, note: "the target is a load-bearing piece; the thin place only when the palette holds it; the action must fit the target (the action's `targets` and its fit lists)"}
    hooks_common:
      - {phase: P7, must: "the opening meets the break through its target"}
    rows:
      - {id: target_remnant, label: The ruin's remnant, piece: remnant, text: {"name": "the remnant of the ruin"}, hooks: [{phase: P6, must: "the remnant's site shows the break"}]}
      - {id: target_key_place, label: The spine's key place, piece: key_place, text: {"name": "the key place of the spine"}, hooks: [{phase: P3, must: "the key place's node shows the break"}]}
      - {id: target_heart, label: The heart, piece: heart, text: {"name": "the heart"}, hooks: [{phase: P3, must: "the heart shows the break; a destroyed heart moves the start to its ruins or the nearest end"}]}
      - {id: target_role, label: A contest role, piece: role, text: {"name": "a role of the contest"}, hooks: [{phase: P4, must: "the struck role's faction carries the break"}]}
      - {id: target_thin_place, label: The thin place, piece: thin_place, requires: {any_of: [land_thin_place]}, text: {"name": "the thin place"}, hooks: [{phase: P2, must: "the thin place's plane carries the break"}]}
    retired:                          # build item 18a: the lifeline is texture, no target; kept for legacy births
      - {id: target_lifeline, label: The lifeline, piece: lifeline, text: {"name": "the lifeline"}, hooks: [{phase: P3, must: "the lifeline's weak point is where the break struck"}]}

  action:
    layer: story
    roll:
      avoid_used: false
      row_wait: 3                       # grammar: a verb the last three births used waits; a target + action pair never repeats
      note: >-
        `phrases` are the move's clause in active voice with the hand as its subject (build item 18e-2): each entry's
        `for` names a target piece or a `piece.kind` (a kind's entry comes first), with the past (just now, a
        generation ago), present (unfolding) and imminent (coming) forms; `{be}` takes the hand's number (is, are),
        `{target}` the target's short name. `leaves_ruins`: a heart this action destroys leaves ruins, where the
        campaign starts; otherwise it starts at the end nearest the heart (end_a).
        `fits` are the compatibility tables (review #8; build item 18e-2): the remnant kinds, key-place kinds and role
        kinds (group, settlement, person, creature) the verb strikes, each only where its phrase reads true (build item 18a: the
        lifeline is no target); `by` names the hands that can make the move (absent: every hand; build item 18c: an
        intrigue move belongs to a hand that can scheme); the heart and the thin place need only the action's
        `targets`. `destroys` names the pieces the action destroys (a destroyed role cannot be the winner; a destroyed
        heart moves the start). The illustrations stay in docs/p1-foundation-rows.md only; examples anchor births.
    hooks_common:
      - {phase: P2, must: "a dated event of the history is the break, told with this action"}
      - {phase: P8, must: "the day-0 news carries the break's latest sign"}
    rows:
      - id: act_vanished
        label: Carried off
        targets: [remnant, role, heart]
        fits: {remnant: [object], role: [group, settlement, person]}
        phrases:
          - {for: [remnant], past: "carried off {target}", present: "{be} carrying off {target}", imminent: "{be} about to carry off {target}"}
          - {for: [role.person], past: "carried off {target}", present: "{be} trying to carry off {target}", imminent: "{be} about to carry off {target}"}
          - {for: [role], past: "carried off the leader of {target}", present: "{be} carrying off the leaders of {target}", imminent: "{be} about to carry off the leader of {target}"}
          - {for: [heart], past: "carried off the ruler of {target}", present: "{be} carrying off the leaders of {target}", imminent: "{be} about to carry off the ruler of {target}"}
      - id: act_seized
        label: Seized
        targets: [heart, key_place, remnant, thin_place]
        fits: {key_place: [crossing, bridge, water, gate, descent, crossroad, network, landmark], remnant: [network, structure, city, body, wasteland, machine, object, source, rift]}
        phrases:
          - {for: [heart, key_place, remnant, thin_place], past: "seized {target}", present: "{be} seizing {target}", imminent: "{be} about to seize {target}"}
      - id: act_split
        label: Divided
        targets: [role, heart]
        fits: {role: [group, settlement]}
        destroys: [role]
        phrases:
          - {for: [role], past: "split {target} in two", present: "{be} splitting {target} in two", imminent: "{be} about to split {target} in two"}
          - {for: [heart], past: "divided {target} against itself", present: "{be} dividing {target} against itself", imminent: "{be} about to divide {target} against itself"}
        by: [hand_villain_itself, hand_traitor, hand_cult, hand_thieves_guild, hand_deceived_side, hand_zealous_order, hand_fey_court, hand_shapechangers, hand_fiends, hand_hag_coven]
      - id: act_corrupted
        leaves_ruins: true
        label: Corrupted
        targets: [remnant, key_place, heart]
        fits: {key_place: [crossing, water, gate, network, landmark], remnant: [network, structure, city, body, wasteland, source, rift]}
        phrases:
          - {for: [remnant, key_place, heart], past: "corrupted {target}", present: "{be} corrupting {target}", imminent: "{be} about to corrupt {target}"}
        by: [hand_villain_itself, hand_cult, hand_fiends, hand_from_beyond, hand_druid_circle, hand_hag_coven, hand_risen_dead, hand_ruin_power, hand_dragon, hand_fey_court, hand_werewolves]
