  # ── 3. the ruin source: what left the dangerous places (8 families, 40) ────────────────────
  ruin_source:
    layer: story
    roll:
      avoid_used: true
      family_wait: 3
      note: >-
        `sites` are sites.yaml's types the remnant yields (P6); `olgu_families` are the 2-3 families of
        the phenomenon rule its strangeness fits (item 25 review #6; family 8, born of the break, only
        with the scar); `remnant_kind` feeds the break's compatibility; `adds_palette` / `adds_biome` /
        `landmark` are what the row brings to the map.
    hooks_common:
      - {phase: P2, must: "one age of the history is this fall, told from its `what` line"}
      - {phase: P6, must: "the remnant's sites come from the row's `sites` types; at least one site stands in the remnant"}
      - {phase: P1, must: "unless the scar changed a magic rule, the phenomenon signature's home is this strangeness", check: phenomenon_home}
    rows:
      # 1. fallen kingdoms
      - id: ruin_road_kingdom
        label: The road-building kingdom
        family: fallen_kingdoms
        remnant_kind: network
        sites: [site_stronghold, site_dungeon_ruin, site_dungeon_planned]
        olgu_families: [place_path, word_sign]
        text: {"name": "the road-building kingdom", "what": "the kingdom that laced the land with stone roads and forts collapsed in civil war", "remnant": "the stone road network and the road forts", "remnant_short": "the stone roads and their forts", "sites": "road forts, bridge towers, buried treasure vaults", "strangeness": "the old roads still lead whoever walks them somewhere"}
      - id: ruin_water_kingdom
        label: The water kingdom
        family: fallen_kingdoms
        remnant_kind: network
        sites: [site_dungeon_planned, site_dungeon_ruin]
        olgu_families: [matter, magic_behaviour, place_path]
        text: {"name": "the water kingdom", "what": "the kingdom that built cisterns and aqueducts fell apart when it lost its water", "remnant": "aqueducts and cisterns", "remnant_short": "the old aqueducts and cisterns", "sites": "cisterns, canals, sluice chambers", "strangeness": "the old magic that steers the water still works"}
