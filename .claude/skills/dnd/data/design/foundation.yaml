          - {for: [remnant], past: "woke what sleeps in {target}", present: "{be} waking what sleeps in {target}", imminent: "{be} about to wake what sleeps in {target}"}
          - {for: [key_place], past: "woke what sleeps beneath {target}", present: "{be} waking what sleeps beneath {target}", imminent: "{be} about to wake what sleeps beneath {target}"}
