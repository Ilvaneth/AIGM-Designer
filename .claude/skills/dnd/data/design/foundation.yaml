          b: {tr: "yeni kurulan rakip şehir", hint: trade}
          third: {tr: "limanı kullanan kaçakçılar", hint: criminal}
          fourth: {tr: "denizciler loncası", hint: null}
        requires: {any_of: ["land_coast"]}
        escalation: ["gemilere el koyma", "kıyı savaşı"]
        tr: {name: "aynı limanı isteyen iki şehir", name_note: "kilit yerin iki yanında"}
