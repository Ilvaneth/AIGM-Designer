  # ── 5. the contest: the campaign's old fault line (8 families, 40) ────────────────────────────────
      # ── the general themes (build item 16b) ──
      - id: life_enchanters
        label: "The enchanters' workshops"
        family: craft
        statement: "The land's wealth is enchanted goods, made to order and sold abroad."
        requires: {dial: {magic: [medium, high]}}
        text: {"name": "the enchanters' workshops", "who": "enchanters and their apprentices", "yields": "enchanted goods, made to order and sold abroad", "weak_point": "the masters' formulae; the rare materials that must come from elsewhere", "sense": "the smell of hot metal and the hum of a working that has not yet settled"}

  contest:
    layer: story
    roll:
      avoid_used: true
      family_wait: 3
      roles_by_scale: {short: [a, b, third], standard: [a, b, third, fourth], epic: [a, b, third, fourth]}
      contests_by_scale: {short: 1, standard: 1, epic: 2}
      note: >-
        epic draws a second contest of three roles (a, b, third) from another family, seated on another part
        of the spine. `seats` override the default (a and b at the spine's two ends); `hint` is the P4 faction
        archetype a role suggests (the institution signature is drawn only from a hinted role, review #5);
        `prize` is heart, key_place, disputed_land (an end or the land between), seat (a role's house or inheritance),
        remnant, new, or the thin place (only with the thin place in the palette); never the lifeline, which is
        texture (build item 18a). Gates and weights come from the stage and the dials alone. A disputed land lies
        between the sides unless `prize_at` names the side whose own land it is; a key-place prize is drawn only
        on a spine whose key place is one of the row's `key_kinds`. The villain is no side by default.
        A role's `short` is the noun phrase the story sentence uses where its text runs past five words or leans on
        another phrase (it, its, the other); `kind` is person or creature for a role that is one being, settlement for a town, a realm or a
        state (absent: a group); `text.prize` names a new or seat prize in the sentence (build item 18e-2).
    hooks_common:
      - {phase: P4, must: "each role is a faction of its hinted archetype; every other faction takes a stance on the contest"}
      - {phase: P4, must: "the escalation's steps are the factions' provocation rungs, first spark to the hardest form"}
      - {phase: P1, must: "the question's two poles sit on sides a and b; the break's winner is one of the roles", check: question_on_contest}
      - {phase: P7, must: "the contest's escalation climbs with the arc"}
    rows:
      - id: contest_two_heirs
        claims: {nobility: exists, rule: hereditary}
        label: "Two heirs, a regent at the heart"
        family: two_hands
        prize: heart
        seats: {"third": "heart"}
        roles:
          a: {text: "the elder heir", kind: person, hint: state}
          b: {text: "the younger heir and their army", short: "the younger heir", kind: person, hint: martial}
          third: {text: "the regent who holds the crown and the treasury", short: "the regent", kind: person, hint: state}
          fourth: {text: "a foreign kingdom that wants the throne", short: "a foreign kingdom", kind: settlement, hint: null}
        escalation: ["the coronation date", "civil war"]
        text: {"name": "two heirs", "name_note": "the regent at the heart"}
      - id: contest_one_harbour
        label: "Two cities, one harbour"
        family: two_hands
        prize: key_place
        key_kinds: [crossing, landmark]   # the spine's key place must be a harbour, a strait or a cape (owner, 18a audit)
        seats: {"a": "beside_key_place", "b": "beside_key_place"}
        roles:
          a: {text: "the old harbour city", kind: settlement, hint: guild}
          b: {text: "the newly founded rival city", kind: settlement, hint: trade}
          third: {text: "the smugglers who use the harbour", short: "the harbour smugglers", hint: criminal}
          fourth: {text: "the sailors' guild", hint: null}
        requires: {any_of: ["land_coast"]}                      # the gate: the stage (build item 18a)
        escalation: ["seizing of ships", "coastal war"]
        text: {"name": "two cities that want the same harbour", "name_note": "on either side of the key place"}
      - id: contest_one_pasture
        label: "Two peoples, one pasture"
        family: two_hands
        prize: disputed_land
        roles:
          a: {text: "the herd-owning highland clans", hint: martial}
          b: {text: "the lowland villages widening their fields", short: "the lowland villages", kind: settlement, hint: state}
          third: {text: "the merchants selling horses and weapons to both sides", short: "the horse and arms merchants", hint: trade}
          fourth: {text: "the keepers of the holy place in the middle of the pasture", short: "the holy place's keepers", hint: religious}
        requires: {any_of: ["land_highland", "land_plain", "land_steppe"]}   # the gate: the stage (build item 18a)
        escalation: ["herd raids", "blood feud"]
        text: {"name": "two peoples, one pasture"}
      - id: contest_one_shrine
        label: "Two faiths, one holy place"
        family: two_hands
        prize: remnant
        seats: {"prize": "key_place"}
        roles:
          a: {text: "the old keepers of the holy place", short: "the shrine's old keepers", hint: religious}
          b: {text: "the new faith that counts the same place as its own god's", short: "the new faith", hint: religious}
          third: {text: "the town that lives off the pilgrims", short: "the pilgrim town", kind: settlement, hint: guild}
          fourth: {text: "the scholars who want to dig up the place", short: "the scholars", hint: scholarly}
        weight_by: [{when: {any_of: [ruin_dead_god, ruin_gods_quarrel, ruin_departed_god, ruin_imprisoned_god, ruin_failed_apotheosis]}, x: 2}]   # a ruin source of the gods
        escalation: ["the cutting of the pilgrims' road", "blood in the holy place"]
        text: {"name": "two faiths, one holy place", "name_note": "the holy place at the key place"}
      - id: contest_two_banks
        label: "One river, two banks"
        family: two_hands
        prize: key_place
        key_kinds: [crossing, bridge]   # the spine's key place must be a ford, a weir or a bridge (owner, 18a audit)
        roles:
          a: {text: "those upstream", hint: state}
          b: {text: "those downstream", hint: state}
          third: {text: "the weir masters who steer the water", short: "the weir masters", hint: guild}
          fourth: {text: "a people living in the river", short: "the river folk", hint: null, people_role: true}
        requires: {any_of: ["land_river"]}                      # the gate: the stage (build item 18a)
        escalation: ["cutting off the water", "tearing down the weir"]
        text: {"name": "one river, two banks"}
      - id: contest_settlers_newcomers
        label: "Settled folk and newcomers"
        family: old_new
        prize: disputed_land
        seats: {"b": "end"}
        roles:
          a: {text: "the old owners of the land", short: "the land's old owners", hint: state}
          b: {text: "the newcomers", hint: trade}
          third: {text: "the merchants who profit from both", short: "the profiteering merchants", hint: trade}
          fourth: {text: "someone organising the frightened people", kind: person, hint: resistance}
        weight_by: [{when: {dial: {content_mix: ["politics"]}}, x: 2}]
        escalation: ["bans", "quarter fires"]
        text: {"name": "the settled and the newcomers", "name_note": "the newcomers at one end"}
      - id: contest_old_order_reform
        claims: {nobility: exists}
        label: "The old order and the reformers"
        family: old_new
        prize: heart
        roles:
          a: {text: "the old nobles", hint: state}
          b: {text: "the young ruler or council that wants reform", short: "the reformers", hint: state}
          third: {text: "the guilds that stand to gain from the reform", short: "the guilds", hint: guild}
          fourth: {text: "the soldiers of the old order", short: "the old order's soldiers", hint: martial}
        weight_by: [{when: {dial: {content_mix: ["politics"]}}, x: 2}]
        escalation: ["new laws", "coup attempt"]
        text: {"name": "the old order and the reformers"}
      - id: contest_old_gods_new_faith
        label: "Old gods, a new faith"
        family: old_new
        prize: heart
        roles:
          a: {text: "the old temples", hint: religious}
          b: {text: "the fast-spreading new faith", hint: religious}
          third: {text: "the ruler forced to choose a side", short: "the torn ruler", kind: person, hint: state}
          fourth: {text: "the mages who reject both faiths", short: "the faithless mages", hint: scholarly}
        weight_by: [{when: {dial: {content_mix: ["politics"]}}, x: 2}]
        escalation: ["sermons", "temple burning"]
        text: {"name": "old gods, new faith"}
      - id: contest_returners_stayers
        label: "Those who return and those who stayed"
        family: old_new
        prize: heart
        roles:
          a: {text: "the people driven out years ago and now returned", short: "the returned exiles", hint: martial}
          b: {text: "those who have settled on their lands", short: "those who stayed", hint: state}
          third: {text: "a foreign power backing the return", short: "a foreign power", hint: state}
          fourth: {text: "the mixed families married from both sides", short: "the mixed families", hint: null}
        weight_by: [{when: {dial: {content_mix: ["politics"]}}, x: 2}]
        escalation: ["knocking on the doors of the old homes", "armed return"]
        text: {"name": "those who return and those who stayed"}
      - id: contest_occupier_resistance
        label: "The occupier and the resistance"
        family: strong_weak
        prize: heart
        seats: {"a": "heart"}
        roles:
          a: {text: "the outside power holding the region", short: "the occupiers", hint: martial}
          b: {text: "the resistance in the mountains", hint: resistance}
          third: {text: "the collaborating local nobles", hint: state, claims: {nobility: exists}}
          fourth: {text: "the smugglers who profit from both sides", short: "the smugglers", hint: criminal}
        weight_by: [{when: {dial: {content_mix: ["war"]}}, x: 2}]
        escalation: ["taxes and soldiers", "uprising"]
        text: {"name": "the occupier and the resistance", "name_note": "the occupier at the heart"}
      - id: contest_capital_marches
        claims: {nobility: exists}
        label: "The capital and the marches"
        family: strong_weak
        prize: disputed_land
        prize_at: b                     # the disputed land is side b's own (owner, 18a audit)
        seats: {"a": "heart"}
        roles:
