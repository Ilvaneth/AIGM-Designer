  # ── 4. the lifeline: what they live on, what they cannot lose (7 families, 60) ──────────────────────
  lifeline:
    roll:
      avoid_used: true
      family_wait: 3
      note: "only rows whose `where` kinds the palette holds are drawn (requires); the script places the lifeline on the spine; `who` go to P5's trades, `yields` to P3's goods, `weak_point` is the break's D target"
    hooks_common:
      - {phase: P3, must: "the lifeline's yields are the economy's main goods; its place is a map node on the spine"}
      - {phase: P5, must: "the lifeline's trades are NPC trades; at least one NPC lives by it"}
      - {phase: P4, must: "the contest's prize, when it is the lifeline, is this row"}
      - {phase: P1, must: "the people signature's home is the lifeline (unless the new-people scar rolled)"}
    rows:
      - id: life_snowmelt
        label: "Snowmelt from the mountains"
