# foundation.yaml — P1's first step, the foundation (plan item 25; the owner-approved rows in
# docs/p1-foundation-rows.md, sections 1-6 and 18). A script builds it from these sub-tables with no
# model: the spine first (it forces the landform kinds it needs), then the palette, the ruin source,
# the contest, the break, the escalation and, last, the lifeline (build item 18a: texture hangs on the story). Every seed is a column: its sub-table's
# hooks_common are the promises the later floors inherit (errata 24.2 #23, the promise ledger).
#
# English ids and labels; the approved Turkish phrases are the rows' `tr` fields, self-standing noun
# phrases or clauses the foundation sentence joins with separate words (item 25, step 1 #7).
# The arbiter's fields (conflicts_with, requires, weight_by, family, the roll headers) are described
# in README.md; design_arbiter.py is their only judge.
schema_version: 1
table: foundation
consumed_by: [P1, P2, P3, P4, P5, P6, P7, P8]
plan: "item 25; errata 24.2 #20-25"

# closed lists the rows name (tests/test_foundation_tables.py checks them)
phenomenon_rule_families: [magic_behaviour, body_blood, place_path, matter, time, word_sign, nature_creatures, born_of_break]
key_kinds: [crossing, bridge, water, gate, descent, crossroad, network, landmark]
remnant_kinds: [network, structure, city, body, wasteland, machine, object, source, rift]
role_kinds: [group, settlement, person, creature]   # build item 18e-2: a contest role's `kind` (absent: group)
# the palette kinds a key place of each kind can stand on (build item 6b); crossroad, network and landmark take any
key_kind_lands:
  crossing: [land_river, land_lake, land_coast, land_island, land_mountain, land_highland, land_sky_river]
  bridge: [land_mountain, land_highland, land_river, land_volcanic, land_desert, land_floating_isles]
  water: [land_river, land_lake, land_coast, land_desert, land_steppe, land_sky_river]
  gate: [land_mountain, land_highland, land_underground, land_volcanic, land_plain, land_steppe, land_river]   # a river gate, the last bridge
  descent: [land_mountain, land_highland, land_underground, land_volcanic, land_river]   # waterfall stairs

tables:

  # ── 1. the palette: the landform kinds (22) ────────────────────────────────────────────────
  palette:
    layer: texture
    roll:
      avoid_used: false                 # palettes are never excluded across campaigns
      # build item 18b: the count follows the spine (docs/p1-build-18-rows.md section 7); the forced kinds count inside it
      count_by_spine: {tight: {short: [2, 3], standard: [3, 4], epic: [4, 5]}, wide: {short: [3, 4], standard: [4, 6], epic: [6, 8]}}
      fantastic_cap_by_magic: {low: 0, medium: 1, high: 2}   # `cap_exempt` rows (the thin place) never count
      needs: [height, water]            # at least one of each
      forces_by_dial: {era: {underground: [land_underground], nautical: [land_coast]}}   # owner: never optional in those eras
      note: >-
        the spine's and the dial's forced kinds come first; the rest are drawn without replacement. The one
        fantastic kind the ruin source brings (`adds_palette`) comes on top of the count (+1), skips the
        kind's own magic requirement and is exempt from the cap; only one is exempt. A fantastic kind a scar
        brings counts toward the cap, and a scar whose kind the full cap cannot take is excluded by requires
        (item 25 review #4; owner, 2026-09-28).
    hooks_common:
      - {phase: P3, must: "every palette kind lives on at least one map node (short has 1-2 regions against 4-5 kinds)"}
      - {phase: P3, must: "a region's biomes come from its palette kinds' biomes"}
      - {phase: P2, must: "the origin of every fantastic kind the ruin source did not bring is written"}
    rows:
      - {id: land_mountain, label: Mountains, height: true, biomes: [biome_high_mountains, biome_foothills], text: {"name": "mountain"}}
      - {id: land_highland, label: Highlands, height: true, biomes: [biome_pine_uplands, biome_grazing_hills, biome_moor], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "highland"}}
      - {id: land_plain, label: Plains, biomes: [biome_river_valley], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "plain"}}
      - {id: land_steppe, label: Steppe, biomes: [biome_steppe], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "steppe"}}
      - {id: land_forest, label: Forest, biomes: [biome_old_forest, biome_jungle], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "forest"}}
      - {id: land_marsh, label: Marsh, biomes: [biome_fen, biome_salt_marsh], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "marsh"}}
      - {id: land_desert, label: Desert, biomes: [biome_sand_desert, biome_stone_desert, biome_dunes, biome_salt_flats], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "desert"}}
      - {id: land_cold, label: Cold lands, biomes: [biome_tundra], weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "cold lands"}}
      - {id: land_volcanic, label: Volcanic land, height: true, biomes: [biome_volcanic], text: {"name": "volcanic land"}}
      - {id: land_river, label: River, water: true, biomes: [biome_river_delta, biome_river_valley], text: {"name": "river"}}
      - {id: land_lake, label: Lakes, water: true, biomes: [biome_lake_country], text: {"name": "lake"}}
      - id: land_coast
        label: Coast and sea
        water: true
        biomes: [biome_sea_cliffs, biome_salt_marsh]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}, {when: {dial: {era: [nautical]}}, x: 2}]
        text: {"name": "coast and sea"}
      - id: land_island
        label: Islands
        implies: [land_coast]
        biomes: [biome_sea_cliffs, biome_salt_marsh]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}, {when: {dial: {era: [nautical]}}, x: 2}]
        text: {"name": "island"}
      - id: land_underground
        label: The underground
        biomes: [biome_caverns, biome_fungus_deeps]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        text: {"name": "underground"}
      # fantastic (8): gated by the magic dial; only the thin place at low
      - {id: land_floating_isles, label: Floating isles, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "floating isles", "what": "rocks hanging in the air and the villages on top of them"}}
      - {id: land_crystal_forest, label: Crystal forest, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "crystal forest", "what": "a forest whose trees are of crystal"}}
      - {id: land_stone_sea, label: Petrified sea, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "petrified sea", "what": "a sea whose waves have turned to stone, walked upon"}}
      - {id: land_giant_bones, label: Giant's bones, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "giant's bones", "what": "land settled on and inside a giant skeleton"}}
      - {id: land_sky_river, label: River into the sky, fantastic: true, water: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "river flowing into the sky", "what": "a waterway in the air, flowing upward"}}
      - {id: land_glass_desert, label: Glass desert, fantastic: true, requires: {dial: {magic: [medium, high]}}, weight_by: [{when: {dial: {era: [underground]}}, x: 0.5}], text: {"name": "glass desert", "what": "a desert whose sand has turned to glass"}}
      - {id: land_giant_fungus, label: Giant fungus forest, fantastic: true, requires: {dial: {magic: [medium, high]}}, text: {"name": "giant mushroom forest", "what": "tree-tall mushrooms, on the surface"}}
      - id: land_thin_place
        label: Thin place
        fantastic: true
        thin_place: true
        cap_exempt: true                 # a plane's touch (P2's planes), drawable at every magic level
        text: {"name": "thin place", "what": "the place where a plane touches the world; P2 picks the plane"}
        hooks:
          - {phase: P2, must: "the thin place's plane is chosen and touched"}

  # ── 2. the spine: the world's skeleton (6 families, 30) ─────────────────────────────────────
  spine:
    layer: stage
    roll:
      avoid_used: true
      family_wait: 3
      note: >-
        rolled before the palette; `forces` puts the kinds it needs into the palette (item 25 review #2);
        `forces_one_of` puts one of them. `parts` are the kinds each piece prefers (an empty list takes any);
        the script lays the palette on them: the key place on a kind its key_kind stands on, the two ends on
        different kinds, the rest along the spine; within a part's list a kind no part holds yet comes first
        (build item 6b). A part's kind is the land around it: two ends of one kind in the prose (the lake chain's
        two lakes) take different lands, and the prose keeps the row's picture (owner, 2026-09-29).
    hooks_common:
      - {phase: P3, must: "the map's main line follows the spine's travel; the heart, both ends and the key place are map nodes"}
      - {phase: P3, must: "the palette's kinds are spread over the spine's pieces; the two ends take different kinds"}
      - {phase: P4, must: "the contest's two sides sit at the spine's two ends unless the contest row places them"}
      - {phase: P6, must: "the site distribution follows the spine: the key place and the ends each hold or border a site"}
    rows:
      # 1. single line
      - id: spine_river_to_sea
        breadth: wide
        label: A river from source to sea
        family: line
        key_kind: crossing
        parts: {heart: [land_river, land_plain], end_a: [land_mountain], end_b: [land_coast], key_place: [land_river]}
        forces: [land_river, land_mountain, land_coast]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [epic]}}, x: 2}]
        text: {"name": "a river from source to sea", "heart": "the bridge-city on the middle course", "ends": ["the mountain peoples at the source", "the port in the delta"], "key_place": "the river's only passable ford", "travel": "down and up along the river, by barge and by road"}
      - id: spine_great_rift
        breadth: wide
        label: A great rift
        family: line
        key_kind: descent
        parts: {heart: [land_highland], end_a: [land_underground, land_forest, land_river, land_marsh], end_b: [land_highland], key_place: [land_highland, land_mountain]}
        forces: [land_highland]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 3}]
        text: {"name": "a giant rift", "heart": "the bridge that joins the two sides", "heart_short": "the bridge-town over the rift", "ends": ["the floor of the rift", "the highlands on the rims"], "key_place": "the bridge or the stair that goes down to the floor", "key_place_short": "the way down to the floor", "travel": "along the rims and the descent below"}
      - id: spine_mountain_passes
        breadth: wide
        label: Passes along a range
        family: line
        key_kind: crossing
        parts: {heart: [land_mountain], end_a: [land_forest, land_highland, land_plain], end_b: [land_desert, land_steppe], key_place: [land_mountain]}
        forces: [land_mountain]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [epic]}}, x: 2}]
        text: {"name": "passes along a mountain range", "heart": "the fortress-city in the greatest pass", "ends": ["the rain-fed slope of the range", "its dry slope"], "key_place": "the main pass", "travel": "from pass to pass, depending on the season"}
      - id: spine_long_coast
        breadth: wide
        label: A long coastline
        family: line
        key_kind: landmark
        parts: {heart: [land_coast], end_a: [land_cold, land_mountain], end_b: [land_coast], key_place: [land_coast, land_mountain]}
        forces: [land_coast]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {era: [nautical]}}, x: 3}]
        text: {"name": "a long coastline", "heart": "the great port", "ends": ["glacier fjords at one end", "warm bays at the other end"], "key_place": "the cape that splits the coast in two", "key_place_short": "the cape that splits the coast", "travel": "by ship along the coast; the mountains cut the land road"}
      - id: spine_barren_corridor
        breadth: wide
        label: A barren corridor
        family: line
        key_kind: water
        parts: {heart: [land_desert, land_steppe], end_a: [land_plain, land_river, land_highland, land_forest], end_b: [land_plain, land_river, land_highland, land_forest], key_place: [land_desert, land_steppe]}
        forces_one_of: [land_desert, land_steppe]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 0.25}]
        text: {"name": "barren corridor", "heart": "the caravanserai-city in the middle of the corridor", "heart_short": "the caravanserai-city", "ends_both": "two civilisations at the two ends of the corridor", "key_place": "the only water source on the road", "key_place_short": "the road's only water source", "travel": "from halt to halt, bound to water"}
      # 2. centred
      - id: spine_lake_basin
        breadth: tight
        label: A mountain-ringed basin with a lake
        family: centred
        key_kind: gate
        parts: {heart: [land_lake], end_a: [land_plain, land_lake, land_forest], end_b: [land_forest, land_steppe, land_cold, land_desert], key_place: [land_mountain]}
        forces: [land_mountain, land_lake]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        text: {"name": "a basin ringed by mountains, a lake at its centre", "heart": "the island-city in the lake", "ends": ["the fertile basin", "the unknown beyond the mountains"], "key_place": "the only pass out of the basin", "key_place_short": "the basin's only pass", "travel": "inward, over the lake and by the shore roads"}
      - id: spine_lone_mountain
        breadth: tight
        label: One giant mountain
        family: centred
        key_kind: descent
        parts: {heart: [land_mountain, land_highland], end_a: [land_mountain], end_b: [land_plain, land_forest, land_highland, land_steppe], key_place: [land_mountain, land_underground]}
        forces: [land_mountain]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        text: {"name": "a single giant mountain", "heart": "the largest city on the slope", "ends": ["the summit", "the foot"], "key_place": "the road up to the summit or the mouth that goes down into the mountain", "key_place_short": "the road into the mountain", "travel": "up and down in rings"}
      - id: spine_star_crater
        breadth: tight
        label: The crater of a fallen stone
        family: centred
        key_kind: descent
        parts: {heart: [], end_a: [land_glass_desert, land_crystal_forest, land_marsh, land_forest], end_b: [], key_place: [land_highland, land_mountain]}
        landmark: crater                 # a P3 landmark, not a palette kind (review #4)
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        merges_with:                     # owner, 2026-09-28: one crater, the spine's heart
          ruin_fallen_star: "the ruin's crater and star stone are the spine's heart crater"
          ruin_celestial_war: "the war's impact crater is the spine's heart crater"
        text: {"name": "the crater of a stone that fell from the sky", "heart": "the stone at the centre of the crater", "heart_short": "the town by the crater's stone", "ends": ["the changed inside of the crater", "outside the crater"], "key_place": "the only road down from the rim", "key_place_short": "the road down from the rim", "travel": "from the rim to the centre"}
        hooks:
          - {phase: P3, must: "the crater is a landmark and the heart's node"}
      - id: spine_oasis_ring
        breadth: tight
        label: An oasis and its ring
        family: centred
        key_kind: water
        parts: {heart: [land_desert], end_a: [land_desert], end_b: [land_plain, land_steppe, land_mountain, land_coast], key_place: [land_desert]}
        forces: [land_desert]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        text: {"name": "an oasis and the ring around it", "heart": "the oasis", "ends": ["the oasis", "the far side of the desert"], "key_place": "the oasis's water", "travel": "expeditions outward from the oasis; coming back is a must"}
      - id: spine_crossroads
        breadth: wide
        label: Four roads meeting
        family: centred
        key_kind: crossroad
        parts: {heart: [land_plain, land_steppe], end_a: [], end_b: [], end_c: [], end_d: [], key_place: [land_plain, land_steppe]}
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}]
        text: {"name": "a crossroads of four roads", "heart": "the crossroads city", "ends_both": "four different climates and countries in the four directions", "key_place": "the crossroads itself", "travel": "outward from the centre, along four arms"}
      # 3. fragmented
      - id: spine_archipelago
        breadth: wide
        label: An archipelago
        family: fragmented
        key_kind: crossing
        parts: {heart: [land_island], end_a: [land_island], end_b: [land_volcanic, land_forest, land_mountain, land_coast], key_place: [land_coast]}
        forces: [land_island, land_coast]
        weight_by: [{when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {era: [nautical]}}, x: 3}]
        text: {"name": "an archipelago", "heart": "the largest island", "ends": ["the inner islands", "the far and wild outer islands"], "key_place": "the only safe strait that links the islands", "key_place_short": "the only safe strait", "travel": "from island to island by ship, depending on the season"}
      - id: spine_valley_maze
        breadth: tight
        label: A maze of valleys
        family: fragmented
        key_kind: network
        parts: {heart: [land_plain, land_river], end_a: [land_forest, land_plain, land_river, land_highland, land_lake], end_b: [land_forest, land_plain, land_river, land_highland, land_lake], key_place: [land_mountain, land_underground]}
        forces: [land_mountain]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 3}]
        text: {"name": "a maze of valleys", "heart": "the widest valley", "ends_both": "valleys parted from one another by mountains, each the valley of a different people", "key_place": "the tunnels and passes that link the valleys", "key_place_short": "the tunnels between the valleys", "travel": "through the passes; each valley is a world apart"}
      - id: spine_forest_clearings
        breadth: tight
        label: Clearings in an endless forest
        family: fragmented
        key_kind: network
        parts: {heart: [land_plain, land_forest], end_a: [land_plain, land_highland, land_lake, land_marsh], end_b: [land_forest], key_place: [land_forest]}
        forces: [land_forest]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 0.25}]
        text: {"name": "the clearings of an endless forest", "heart": "the largest clearing", "ends": ["the clearings", "the depths of the forest"], "key_place": "the trails that link the clearings", "travel": "from clearing to clearing, without roads"}
      - id: spine_mesa_land
        breadth: tight
        label: A land of mesas
        family: fragmented
        key_kind: bridge
        parts: {heart: [land_highland], end_a: [land_highland, land_mountain], end_b: [land_desert, land_river], key_place: [land_highland, land_mountain]}
        forces_one_of: [land_desert, land_highland]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        text: {"name": "a land of mesas", "heart": "the city on top of the largest mesa", "heart_short": "the city on the great mesa", "ends": ["the inhabited mesa tops", "the wild canyons between"], "key_place": "the bridges and ropeways that link the mesas", "key_place_short": "the bridges between the mesas", "travel": "from mesa to mesa, descents into the canyons"}
      - id: spine_lake_chain
        breadth: wide
        label: A chain of lakes
        family: fragmented
        key_kind: crossing
        parts: {heart: [land_lake], end_a: [land_lake], end_b: [land_marsh, land_river, land_forest, land_cold], key_place: [land_lake, land_river]}
        forces: [land_lake]
        weight_by: [{when: {dial: {era: [underground]}}, x: 3}]
        text: {"name": "a chain of lakes", "heart": "the city on the strait that joins two lakes", "heart_short": "the city on the strait", "ends_both": "the lakes at the two ends of the chain", "key_place": "the strait between the lakes", "travel": "from lake to lake, by water"}
      # 4. layered
      - id: spine_three_depths
        breadth: tight
        label: Surface, middle depth and the deep
        family: layered
        claims: {below_ground: lived_in}
        key_kind: descent
        parts: {heart: [land_underground], end_a: [land_plain, land_forest, land_highland, land_mountain], end_b: [land_underground], key_place: [land_underground]}
        forces: [land_underground]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 3}]
        text: {"name": "the surface, the middle depth and the deep", "heart": "the city in the middle layer", "ends": ["the surface", "the deepest layer"], "key_place": "the great shaft or lift that links the layers", "key_place_short": "the great shaft", "travel": "down and up"}
      - id: spine_terraces
        breadth: tight
        label: Terraces
        family: layered
        key_kind: descent
        parts: {heart: [land_highland, land_plain], end_a: [land_highland], end_b: [land_plain], key_place: [land_river, land_highland, land_mountain]}
        forces: [land_highland, land_plain]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 0.25}, {when: {dial: {scale: [short]}}, x: 2}]
        text: {"name": "terraces", "heart": "the city on the middle terrace", "ends": ["the highland at the very top", "the plain at the very bottom"], "key_place": "the stairs and waterfalls between the terraces", "key_place_short": "the stairs between the terraces", "travel": "step by step"}
      - id: spine_two_worlds
        breadth: wide
        label: Two worlds, one over the other
        family: layered
        key_kind: network
        parts: {heart: [land_thin_place, land_plain], end_a: [], end_b: [land_thin_place], key_place: [land_thin_place]}
        forces: [land_thin_place]
        requires: {dial: {magic: [medium, high]}}
        merges_with:                     # owner, 2026-09-28: the rift is no separate place
          ruin_planar_rift: "the rift is the two worlds' crossing point, the key place"
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}]
        text: {"name": "two worlds, one on top of the other", "heart": "the city where the two worlds overlap", "heart_short": "the city between the worlds", "ends": ["our world", "the other plane"], "key_place": "the crossing points", "travel": "going back and forth between the two layers"}
      - id: spine_mountain_within
        breadth: tight
        label: The mountain's inside and outside
        family: layered
        claims: {below_ground: lived_in}
        key_kind: gate
        parts: {heart: [land_underground], end_a: [land_mountain], end_b: [land_underground], key_place: [land_mountain]}
        forces: [land_mountain, land_underground]
        weight_by: [{when: {dial: {era: [nautical]}}, x: 0.25}, {when: {dial: {era: [underground]}}, x: 3}]
