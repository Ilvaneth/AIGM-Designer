  # ── 3. the ruin source: what left the dangerous places (8 families, 40) ────────────────────
  ruin_source:
    roll:
      avoid_used: true
      family_wait: 3
      note: >-
        `sites` are sites.yaml's types the remnant yields (P6); `olgu_families` are the 2-3 families of
        the phenomenon rule its strangeness fits (item 25 review #6; family 8, born of the break, only
        with the scar); `remnant_kind` feeds the break's compatibility; `adds_palette` / `adds_biome` /
        `landmark` are what the row brings to the map.
    hooks_common:
      - {phase: P2, must: "one age of the history is this fall, told from its `what` line"}
      - {phase: P6, must: "the remnant's sites come from the row's `sites` types; at least one site stands in the remnant"}
      - {phase: P1, must: "unless the scar changed a magic rule, the phenomenon signature's home is this strangeness"}
    rows:
      # 1. fallen kingdoms
      - id: ruin_road_kingdom
        label: The road-building kingdom
        family: fallen_kingdoms
        remnant_kind: network
        sites: [site_stronghold, site_dungeon_ruin, site_dungeon_planned]
        olgu_families: [place_path, word_sign]
        text: {"name": "the road-building kingdom", "what": "the kingdom that laced the land with stone roads and forts collapsed in civil war", "remnant": "the stone road network and the road forts", "sites": "road forts, bridge towers, buried treasure vaults", "strangeness": "the old roads still lead whoever walks them somewhere"}
      - id: ruin_water_kingdom
        label: The water kingdom
        family: fallen_kingdoms
        remnant_kind: network
        sites: [site_dungeon_planned, site_dungeon_ruin]
        olgu_families: [matter, magic_behaviour, place_path]
        text: {"name": "the water kingdom", "what": "the kingdom that built cisterns and aqueducts fell apart when it lost its water", "remnant": "aqueducts and cisterns", "sites": "cisterns, canals, sluice chambers", "strangeness": "the old magic that steers the water still works"}
      - id: ruin_sorcerer_kings
        label: The sorcerer-king dynasty
        family: fallen_kingdoms
        remnant_kind: structure
        sites: [site_dungeon_planned, site_dungeon_ruin]
        olgu_families: [body_blood, word_sign]
        text: {"name": "the dynasty of sorcerer-kings", "what": "the dynasty that ruled by magic was brought down by its own magic", "remnant": "palace-towers", "sites": "towers, experiment vaults, guardian golems", "strangeness": "the magic still recognises the dynasty's blood"}
      - id: ruin_city_states
        label: The city-states
        family: fallen_kingdoms
        remnant_kind: city
        adds_biome: biome_dead_city_lands
        sites: [site_urban, site_dungeon_ruin, site_dungeon_planned]
        olgu_families: [magic_behaviour, word_sign]
        text: {"name": "the city-states", "what": "the cities turned on one another and finished one another off", "remnant": "walled, empty cities", "sites": "abandoned cities, merchant vaults, wall towers", "strangeness": "the cities' warding spells still drive the stranger away"}
      - id: ruin_steppe_union
        label: The steppe union
        family: fallen_kingdoms
        remnant_kind: city
        requires: {any_of: [land_steppe]}
        sites: [site_dungeon_ruin, site_dungeon_tomb, site_stronghold]
